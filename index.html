om sample checked by business users.\n\n**Step 5 — Final Load (Week 4)**\nAfter test load sign-off, the final load runs, usually during a planned window before go-live. In-flight work items are frozen in the legacy system for a short cutover period (typically 24–48 hours).\n\n**Step 6 — Validation and Sign-Off (Week 4)**\nThe customer confirms reconciliation results. Migration must be signed off before UAT is completed and before the go/no-go meeting.\n\n### Data Quality Acceptance Criteria\n\n| Check | Threshold |\n|---|---|\n| Record count match | 100% |\n| Mandatory fields populated | 100% |\n| Key numeric totals (e.g., invoice amounts) | Exact match |\n| Random sample accuracy | At least 99.5% |\n| Duplicate records | 0 after cleansing |\n\n### Roles\n\n| Role | Responsibility |\n|---|---|\n| NexaFlow Integration Engineer | Migration tooling, mapping workbook, test and final loads |\n| Customer Data Owner | Approves mapping, fixes source data, signs off reconciliation |\n| Customer IT | Provides extracts and database access |\n| Business Users | Validate random samples |\n\n### Security During Migration\n\n- Files are transferred via encrypted SFTP or direct connector, never by email.\n- Staging data is encrypted at rest (AES-256) and access is logged.\n- Temporary migration files are deleted within 14 days of sign-off.\n- For healthcare customers, PHI is migrated only after the BAA is signed.\n\n### Rollback\n\nIf the final load fails reconciliation, the load is rolled back, the legacy system remains the system of record, and the go-live date is re-planned. Rollback procedures are rehearsed during the test load.\n\n### Timeline Risks\n\n| Risk | Impact |\n|---|---|\n| Poor source data quality | +1 to +3 weeks |\n| Extracts delivered late | Day-for-day delay |\n| More than 1M records or multiple sources | Project classified as complex (8–12 weeks) |\n| Mapping changes after sign-off | Additional test load cycle (+1 week) |\n\n## Key Facts\n\n- Data migration is Phase 5, typically weeks 3–4 of a standard enterprise implementation.\n- Standard package covers up to 1 million records from 1–2 sources.\n- Six steps: inventory, mapping, extraction/cleansing, test load, final load, validation.\n- Random sample accuracy must be at least 99.5%; record counts must match 100%.\n- Large or multi-source migrations push onboarding to 8–12 weeks.\n\n## Related Documents\n\n- onboarding_guide.md\n- implementation_timeline.md\n- enterprise_setup.md\n- integration_guide.md\n\n## Retrieval Notes\n\nRetrieve for questions about moving data into NexaFlow, legacy data, CSV import, data mapping, data quality checks, cutover or migration timeline risks. For a general enterprise onboarding process question, this file is supporting detail; the primary files are `onboarding_guide.md`, `implementation_timeline.md` and `enterprise_setup.md`."},{"document_id":"NEXA-012","title":"Enterprise Setup Guide","document_type":"Guide","main_category":"Implementation","secondary_topics":["SSO and SCIM","Security review","Data residency and single-tenant deployment","NexaFlow Relay installation","Audit log configuration"],"rag_tags":["enterprise-setup","environment-setup","tenant-provisioning","sso-configuration","saml","scim","role-mapping","custom-roles","workspaces","data-residency","single-tenant","relay-installation"],"version":"2.8","status":"Current","last_updated":"2026-07-20","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["18_onboarding_guide.md","14_implementation_timeline.md","24_security_overview.md","10_enterprise_capabilities.md"],"summary":"Step-by-step Enterprise technical setup during onboarding: security review, tenant provisioning, SSO, SCIM and role mapping, workspace governance, Relay installation, audit configuration and the go-live checklist.","key_topics":["Security review should start at contract signature; standard reviews take 1–2 weeks.","Environment setup (tenant, SSO, SCIM, roles) happens in week 2 of a standard implementation.","Single-tenant deployment adds about 1 week; Relay setup commonly adds 1–2 weeks.","IdP groups map to NexaFlow roles and workspaces via SCIM.","Standard enterprise onboarding is 4–6 weeks; complex setups push it to 8–12 weeks."],"use_when":"Someone asks how an Enterprise tenant is configured during onboarding, what IT and security teams need to do, or what enterprise-specific steps affect the onboarding timeline. Note conflict C2: its 6–8 week scenario is not a track in 14_implementation_timeline.md, which is authoritative for duration.","file":"knowledge_base/03_implementation/12_enterprise_setup.md","filename":"12_enterprise_setup.md","folder":"03_implementation","retrieval_notes":"Retrieve for enterprise onboarding questions involving SSO, SCIM, roles, workspaces, data residency, single-tenant setup, Relay installation, security review or the go-live checklist. For \"what is the enterprise onboarding process and timeline\", retrieve this file together with `onboarding_guide.md` and `implementation_timeline.md`.","body":"# Enterprise Setup Guide\n\n## Metadata\n\n- Category: Implementation\n- Document Type: Technical Setup Guide\n- Version: 2.8\n- Status: Current\n- Last Updated: 2026-07-20\n- Authoritative: Yes\n- Keywords: enterprise setup, environment setup, tenant provisioning, SSO configuration, SAML, SCIM, role mapping, custom roles, workspaces, data residency, single-tenant, Relay installation, security review, go-live checklist, enterprise onboarding\n- Use When: Someone asks how an Enterprise tenant is configured during onboarding, what IT and security teams need to do, or what enterprise-specific steps affect the onboarding timeline.\n\n## Summary\n\nThis guide covers the Enterprise-specific technical setup that happens during onboarding, mainly in Phase 3 (Environment Setup) and Phase 4 (Integration Configuration) of the nine-phase process in `onboarding_guide.md`. It explains tenant provisioning, SSO and SCIM, workspace and role design, security review, Relay installation and the go-live checklist. In a standard 4–6 week implementation, environment setup is completed in week 2; single-tenant deployments, strict data residency or extended security reviews move projects toward the 8–12 week track described in `implementation_timeline.md`.\n\n## Main Content\n\n### Step 1: Pre-Kickoff Security Review (Starts at Signature)\n\nEnterprise customers almost always run a vendor security review. To avoid delaying the project:\n\n1. NexaFlow shares the SOC 2 Type II report, ISO 27001 certificate and CAIQ questionnaire via the Trust Center on the day of signature.\n2. The customer security team submits additional questions within 5 business days.\n3. Standard reviews complete in 1–2 weeks, running in parallel with discovery and design.\n4. Reviews requiring on-site assessments, custom penetration testing or HIPAA BAA negotiation take 3–6 weeks and classify the project as complex.\n\n### Step 2: Tenant Provisioning (Week 2)\n\n| Decision | Options | Timeline Impact |\n|---|---|---|\n| Deployment | Multi-tenant (default) or single-tenant | Single-tenant adds ~1 week |\n| Region | US (Virginia), EU (Frankfurt), APAC (Sydney) | None if chosen before kickoff |\n| Environments | Development, Staging, Production | Included |\n| Encryption keys | NexaFlow-managed or customer-managed (AWS KMS) | CMK adds 2–3 days of customer IT work |\n\nThe region cannot be changed after data is loaded without a migration project.\n\n### Step 3: Single Sign-On (Week 2)\n\n1. Customer identity admin creates a SAML 2.0 or OIDC application in Okta, Microsoft Entra ID, Ping or Google Workspace.\n2. NexaFlow provides the ACS URL and entity ID; the customer returns metadata.\n3. Test with 3–5 pilot users in Development.\n4. Enforce SSO for all users and disable password login (break-glass admin account retained).\n\nTypical effort: 2–5 business days of the customer identity team's time.\n\n### Step 4: SCIM Provisioning and Role Mapping (Week 2)\n\n- Enable SCIM 2.0 from the identity provider to automatically create, update and deactivate users.\n- Map identity provider groups to NexaFlow roles, for example:\n\n| IdP Group | NexaFlow Role | Workspace |\n|---|---|---|\n| NF-Platform-Admins | Admin | All |\n| NF-Finance-Builders | Builder | Finance |\n| NF-Finance-AP-Team | Operator | Finance |\n| NF-Leadership | Viewer | All |\n\n- Create custom roles if needed (for example \"Payment Approver over $10,000\").\n- Deactivation in the IdP removes NexaFlow access within 40 minutes.\n\n### Step 5: Workspace and Governance Design (Weeks 1–2)\n\n- One workspace per business unit or major process area.\n- Decide which connectors each workspace may use.\n- Configure promotion rules: flows move Development → Staging → Production with required approval.\n- Nominate Center of Excellence (CoE) admins who approve production changes.\n\n### Step 6: Network and Relay Setup (Weeks 2–3, if needed)\n\nFor on-premise systems:\n1. Customer provisions a Linux or Windows VM (2 vCPU, 8 GB RAM) or Docker host.\n2. Allow outbound TLS 443 to the NexaFlow region endpoint; no inbound ports needed.\n3. Install two Relay instances for high availability.\n4. Register Relays in the Admin Console and test connectivity.\n\nRelay setup requires network and security approvals and commonly adds 1–2 weeks.\n\n### Step 7: Audit and Compliance Configuration\n\n- Set audit log retention (1 year default, up to 7 years).\n- Configure SIEM streaming to Splunk, Datadog or Microsoft Sentinel.\n- Enable IP allowlisting and session timeout policies.\n- Configure PII redaction and approved AI model list for Agent Studio.\n\n### Step 8: Enterprise Go-Live Checklist\n\n- [ ] Security review approved and documented\n- [ ] SSO enforced; SCIM provisioning verified\n- [ ] Roles and workspace permissions reviewed by customer security\n- [ ] All in-scope integrations tested in Staging with production credentials\n- [ ] Data migration reconciled and signed off\n- [ ] UAT signed off with zero open critical defects\n- [ ] Failure alerts routed to on-call channels\n- [ ] Audit log streaming confirmed\n- [ ] Rollback plan documented\n- [ ] Go/no-go meeting held 2 business days before cutover\n- [ ] Hypercare contacts and schedule shared\n\n### Enterprise Setup and the Overall Timeline\n\n| Scenario | Environment Setup Duration | Overall Timeline |\n|---|---|---|\n| Multi-tenant, SSO + SCIM, standard review | Week 2 | 4–6 weeks |\n| Single-tenant or customer-managed keys | Weeks 2–3 | 6–8 weeks |\n| Single-tenant + Relay + extended security review | Weeks 3–5 | 8–12 weeks |\n\n## Key Facts\n\n- Security review should start at contract signature; standard reviews take 1–2 weeks.\n- Environment setup (tenant, SSO, SCIM, roles) happens in week 2 of a standard implementation.\n- Single-tenant deployment adds about 1 week; Relay setup commonly adds 1–2 weeks.\n- IdP groups map to NexaFlow roles and workspaces via SCIM.\n- Standard enterprise onboarding is 4–6 weeks; complex setups push it to 8–12 weeks.\n\n## Related Documents\n\n- onboarding_guide.md\n- implementation_timeline.md\n- security_overview.md\n- enterprise_capabilities.md\n\n## Retrieval Notes\n\nRetrieve for enterprise onboarding questions involving SSO, SCIM, roles, workspaces, data residency, single-tenant setup, Relay installation, security review or the go-live checklist. For \"what is the enterprise onboarding process and timeline\", retrieve this file together with `onboarding_guide.md` and `implementation_timeline.md`."},{"document_id":"NEXA-014","title":"Implementation Timeline","document_type":"Timeline & Planning Reference","main_category":"Implementation","secondary_topics":["Implementation fees (Standard vs Complex)","Security review dependency","Integration and data migration scope","Communicating timelines to customers"],"rag_tags":["implementation-timeline","onboarding-timeline","how-long","weeks","go-live-date","project-plan","standard-implementation","complex-implementation","4-6-weeks","8-12-weeks","milestones","schedule-risks"],"version":"3.1","status":"Current","last_updated":"2026-07-15","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["18_onboarding_guide.md","12_enterprise_setup.md","07_data_migration_process.md","15_integration_guide.md"],"summary":"Week-by-week plans for the standard 4–6 week and complex 8–12 week Enterprise implementations, the criteria for classifying a project as complex, critical-path dependencies and common causes of delay.","key_topics":["Standard enterprise implementation: 4–6 weeks from kickoff to go-live.","Complex deployments: 8–12 weeks.","Main drivers of complexity: integrations, data migration volume, security review and stakeholder availability.","30-day hypercare follows every enterprise go-live.","Security review should start at contract signature to protect the timeline."],"use_when":"Someone asks how long implementation or onboarding takes, when go-live can happen, what happens each week, or what makes a project take longer. Authoritative source for implementation duration and the standard/complex classification (see conflicts C2 and C3 in the root index).","file":"knowledge_base/03_implementation/14_implementation_timeline.md","filename":"14_implementation_timeline.md","folder":"03_implementation","retrieval_notes":"Retrieve for any question about duration: \"how long does onboarding take\", \"typical implementation timeline\", \"when can we go live\", \"why would it take 12 weeks\". For what happens inside each phase also retrieve `onboarding_guide.md`; for enterprise technical setup retrieve `enterprise_setup.md`. Case studies contain example timelines but are not the authoritative source.","body":"# Implementation Timeline\n\n## Metadata\n\n- Category: Implementation\n- Document Type: Timeline & Planning Reference\n- Version: 3.1\n- Status: Current\n- Last Updated: 2026-07-15\n- Authoritative: Yes\n- Keywords: implementation timeline, onboarding timeline, how long, weeks, go-live date, project plan, standard implementation, complex implementation, 4-6 weeks, 8-12 weeks, milestones, schedule risks, delays\n- Use When: Someone asks how long implementation or onboarding takes, when go-live can happen, what happens each week, or what makes a project take longer.\n\n## Summary\n\nA standard NexaFlow Enterprise implementation takes **4–6 weeks** from kickoff to go-live, followed by 30 days of hypercare. Complex deployments typically take **8–12 weeks**, depending on the number of integrations, the volume of data migration, security review requirements and stakeholder availability. This document gives the week-by-week plan, milestones and the criteria used to classify a project as standard or complex. Phase descriptions are in `onboarding_guide.md`.\n\n## Main Content\n\n### Standard Enterprise Timeline (4–6 Weeks)\n\n| Week | Phase | Key Activities | Milestone |\n|---|---|---|---|\n| Week 1 | 1. Discovery and Requirements | Kickoff, process workshops, system inventory, success metrics | Requirements signed off (end of week 1) |\n| Weeks 1–2 | 2. Solution Design | Workflow and agent design, roles, integration architecture | Solution Design approved |\n| Week 2 | 3. Environment Setup | Tenant provisioning, SSO, SCIM, workspaces, roles | Environments ready |\n| Weeks 2–3 | 4. Integration Configuration | Connect up to 5 systems, field mapping, build flows in Dev | Integrations working in Dev |\n| Weeks 3–4 | 5. Data Migration | Cleanse, map, test load, full migration (up to 1M records) | Migration validated |\n| Weeks 4–5 | 6. Testing | SIT, UAT in Staging, defect fixing | UAT sign-off |\n| Week 5 | 7. User Training | Admin, builder, operator and approver training | Training complete |\n| Weeks 5–6 | 8. Go-Live | Go/no-go meeting, cutover, production promotion | Live in Production |\n| +30 days | 9. Post-Launch Support | Hypercare, adoption tracking, CSM handover | Hypercare exit review |\n\nSimple projects with few integrations and minimal migration go live at the end of week 4. Most standard projects go live in week 5 or 6.\n\n### Complex Enterprise Timeline (8–12 Weeks)\n\n| Weeks | Phase |\n|---|---|\n| Weeks 1–2 | Discovery and requirements (multiple business units or regions) |\n| Weeks 2–3 | Solution design, security review in parallel |\n| Weeks 3–4 | Environment setup (single-tenant or data residency adds ~1 week), Relay installation |\n| Weeks 4–6 | Integration configuration (6+ systems, custom APIs, on-premise) |\n| Weeks 5–8 | Data migration (above 1M records, multiple migration cycles) |\n| Weeks 7–10 | Testing, including performance and security testing |\n| Weeks 9–11 | Training by role and region, often in waves |\n| Weeks 10–12 | Go-live (sometimes phased by business unit) |\n| +30 days | Hypercare |\n\n### Standard vs Complex: Classification Criteria\n\nA project is planned as **complex (8–12 weeks)** if any two of the following apply, or if any one applies at large scale:\n\n| Factor | Standard (4–6 weeks) | Complex (8–12 weeks) |\n|---|---|---|\n| Integrations | Up to 5 pre-built connectors | 6+ integrations, custom APIs, or on-premise via Relay |\n| Data migration | Up to 1 million records, one source | Over 1 million records or multiple legacy sources |\n| Security review | Standard questionnaire + SOC 2 (1–2 weeks) | Custom security assessment, penetration test coordination, HIPAA BAA, regulator requirements |\n| Deployment | Multi-tenant, standard region | Single-tenant, customer-managed keys, strict data residency |\n| Scope | 1–2 business units | Multiple business units, regions or languages |\n| Stakeholder availability | Dedicated project lead and timely UAT | Limited availability, many approvers, change freezes |\n\nComplex projects use the $35,000 Complex Implementation package; standard projects use the $15,000 Standard package (see `pricing_guide_v3.md`).\n\n### Critical Path and Dependencies\n\n1. **Security review** must be approved before production credentials are issued; start it at contract signature, not at kickoff.\n2. **SSO configuration** depends on the customer's identity team and often takes 2–5 business days of their time.\n3. **Sandbox access** for each integrated system must be available by the start of week 2.\n4. **Data extracts** must be delivered by the start of week 3.\n5. **UAT testers** must be booked for weeks 4–5.\n\nA delay in any of these moves the go-live date by at least the same amount.\n\n### Most Common Reasons Timelines Slip\n\n| Cause | Typical Impact |\n|---|---|\n| Security review not started early | +2 to +4 weeks |\n| Integration sandbox unavailable | +1 to +2 weeks |\n| Poor data quality found during test load | +1 to +3 weeks |\n| Stakeholders unavailable for workshops or UAT | +1 to +2 weeks |\n| Scope added after design sign-off | +1 week per major workflow |\n\n### How to Communicate Timelines to Customers\n\n- Quote \"4–6 weeks for a standard enterprise implementation\" only after checking the classification criteria.\n- For regulated industries (financial services, healthcare) or on-premise systems, set expectations at 8–12 weeks.\n- Always state that 30 days of hypercare follow go-live.\n- Never promise a go-live date before discovery is complete.\n\n## Key Facts\n\n- Standard enterprise implementation: 4–6 weeks from kickoff to go-live.\n- Complex deployments: 8–12 weeks.\n- Main drivers of complexity: integrations, data migration volume, security review and stakeholder availability.\n- 30-day hypercare follows every enterprise go-live.\n- Security review should start at contract signature to protect the timeline.\n\n## Related Documents\n\n- onboarding_guide.md\n- enterprise_setup.md\n- data_migration_process.md\n- integration_guide.md\n\n## Retrieval Notes\n\nRetrieve for any question about duration: \"how long does onboarding take\", \"typical implementation timeline\", \"when can we go live\", \"why would it take 12 weeks\". For what happens inside each phase also retrieve `onboarding_guide.md`; for enterprise technical setup retrieve `enterprise_setup.md`. Case studies contain example timelines but are not the authoritative source."},{"document_id":"NEXA-018","title":"Customer Onboarding Guide","document_type":"Guide","main_category":"Implementation","secondary_topics":["Implementation timeline","Enterprise technical setup","Data migration","Training","Project governance"],"rag_tags":["onboarding","onboarding-process","implementation-phases","enterprise-onboarding","kickoff","discovery","solution-design","environment-setup","integration-configuration","data-migration","testing","uat"],"version":"3.1","status":"Current","last_updated":"2026-07-15","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["14_implementation_timeline.md","12_enterprise_setup.md","07_data_migration_process.md","25_training_and_adoption.md"],"summary":"Describes onboarding paths by plan and the nine-phase Enterprise guided implementation, roles and responsibilities, what the customer must provide, project governance and common causes of delay.","key_topics":["Enterprise onboarding has nine phases: discovery, solution design, environment setup, integration configuration, data migration, testing, training, go-live, post-launch support.","Standard enterprise timeline: 4–6 weeks; complex deployments: 8–12 weeks.","Kickoff occurs within 5 business days of signature.","30-day hypercare follows go-live.","Customers must supply a sponsor, project lead, sandbox access and UAT testers."],"use_when":"Someone asks what the onboarding process is, what happens in each phase, who is involved, or what the customer must provide.","file":"knowledge_base/03_implementation/18_onboarding_guide.md","filename":"18_onboarding_guide.md","folder":"03_implementation","retrieval_notes":"Retrieve for \"what is the onboarding process\", \"what happens after we sign\", \"implementation phases\", \"who is involved in onboarding\" and \"what do we need to provide\". For the week-by-week duration also retrieve `implementation_timeline.md`; for SSO/SCIM/workspace configuration during enterprise onboarding also retrieve `enterprise_setup.md`. Pricing and case study files are not needed for process questions.","body":"# Customer Onboarding Guide\n\n## Metadata\n\n- Category: Implementation\n- Document Type: Process Guide\n- Version: 3.1\n- Status: Current\n- Last Updated: 2026-07-15\n- Authoritative: Yes\n- Keywords: onboarding, onboarding process, implementation phases, enterprise onboarding, kickoff, discovery, solution design, environment setup, integration configuration, data migration, testing, UAT, training, go-live, hypercare, roles and responsibilities\n- Use When: Someone asks what the onboarding process is, what happens in each phase, who is involved, or what the customer must provide.\n\n## Summary\n\nThis guide describes how new NexaFlow customers are onboarded, from contract signature to post-launch support. Enterprise customers follow a nine-phase guided implementation that typically takes 4–6 weeks, while complex deployments take 8–12 weeks. The week-by-week schedule is defined in `implementation_timeline.md`, and Enterprise-specific technical setup (SSO, SCIM, workspaces, data residency) is covered in `enterprise_setup.md`.\n\n## Main Content\n\n### Onboarding Paths by Plan\n\n| Plan | Onboarding Path | Typical Duration |\n|---|---|---|\n| Starter | Self-serve: online academy, templates, in-app checklist | 1–3 days |\n| Professional | Self-serve or optional Quick Start package ($5,000) | 2 weeks with Quick Start |\n| Enterprise | Guided implementation (required) | 4–6 weeks standard; 8–12 weeks complex |\n\nThe rest of this guide focuses on the Enterprise guided implementation.\n\n### The Enterprise Onboarding Process: Nine Phases\n\n**Phase 1 — Discovery and Requirements**\nA kickoff meeting within 5 business days of contract signature introduces both teams. The NexaFlow solution architect runs discovery workshops to document the processes in scope, systems to integrate, data to migrate, security requirements, success metrics and the target go-live date. Output: signed-off Requirements Document.\n\n**Phase 2 — Solution Design**\nThe solution architect designs the workflows, AI agents, workspace structure, roles and integration architecture. The customer reviews and approves the Solution Design Document. Changes after sign-off go through a change request.\n\n**Phase 3 — Environment Setup**\nNexaFlow provisions the tenant in the chosen region with Development, Staging and Production environments. The customer's IT team configures SSO, and for Enterprise, SCIM provisioning and role mapping. Details in `enterprise_setup.md`.\n\n**Phase 4 — Integration Configuration**\nThe integration engineer connects the in-scope systems (up to 5 in the standard package) using service accounts, maps fields and builds the flows in Development. On-premise systems require installing NexaFlow Relay.\n\n**Phase 5 — Data Migration**\nHistorical or reference data (for example open purchase requests, supplier lists or active cases) is cleansed, mapped, test-loaded and then migrated. The standard package covers up to 1 million records. See `data_migration_process.md`.\n\n**Phase 6 — Testing**\nSystem integration testing (SIT) is run by NexaFlow; user acceptance testing (UAT) is run by the customer's business users in Staging using real scenarios. Go-live requires zero open critical defects and UAT sign-off.\n\n**Phase 7 — User Training**\nRole-based training for admins, builders, operators and approvers, delivered live and through the NexaFlow Academy. See `training_and_adoption.md`.\n\n**Phase 8 — Go-Live**\nFlows are promoted to Production following a go-live checklist and cutover plan, usually mid-week with a rollback plan ready. A go/no-go meeting is held 2 business days before cutover.\n\n**Phase 9 — Post-Launch Support (Hypercare)**\n30 days of hypercare after go-live: daily check-ins in week 1, twice-weekly afterwards, priority defect resolution and a handover to the named Customer Success Manager. The hypercare period is **in addition to** the 4–6 week implementation window.\n\n### Roles and Responsibilities\n\n| NexaFlow | Customer |\n|---|---|\n| Engagement Manager — plan, status, risks | Executive Sponsor — decisions, priority, escalation |\n| Solution Architect — discovery and design | Project Lead — day-to-day coordination (about 50% time) |\n| Integration Engineer — connectors, migration | IT/Identity Admin — SSO, SCIM, network, Relay |\n| Trainer — role-based training | Process Owners — requirements and UAT |\n| Customer Success Manager — adoption after launch | Security Team — security review and approvals |\n\n### What the Customer Must Provide\n\n- A named executive sponsor and project lead before kickoff.\n- Access to sandbox instances of each system to be integrated.\n- Service accounts with required permissions.\n- Sample and full data extracts for migration.\n- Security questionnaire responses and approvals.\n- UAT testers available during testing weeks.\n\n### Governance\n\n- Weekly status meeting and written status report (RAG status: red/amber/green).\n- Steering committee every two weeks for Enterprise projects.\n- Risks that threaten the go-live date are escalated within 2 business days.\n\n### What Slows Onboarding Down\n\nThe most common causes of delay are late security review approval, unavailable sandbox systems, unclear data ownership, and business stakeholders not available for workshops or UAT. When these factors apply from the start, the project is planned on the complex 8–12 week track.\n\n## Key Facts\n\n- Enterprise onboarding has nine phases: discovery, solution design, environment setup, integration configuration, data migration, testing, training, go-live, post-launch support.\n- Standard enterprise timeline: 4–6 weeks; complex deployments: 8–12 weeks.\n- Kickoff occurs within 5 business days of signature.\n- 30-day hypercare follows go-live.\n- Customers must supply a sponsor, project lead, sandbox access and UAT testers.\n\n## Related Documents\n\n- implementation_timeline.md\n- enterprise_setup.md\n- data_migration_process.md\n- training_and_adoption.md\n\n## Retrieval Notes\n\nRetrieve for \"what is the onboarding process\", \"what happens after we sign\", \"implementation phases\", \"who is involved in onboarding\" and \"what do we need to provide\". For the week-by-week duration also retrieve `implementation_timeline.md`; for SSO/SCIM/workspace configuration during enterprise onboarding also retrieve `enterprise_setup.md`. Pricing and case study files are not needed for process questions."},{"document_id":"NEXA-025","title":"Training and Adoption Program","document_type":"Guide","main_category":"Implementation","secondary_topics":["Adoption metrics","Change management","Customer success and hypercare","Certifications"],"rag_tags":["training","user-training","adoption","nexaflow-academy","certification","admin-training","builder-training","operator-training","champions","change-management","adoption-metrics","hypercare"],"version":"2.0","status":"Current","last_updated":"2026-06-12","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["18_onboarding_guide.md","14_implementation_timeline.md","12_enterprise_setup.md","06_customer_faq.md"],"summary":"Describes Phase 7 user training and post-launch adoption: training included by plan, role-based tracks, the schedule within onboarding, certifications, the champions program, change management and adoption metrics.","key_topics":["Training is Phase 7, usually week 5 of a standard enterprise implementation.","Enterprise gets role-based tracks for admins, builders, agent builders, operators and approvers.","Approvers need only a 10-minute video; operators a 90-minute session.","Adoption target: 70% weekly active users by day 30, 85% by day 90.","Hypercare lasts 30 days after go-live, then CSM handover and QBRs."],"use_when":"Someone asks how users are trained, what training is included, how adoption is measured, or what happens after go-live to drive usage.","file":"knowledge_base/03_implementation/25_training_and_adoption.md","filename":"25_training_and_adoption.md","folder":"03_implementation","retrieval_notes":"Retrieve for questions about training, certification, champions, change management, adoption targets or what happens after go-live. For an overall onboarding process or timeline question this file is optional supporting detail; primary files are `onboarding_guide.md`, `implementation_timeline.md` and `enterprise_setup.md`.","body":"# Training and Adoption Program\n\n## Metadata\n\n- Category: Implementation\n- Document Type: Program Guide\n- Version: 2.0\n- Status: Current\n- Last Updated: 2026-06-12\n- Authoritative: Yes\n- Keywords: training, user training, adoption, NexaFlow Academy, certification, admin training, builder training, operator training, champions, change management, adoption metrics, hypercare, customer success\n- Use When: Someone asks how users are trained, what training is included, how adoption is measured, or what happens after go-live to drive usage.\n\n## Summary\n\nUser training is Phase 7 of NexaFlow onboarding and typically happens in week 5 of a standard 4–6 week enterprise implementation. This document describes role-based training tracks, NexaFlow Academy certifications, the champions program, change management practices and adoption metrics tracked during the 30-day hypercare period and beyond.\n\n## Main Content\n\n### Training Included by Plan\n\n| Plan | Included Training |\n|---|---|\n| Starter | Self-paced NexaFlow Academy courses |\n| Professional | Academy + 2 live virtual sessions (admin and builder) |\n| Enterprise | Full role-based training program, train-the-trainer, champions program |\n\nOn-site custom workshops are available for $4,000 per day (see `pricing_guide_v3.md`).\n\n### Role-Based Training Tracks (Enterprise)\n\n| Track | Audience | Format | Duration | Outcome |\n|---|---|---|---|---|\n| Platform Admin | IT and CoE admins | Live virtual + labs | 2 × 3-hour sessions | Manage users, roles, SSO, connectors, audit logs |\n| Flow Builder | Business analysts, automation team | Live + hands-on project | 3 × 3-hour sessions | Build, test and publish flows |\n| Agent Builder | Advanced builders | Live + labs | 2 × 3-hour sessions | Configure AI agents, knowledge sources, thresholds |\n| Operator | Teams handling exceptions and queues | Live virtual | 1 × 90 minutes | Work queues, approvals, dashboards |\n| Approver / Viewer | Managers and approvers | 10-minute video + quick guide | Self-paced | Approve in Slack/Teams/email, read dashboards |\n\nTraining uses the customer's own workflows from Staging, not generic demos, so users practise on processes they will actually run.\n\n### Training Schedule Within Onboarding\n\n- **Week 2:** Platform Admin training (so IT can configure SSO and roles).\n- **Weeks 2–3:** Flow Builder training for the customer's automation team (they build alongside NexaFlow).\n- **Week 5:** Operator and Approver training, close to go-live so knowledge is fresh.\n- **Go-live week:** floor support and open \"office hours\" sessions.\n\nFor complex 8–12 week projects, operator training is delivered in waves by business unit or region.\n\n### NexaFlow Academy Certifications\n\n| Certification | Requirement |\n|---|---|\n| NexaFlow Certified Admin | Course + 40-question exam |\n| NexaFlow Certified Builder | Course + build project reviewed by NexaFlow |\n| NexaFlow Certified Agent Designer | Builder certification + agent project |\n\nEnterprise customers receive 10 free certification vouchers per year.\n\n### Champions Program\n\nEach department nominates one or two champions who:\n- attend extra training and a monthly champions call,\n- act as first-line support for colleagues,\n- collect improvement ideas for new workflows,\n- share wins in internal channels.\n\nCustomers with active champions reach target adoption about 30% faster than those without.\n\n### Change Management Practices\n\n1. **Explain the why** — the executive sponsor announces the change and the expected benefits before training.\n2. **Start small** — launch with 2–3 high-value workflows rather than everything at once.\n3. **Remove the old path** — retire the legacy spreadsheet or email process shortly after go-live so users do not work in two places.\n4. **Celebrate early wins** — share hours saved and faster cycle times from Command Center dashboards.\n5. **Listen** — run a feedback survey at day 14 and day 30.\n\n### Adoption Metrics\n\n| Metric | Target by Day 30 | Target by Day 90 |\n|---|---|---|\n| Licensed users active weekly | 70% | 85% |\n| Workflows in production vs planned | 100% of phase 1 | Phase 2 started |\n| Exceptions resolved within SLA | 90% | 95% |\n| Approvals completed in Slack/Teams/email | 60% | 80% |\n| AI agent override rate | Below 15% | Below 10% |\n\n### Post-Launch Support and Customer Success\n\n- **Hypercare (first 30 days after go-live):** daily check-ins in week 1, then twice weekly; priority defect handling; weekly adoption report.\n- **Hypercare exit review:** adoption metrics reviewed and handover to the named Customer Success Manager.\n- **Quarterly business reviews:** ROI, adoption, roadmap and next workflows to automate.\n- **Health score:** combines usage, support tickets and executive engagement to flag at-risk accounts.\n\n## Key Facts\n\n- Training is Phase 7, usually week 5 of a standard enterprise implementation.\n- Enterprise gets role-based tracks for admins, builders, agent builders, operators and approvers.\n- Approvers need only a 10-minute video; operators a 90-minute session.\n- Adoption target: 70% weekly active users by day 30, 85% by day 90.\n- Hypercare lasts 30 days after go-live, then CSM handover and QBRs.\n\n## Related Documents\n\n- onboarding_guide.md\n- implementation_timeline.md\n- enterprise_setup.md\n- customer_faq.md\n\n## Retrieval Notes\n\nRetrieve for questions about training, certification, champions, change management, adoption targets or what happens after go-live. For an overall onboarding process or timeline question this file is optional supporting detail; primary files are `onboarding_guide.md`, `implementation_timeline.md` and `enterprise_setup.md`."},{"document_id":"NEXA-006","title":"Customer FAQ","document_type":"FAQ","main_category":"Sales Enablement","secondary_topics":["Product and AI capabilities","Security and compliance","Implementation timeline","Pricing and contracts","Customer results"],"rag_tags":["faq","customer-questions","prospect-questions","what-is-nexaflow","integrations","security","ai","implementation-time","support","pricing-overview","trial","data-ownership"],"version":"2.5","status":"Current","last_updated":"2026-07-18","authoritative":"No","supersedes":"None","contains_outdated_information":"No","related_documents":["23_sales_playbook.md","17_objection_handling.md","21_product_overview.md","20_pricing_guide_v3.md"],"summary":"Short, customer-safe answers to common prospect questions about the product, AI, security, implementation, support, pricing and results. It is a summary document that points to the authoritative source for each precise figure.","key_topics":["Short, customer-safe answers; authoritative detail lives in linked documents.","NexaFlow is cloud-only; no on-premise installation.","Standard enterprise implementation: 4–6 weeks; complex: 8–12 weeks.","Customer data is never used to train AI models.","14-day free trial on Starter and Professional."],"use_when":"A prospect or customer asks a common, general question and a short answer is enough, or a seller needs a quick reference before a call. Not authoritative: for exact figures use the cited source (for example 20_pricing_guide_v3.md for prices or 14_implementation_timeline.md for timelines).","file":"knowledge_base/04_sales_enablement/06_customer_faq.md","filename":"06_customer_faq.md","folder":"04_sales_enablement","retrieval_notes":"Retrieve for quick, general prospect questions when a short answer is enough. When the question needs exact figures or detailed process steps, prefer the authoritative source cited in the answer (for example `implementation_timeline.md` for timelines or `pricing_guide_v3.md` for prices) instead of, or in addition to, this file.","body":"# Customer FAQ\n\n## Metadata\n\n- Category: Sales\n- Document Type: External FAQ\n- Version: 2.5\n- Status: Current\n- Last Updated: 2026-07-18\n- Authoritative: No — summary answers; detailed authoritative sources are linked in each answer\n- Keywords: FAQ, customer questions, prospect questions, what is NexaFlow, integrations, security, AI, implementation time, support, pricing overview, trial, data ownership, contract\n- Use When: A prospect or customer asks a common, general question and a short answer is enough, or a seller needs a quick reference before a call.\n\n## Summary\n\nThis FAQ gives short, customer-safe answers to the questions prospects ask most often during sales conversations. Answers are intentionally brief and point to the authoritative documents for detail. Because this is a summary document, the linked source should be used when a precise figure (price, timeline, limit) matters.\n\n## Main Content\n\n### About the Product\n\n**What does NexaFlow do?**\nNexaFlow is a workflow automation and AI operations platform. It connects your business systems, automates multi-step processes and uses governed AI agents for tasks like classification, document extraction and summarisation. (Source: `product_overview.md`)\n\n**Who is NexaFlow for?**\nMid-sized and enterprise organisations, typically 500–10,000 employees, in manufacturing, financial services, healthcare, retail and professional services.\n\n**Do we need developers to use it?**\nNo. Business analysts build flows in the visual Flow Builder. Developers can extend the platform through the REST and GraphQL APIs.\n\n**Which systems do you integrate with?**\nMore than 200, including Salesforce, SAP S/4HANA, Oracle NetSuite, Workday, ServiceNow, Microsoft 365, Slack and Snowflake. On-premise systems connect through NexaFlow Relay on Enterprise. (Source: `integration_guide.md`)\n\n**Is there an API?**\nYes — REST and GraphQL APIs, webhooks, and Python and JavaScript SDKs.\n\n**Can NexaFlow be installed on-premise?**\nNo. NexaFlow is cloud-only, with single-tenant and data residency options for Enterprise.\n\n### AI\n\n**How do the AI agents work?**\nAgents are configured in Agent Studio with instructions, permitted tools and knowledge sources. They work inside workflows and can require human approval.\n\n**Is our data used to train AI models?**\nNo. Customer data is never used for model training, and LLM providers operate with zero data retention.\n\n**Can we control which AI models are used?**\nEnterprise customers can restrict agents to an approved model list or bring their own LLM key.\n\n### Security and Compliance\n\n**Is NexaFlow secure?**\nYes. NexaFlow is SOC 2 Type II and ISO 27001 certified, GDPR compliant, and offers HIPAA BAAs on Enterprise. (Source: `security_overview.md`)\n\n**Do you support SSO and role-based access?**\nSSO (SAML/OIDC) is available on Professional and Enterprise. Role-based access control is available on all plans, with custom roles on Enterprise.\n\n**Do you provide audit logs?**\nYes, on Professional (90 days) and Enterprise (1 year, extendable to 7 years, with SIEM streaming).\n\n**Where is our data stored?**\nAWS in the US, EU or APAC depending on plan and choice.\n\n**Who owns our data?**\nYou do. Data can be exported at any time and is deleted within 30 days of contract end.\n\n### Implementation and Support\n\n**How long does implementation take?**\nStarter customers are up and running in days. A standard enterprise implementation typically takes 4–6 weeks; complex projects take 8–12 weeks. (Source: `implementation_timeline.md`)\n\n**What does the onboarding process look like?**\nDiscovery, solution design, environment setup, integration configuration, data migration, testing, training, go-live and 30 days of post-launch support. (Source: `onboarding_guide.md`)\n\n**What support do you offer?**\nEmail support on Starter, email and chat on Professional, and 24/7 phone, chat and email with a named Customer Success Manager on Enterprise.\n\n**What is your uptime commitment?**\n99.5% on Professional and 99.9% on Enterprise.\n\n**Do you provide training?**\nYes. All customers get NexaFlow Academy; Enterprise customers receive a role-based training program. (Source: `training_and_adoption.md`)\n\n### Pricing and Contracts\n\n**How is NexaFlow priced?**\nPer user per month, with three plans: Starter, Professional and Enterprise. Annual billing is cheaper than monthly billing. For current prices see `pricing_guide_v3.md` or ask your account executive.\n\n**Is there a free trial?**\nYes, 14 days on Starter and Professional. Enterprise customers can run a paid 60-day pilot credited against the first year.\n\n**Do approvers need a paid license?**\nNo. People who only approve requests via email, Slack or Teams do not need a paid license. (Source: `licensing_model.md`)\n\n**What contract lengths are available?**\nMonthly or annual for Starter and Professional; 1, 2 or 3 years for Enterprise.\n\n### Results\n\n**What results do customers see?**\nExamples include a 40% reduction in manual work at a manufacturer, 35% faster processing at a financial services firm, 20 hours saved per week at a consulting firm and 30% fewer errors at a retailer. Typical payback is 6–9 months.\n\n**Can we speak to a reference customer?**\nYes. References in your industry can be arranged at the proposal stage.\n\n## Key Facts\n\n- Short, customer-safe answers; authoritative detail lives in linked documents.\n- NexaFlow is cloud-only; no on-premise installation.\n- Standard enterprise implementation: 4–6 weeks; complex: 8–12 weeks.\n- Customer data is never used to train AI models.\n- 14-day free trial on Starter and Professional.\n\n## Related Documents\n\n- sales_playbook.md\n- objection_handling.md\n- product_overview.md\n- pricing_guide_v3.md\n\n## Retrieval Notes\n\nRetrieve for quick, general prospect questions when a short answer is enough. When the question needs exact figures or detailed process steps, prefer the authoritative source cited in the answer (for example `implementation_timeline.md` for timelines or `pricing_guide_v3.md` for prices) instead of, or in addition to, this file."},{"document_id":"NEXA-008","title":"Demo Script","document_type":"Demo Script","main_category":"Sales Enablement","secondary_topics":["Product modules shown in demos","Security and governance demonstration","Implementation timeline messaging","Case study selection"],"rag_tags":["demo","demo-script","product-demo","demo-flow","discovery-recap","tell-show-tell","flow-builder-demo","agent-studio-demo","command-center","security-demo","next-steps","demo-environment"],"version":"3.1","status":"Current","last_updated":"2026-07-22","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["23_sales_playbook.md","17_objection_handling.md","22_proposal_template.md","21_product_overview.md"],"summary":"Defines the standard 45-minute tell-show-tell solution demo used at Stage 3 of the sales process, including the preparation checklist, timed agenda, talking points and recommended next steps.","key_topics":["Standard demo: 45 minutes, tell-show-tell, built on the prospect's own process.","Start with the Command Center outcome, then show the end-to-end workflow with an AI agent.","Show security: SSO, RBAC, audit logs, environment promotion.","State implementation as 4–6 weeks standard, 8–12 weeks complex.","Always end with a dated next step and a recap within 24 hours."],"use_when":"A seller or solutions engineer is preparing or running a NexaFlow product demo, or asks what the demo flow and talking points should be.","file":"knowledge_base/04_sales_enablement/08_demo_script.md","filename":"08_demo_script.md","folder":"04_sales_enablement","retrieval_notes":"Retrieve when someone asks how to run or prepare a demo, what to show, the demo agenda or what to do after a demo. For product details shown in the demo retrieve Product documents; for objections raised during the demo retrieve `objection_handling.md`.","body":"# Demo Script\n\n## Metadata\n\n- Category: Sales\n- Document Type: Demo Script\n- Version: 3.1\n- Status: Current\n- Last Updated: 2026-07-22\n- Authoritative: Yes\n- Keywords: demo, demo script, product demo, demo flow, discovery recap, tell-show-tell, Flow Builder demo, Agent Studio demo, Command Center, security demo, next steps, demo environment\n- Use When: A seller or solutions engineer is preparing or running a NexaFlow product demo, or asks what the demo flow and talking points should be.\n\n## Summary\n\nThis script defines the standard 45-minute NexaFlow solution demo used at Stage 3 of the sales process. It follows a tell-show-tell structure built around the prospect's own process discovered earlier. It includes preparation steps, a timed agenda, talking points for each section, handling questions during the demo and recommended next steps.\n\n## Main Content\n\n### Demo Principles\n\n1. **Never demo without discovery.** Use the process, systems and numbers from the discovery call.\n2. **Show their process, not every feature.** One end-to-end workflow beats a feature tour.\n3. **Tell-show-tell.** Say what they will see, show it, then connect it to their pain.\n4. **Lead with the outcome.** Start with the dashboard showing results, then show how it is built.\n5. **Stop and check.** Pause after each section: \"How does this compare to how you do it today?\"\n\n### Preparation Checklist (48 Hours Before)\n\n- [ ] Discovery notes reviewed; pain metrics written on one slide\n- [ ] Demo tenant configured with the prospect's name, logo and relevant connectors (Salesforce, SAP, ServiceNow, etc.)\n- [ ] One end-to-end workflow built that mirrors their process\n- [ ] Sample documents loaded for the AI extraction agent (invoice, application form or referral)\n- [ ] Command Center dashboard populated with realistic data\n- [ ] Attendee list confirmed: who is the champion, economic buyer, IT, security?\n- [ ] Relevant case study selected (manufacturing → ManufacturingCo, finance → FinServe, healthcare → HealthPlus, retail → RetailMax, services → Acme)\n\n### Standard 45-Minute Agenda\n\n| Time | Section | Owner |\n|---|---|---|\n| 0–5 min | Introductions and discovery recap | Account Executive |\n| 5–10 min | The outcome: Command Center dashboard | Solutions Engineer |\n| 10–25 min | End-to-end workflow with AI agent | Solutions Engineer |\n| 25–32 min | Integrations and API | Solutions Engineer |\n| 32–38 min | Security, governance and audit logs | Solutions Engineer |\n| 38–42 min | Implementation approach and customer proof | Account Executive |\n| 42–45 min | Questions and next steps | Account Executive |\n\n### Section 1: Discovery Recap (0–5 min)\n\n**Say:** \"Last time you told us [process] takes [X days], your team spends [Y hours per week] on manual steps, and [pain, e.g., audit findings]. Today we'll show how that process runs in NexaFlow. Did we get that right? Anything changed?\"\n\nGetting agreement on the pain makes the rest of the demo relevant.\n\n### Section 2: The Outcome — Command Center (5–10 min)\n\n**Show:** dashboard with cycle time, volume, SLA status, exceptions queue and hours saved.\n**Say:** \"This is what your operations leader would see on day 30: every request, where it's stuck, and how much time automation saved.\"\n\n### Section 3: End-to-End Workflow (10–25 min)\n\n**Show, in order:**\n1. **Trigger** — a new request arrives (email with attachment, Salesforce update or form).\n2. **AI agent** — Agent Studio extracts fields from the document; show confidence scores and a low-confidence field routed to a human.\n3. **Business rules** — branching by value, region or risk.\n4. **Approval** — approver approves directly in Microsoft Teams or Slack (highlight: approvers need no paid license).\n5. **System update** — record created in the ERP/CRM automatically.\n6. **Exception** — show an error routed to the operator queue with context.\n7. **Flow Builder** — open the canvas to show how a business analyst built and versions it.\n\n**Tell:** \"That process took [X days] with manual re-keying. Here it took minutes, with a human involved only where judgement is needed.\"\n\n### Section 4: Integrations and API (25–32 min)\n\n**Show:** connector library filtered to their systems; a REST call triggering the flow; webhook configuration.\n**Say:** \"You mentioned [systems]. All have pre-built connectors. For your on-premise [system], NexaFlow Relay connects without opening inbound firewall ports.\"\n\n### Section 5: Security and Governance (32–38 min)\n\n**Show:** Admin Console — SSO settings, role-based access with a custom role, workspace separation, audit log entries for a flow publish and an AI agent decision, environment promotion Dev → Staging → Production.\n**Say:** \"Your security team will ask who changed what and why the AI decided something. Here is that evidence, immutable and exportable to your SIEM.\"\n\n### Section 6: Implementation and Proof (38–42 min)\n\n**Say:** \"A standard enterprise implementation takes 4–6 weeks, from discovery to go-live, followed by 30 days of hypercare. More complex projects with many integrations or detailed security reviews take 8–12 weeks.\"\nShare the matching case study headline (for example \"ManufacturingCo reduced manual work by 40% and went live in 6 weeks\").\n\n### Handling Questions During the Demo\n\n- Pricing question early → \"Happy to cover that; let's make sure it fits first, and I'll walk through options at the end.\" Do not quote prices from memory — use `pricing_guide_v3.md`.\n- Feature you do not have → say so honestly and note it; never fake it.\n- Deep technical question → capture it and schedule a technical session.\n- Objections → use `objection_handling.md`.\n\n### Recommended Next Steps\n\n| Demo Outcome | Next Step |\n|---|---|\n| Strong fit, champion engaged | ROI workshop within 1 week + send security package |\n| IT/security concerns | Technical deep-dive with solutions architect and security team |\n| Economic buyer absent | Executive summary demo (20 minutes) for economic buyer |\n| Unclear priority | Revisit discovery; quantify cost of inaction |\n| Wants to test | Scoped paid 60-day pilot credited to subscription |\n\nAlways confirm a dated next step before the call ends and send a recap email within 24 hours.\n\n## Key Facts\n\n- Standard demo: 45 minutes, tell-show-tell, built on the prospect's own process.\n- Start with the Command Center outcome, then show the end-to-end workflow with an AI agent.\n- Show security: SSO, RBAC, audit logs, environment promotion.\n- State implementation as 4–6 weeks standard, 8–12 weeks complex.\n- Always end with a dated next step and a recap within 24 hours.\n\n## Related Documents\n\n- sales_playbook.md\n- objection_handling.md\n- proposal_template.md\n- product_overview.md\n\n## Retrieval Notes\n\nRetrieve when someone asks how to run or prepare a demo, what to show, the demo agenda or what to do after a demo. For product details shown in the demo retrieve Product documents; for objections raised during the demo retrieve `objection_handling.md`."},{"document_id":"NEXA-017","title":"Objection Handling Guide","document_type":"Guide","main_category":"Sales Enablement","secondary_topics":["Pricing and discounts","Security and compliance","AI governance","Implementation timeline","Competitive positioning"],"rag_tags":["objections","objection-handling","too-expensive","price-objection","budget","security-concerns","ai-risk","competitor","build-in-house","timing","implementation-risk","change-management"],"version":"3.2","status":"Current","last_updated":"2026-07-12","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["23_sales_playbook.md","09_discount_policy.md","24_security_overview.md","06_customer_faq.md"],"summary":"Recommended responses to eight common sales objections using the Acknowledge-Clarify-Respond-Confirm method, with clarifying questions, proof points and what not to say.","key_topics":["Use ACRC: Acknowledge, Clarify, Respond, Confirm.","For \"too expensive\": return to cost of the problem, show 6–9 month payback, right-size scope, and trade any discount for commitment.","Multi-year discounts: 5% (2-year), 10% (3-year); larger discounts follow the approval matrix.","Security response relies on SOC 2 Type II, ISO 27001, HIPAA BAA, RBAC and audit logs.","Standard implementation 4–6 weeks counters \"takes too long\"."],"use_when":"A seller needs to respond to a prospect objection such as price, security, AI trust, competitors, timing or implementation risk.","file":"knowledge_base/04_sales_enablement/17_objection_handling.md","filename":"17_objection_handling.md","folder":"04_sales_enablement","retrieval_notes":"Retrieve whenever a seller asks \"how do I respond if a prospect says…\" — price, too expensive, budget, security, AI trust, build vs buy, competitors, timing or implementation risk. Pair with `discount_policy.md` for discount limits and `security_overview.md` for detailed security facts.","body":"# Objection Handling Guide\n\n## Metadata\n\n- Category: Sales\n- Document Type: Sales Enablement Guide\n- Version: 3.2\n- Status: Current\n- Last Updated: 2026-07-12\n- Authoritative: Yes\n- Keywords: objections, objection handling, too expensive, price objection, budget, security concerns, AI risk, competitor, build in-house, timing, implementation risk, change management, ROI, responses\n- Use When: A seller needs to respond to a prospect objection such as price, security, AI trust, competitors, timing or implementation risk.\n\n## Summary\n\nThis guide gives recommended responses to the most common objections NexaFlow sellers hear. Each objection includes what is usually behind it, a response framework, proof points and what not to say. The general method is: acknowledge, clarify, respond with evidence, and confirm. Discounts mentioned in any response must follow `discount_policy.md`.\n\n## Main Content\n\n### The ACRC Method\n\n1. **Acknowledge** — show you heard the concern without arguing.\n2. **Clarify** — ask a question to find the real issue.\n3. **Respond** — address the real issue with evidence.\n4. **Confirm** — check the concern is resolved and agree the next step.\n\n---\n\n### Objection 1: \"It's too expensive.\"\n\n**What is usually behind it:** no agreed ROI, comparing to a cheaper point tool, budget already allocated elsewhere, or a negotiation tactic.\n\n**Clarifying questions:**\n- \"Too expensive compared to what — another vendor, your budget, or the value you expect?\"\n- \"If price were not a factor, is NexaFlow the right solution?\"\n\n**Response framework:**\n1. **Return to the cost of the problem.** \"You told us your team spends about 60 hours a week on manual steps. At a $45 loaded hourly cost that is over $140,000 a year — before counting errors and delays.\"\n2. **Show payback.** Typical NexaFlow payback is 6–9 months. Build the ROI with their numbers.\n3. **Use a proof point.** \"ManufacturingCo cut manual work by 40%; Acme saves 20 hours a week.\"\n4. **Right-size, don't discount first.** Offer a phased scope (fewer users or workflows in year 1, ramp pricing), or the Professional plan if Enterprise-only features are not needed.\n5. **Trade, don't give.** If a discount is required, exchange it for a multi-year term (5% for 2 years, 10% for 3 years), a case study, or signature by a date — within `discount_policy.md` limits.\n\n**What not to say:** \"I can get you 30% off today.\" Leading with discount devalues the product and needs VP approval anyway.\n\n---\n\n### Objection 2: \"We have security concerns.\"\n\n**Clarifying question:** \"Which area worries your security team most — data storage, access control, AI use of data, or compliance?\"\n\n**Response:**\n- SOC 2 Type II and ISO 27001 certified; GDPR compliant; HIPAA BAA available on Enterprise.\n- AES-256 encryption at rest, TLS 1.2+ in transit, optional customer-managed keys.\n- SSO, SCIM, custom RBAC and immutable audit logs with SIEM streaming.\n- Offer the Trust Center package (SOC 2 report, CAIQ) under NDA and a call with NexaFlow's security team.\n- Proof: FinServe Capital (regulated lender) and HealthPlus Medical Group (HIPAA) both passed detailed security reviews.\n\n**Next step:** start the security review now — it protects the implementation timeline. See `security_overview.md`.\n\n---\n\n### Objection 3: \"We don't trust AI to make decisions.\"\n\n**Response:**\n- AI agents in NexaFlow work inside defined workflows with only the tools they are granted.\n- Confidence thresholds route uncertain cases to humans; approvals can be required for any action.\n- Every agent input, output and decision is logged and auditable.\n- Customer data is never used to train models.\n- Start with \"AI assists, human approves\" and increase automation as accuracy is proven.\n\n---\n\n### Objection 4: \"We can build this ourselves.\"\n\n**Clarifying question:** \"Who would maintain the integrations and AI components two years from now?\"\n\n**Response:** Internal builds carry hidden costs: integration maintenance when APIs change, security reviews, audit logging, monitoring and key-person risk. NexaFlow provides 200+ maintained connectors, governance and 99.9% uptime. Offer to compare the three-year total cost of ownership.\n\n---\n\n### Objection 5: \"We already use [lightweight automation tool / RPA].\"\n\n**Response:** Lightweight tools work for simple app-to-app tasks but lack enterprise RBAC, audit logs, environments and scale. RPA bots break when screens change. NexaFlow can coexist: keep simple automations, move critical cross-system processes to a governed platform.\n\n---\n\n### Objection 6: \"Implementation will take too long / disrupt our team.\"\n\n**Response:**\n- Standard enterprise implementation is 4–6 weeks; complex deployments are 8–12 weeks.\n- RetailMax went live in 4 weeks, before holiday peak.\n- The customer's project lead needs about 50% of their time; most users need only short training (approvers watch a 10-minute video).\n- 30 days of hypercare follows go-live.\n\n---\n\n### Objection 7: \"Now is not the right time.\"\n\n**Clarifying question:** \"What would need to be true for this to become a priority?\"\n\n**Response:** Quantify the cost of waiting (monthly cost of manual work). Offer a paid 60-day pilot credited to the subscription, or align the start date with their budget cycle while completing the security review now.\n\n---\n\n### Objection 8: \"Your competitor quoted us less.\"\n\n**Response:** Compare scope, not just price: included workflow runs, AI agents, SSO/SCIM, audit log retention, SLA and implementation. Ask to see what is included. A competitive displacement discount of up to 15% for year 1 exists but requires VP Sales approval.\n\n## Key Facts\n\n- Use ACRC: Acknowledge, Clarify, Respond, Confirm.\n- For \"too expensive\": return to cost of the problem, show 6–9 month payback, right-size scope, and trade any discount for commitment.\n- Multi-year discounts: 5% (2-year), 10% (3-year); larger discounts follow the approval matrix.\n- Security response relies on SOC 2 Type II, ISO 27001, HIPAA BAA, RBAC and audit logs.\n- Standard implementation 4–6 weeks counters \"takes too long\".\n\n## Related Documents\n\n- sales_playbook.md\n- discount_policy.md\n- security_overview.md\n- customer_faq.md\n\n## Retrieval Notes\n\nRetrieve whenever a seller asks \"how do I respond if a prospect says…\" — price, too expensive, budget, security, AI trust, build vs buy, competitors, timing or implementation risk. Pair with `discount_policy.md` for discount limits and `security_overview.md` for detailed security facts."},{"document_id":"NEXA-022","title":"Proposal Template","document_type":"Template","main_category":"Sales Enablement","secondary_topics":["ROI and business case","Implementation plan","Investment summary and pricing","Discount approval"],"rag_tags":["proposal","proposal-template","business-case","executive-summary","scope","commercial-terms","investment-summary","roi","implementation-plan","order-form","next-steps"],"version":"3.0","status":"Current","last_updated":"2026-07-01","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["23_sales_playbook.md","20_pricing_guide_v3.md","09_discount_policy.md","14_implementation_timeline.md"],"summary":"Standard proposal template for Professional and Enterprise opportunities with a pre-send checklist, eight required sections with guidance and placeholders, and writing tips.","key_topics":["Proposals are valid for 30 days.","Prices must come from `pricing_guide_v3.md`; discounts need prior approval.","Proposals must include ROI, implementation plan, investment summary and next steps.","Implementation plan follows the nine phases: 4–6 weeks standard, 8–12 weeks complex.","Kickoff happens within 5 business days of signature."],"use_when":"A seller needs to write a customer proposal, structure a business case, or know which sections and approvals a proposal requires. Authoritative for proposal structure; prices must come from 20_pricing_guide_v3.md.","file":"knowledge_base/04_sales_enablement/22_proposal_template.md","filename":"22_proposal_template.md","folder":"04_sales_enablement","retrieval_notes":"Retrieve when someone asks how to write or structure a proposal, what a business case should include, or needs the template. Retrieve `pricing_guide_v3.md` alongside it for actual prices and `implementation_timeline.md` for the implementation section.","body":"# Proposal Template\n\n## Metadata\n\n- Category: Sales\n- Document Type: Template\n- Version: 3.0\n- Status: Current\n- Last Updated: 2026-07-01\n- Authoritative: Yes (for proposal structure; prices must come from pricing_guide_v3.md)\n- Keywords: proposal, proposal template, business case, executive summary, scope, commercial terms, investment summary, ROI, implementation plan, order form, next steps\n- Use When: A seller needs to write a customer proposal, structure a business case, or know which sections and approvals a proposal requires.\n\n## Summary\n\nThis is NexaFlow's standard proposal template for Professional and Enterprise opportunities. It contains the required sections, guidance for each, and fill-in placeholders in square brackets. All prices must be taken from `pricing_guide_v3.md` and any discounts must be approved under `discount_policy.md` before a proposal is sent.\n\n## Main Content\n\n### Before You Start: Proposal Checklist\n\n- [ ] Opportunity is at Stage 5 with MEDDPICC minimums met (`sales_playbook.md`)\n- [ ] ROI numbers agreed with the champion\n- [ ] Implementation track (Standard 4–6 weeks or Complex 8–12 weeks) confirmed with the implementation lead\n- [ ] Prices taken from `pricing_guide_v3.md` (never from older price sheets or the v2 table in `pricing_faq.md`)\n- [ ] Discount approval recorded in the CRM\n- [ ] Relevant case study selected\n\n---\n\n### PROPOSAL TEMPLATE\n\n**NexaFlow Proposal for [Customer Name]**\nPrepared for: [Economic Buyer Name, Title]\nPrepared by: [Account Executive Name]\nDate: [Date] — Valid for 30 days\n\n#### 1. Executive Summary\n\n*Guidance: one page maximum. Written for the economic buyer. Lead with their outcome, not our features.*\n\n[Customer Name] wants to [business goal, e.g., \"reduce supplier onboarding time and manual procurement work across four plants\"]. Today, [describe current process and pain in one or two sentences, using the customer's numbers].\n\nNexaFlow will automate [number] priority workflows across [systems], using governed AI agents with full audit trails. Based on the figures agreed with your team, we expect [primary metric, e.g., \"a 35% reduction in processing time\"] and payback within [X] months.\n\n#### 2. Understanding of Your Current Situation\n\n*Guidance: prove we listened. Use discovery notes.*\n\n- Process(es) in scope: [list]\n- Volume: [transactions per month]\n- Systems involved: [list]\n- Key challenges: [3–5 bullet points with numbers]\n- Why now: [trigger event]\n\n#### 3. Proposed Solution\n\n*Guidance: map each challenge to a NexaFlow capability. Avoid a full feature list.*\n\n| Challenge | NexaFlow Solution | Module |\n|---|---|---|\n| [e.g., Manual re-keying from PDFs] | [AI document extraction agent] | Agent Studio |\n| [e.g., Approvals lost in email] | [Approval routing in Teams] | Flow Builder |\n| [e.g., No visibility] | [Real-time SLA dashboard] | Command Center |\n\nIntegrations: [list connectors; note premium connectors or Relay if needed]\nSecurity and compliance requirements met: [SSO, SCIM, audit logs, data residency, BAA]\n\n#### 4. Expected Business Outcomes and ROI\n\n| Value Driver | Assumption | Annual Value |\n|---|---|---|\n| Hours saved | [hours/week] × 52 × $[loaded hourly cost] | $[amount] |\n| Error reduction | [errors avoided] × $[cost per error] | $[amount] |\n| Faster cycle time | [impact] | $[amount] |\n| **Total annual value** | | **$[amount]** |\n\nPayback period: [months]. Three-year ROI: [percentage].\n\nReference customer: [Case study name and headline metric, e.g., \"ManufacturingCo Industries — 40% reduction in manual work\"].\n\n#### 5. Implementation Plan\n\n*Guidance: use the implementation track confirmed with the implementation lead. Do not promise dates before discovery.*\n\n| Phase | Timing |\n|---|---|\n| Discovery and requirements | Week [1] |\n| Solution design | Weeks [1–2] |\n| Environment setup | Week [2] |\n| Integration configuration | Weeks [2–3] |\n| Data migration | Weeks [3–4] |\n| Testing | Weeks [4–5] |\n| User training | Week [5] |\n| Go-live | Weeks [5–6] |\n| Post-launch hypercare | 30 days after go-live |\n\nEstimated go-live: [4–6 weeks / 8–12 weeks] after kickoff, subject to security review and stakeholder availability.\n\n#### 6. Investment Summary\n\n| Item | Quantity | Unit Price | Annual Total |\n|---|---|---|---|\n| NexaFlow [Plan] subscription | [users] | $[per user/month] | $[amount] |\n| Add-ons [e.g., extended audit retention] | [qty] | $[price] | $[amount] |\n| Multi-year discount [2-year 5% / 3-year 10%] | | | –$[amount] |\n| **Annual subscription** | | | **$[amount]** |\n| Implementation [Standard / Complex] (one-time) | 1 | $[15,000 / 35,000] | $[amount] |\n\nContract term: [1/2/3] years. Billing: annual in advance, Net 30.\n\n#### 7. Why NexaFlow\n\n- Standard enterprise go-live in 4–6 weeks\n- Governed AI agents with human approval and full audit logs\n- SOC 2 Type II, ISO 27001, GDPR, HIPAA BAA available\n- 200+ integrations including [customer's key systems]\n- Named Customer Success Manager and 30-day hypercare\n\n#### 8. Next Steps\n\n1. [Date] — Review proposal with [Economic Buyer]\n2. [Date] — Complete security review\n3. [Date] — Legal and procurement review of order form\n4. [Date] — Signature\n5. [Date] — Implementation kickoff (within 5 business days of signature)\n\n---\n\n### Writing Tips\n\n- Use the customer's language and numbers throughout.\n- Keep the proposal under 10 pages; put detail in appendices.\n- Never include internal price floors or approval notes.\n- Send as PDF and walk through it live rather than emailing cold.\n\n## Key Facts\n\n- Proposals are valid for 30 days.\n- Prices must come from `pricing_guide_v3.md`; discounts need prior approval.\n- Proposals must include ROI, implementation plan, investment summary and next steps.\n- Implementation plan follows the nine phases: 4–6 weeks standard, 8–12 weeks complex.\n- Kickoff happens within 5 business days of signature.\n\n## Related Documents\n\n- sales_playbook.md\n- pricing_guide_v3.md\n- discount_policy.md\n- implementation_timeline.md\n\n## Retrieval Notes\n\nRetrieve when someone asks how to write or structure a proposal, what a business case should include, or needs the template. Retrieve `pricing_guide_v3.md` alongside it for actual prices and `implementation_timeline.md` for the implementation section."},{"document_id":"NEXA-023","title":"Sales Playbook","document_type":"Sales Playbook","main_category":"Sales Enablement","secondary_topics":["Ideal customer profile","ROI and payback","Competitive positioning","Case study proof points"],"rag_tags":["sales-playbook","icp","ideal-customer-profile","buyer-personas","discovery-questions","qualification","meddpicc","sales-stages","messaging","value-proposition","roi-positioning","competitors"],"version":"4.0","status":"Current","last_updated":"2026-07-08","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["17_objection_handling.md","08_demo_script.md","22_proposal_template.md","06_customer_faq.md"],"summary":"Defines how NexaFlow sells: ideal customer profile, buyer personas, core messaging, discovery questions, MEDDPICC qualification, sales stages, ROI positioning and competitive landscape.","key_topics":["ICP: 500–10,000 employees with 3+ disconnected core systems.","Qualification uses MEDDPICC; champion and economic buyer must be named by Stage 2.","Three value pillars: speed to value, governed AI, enterprise-ready.","Typical payback: 6–9 months; Enterprise sales cycle 60–120 days.","Start security review in Stage 4 to protect implementation timelines."],"use_when":"A seller needs to know who to target, how to run discovery, how to qualify an opportunity, what the sales stages are, or how to position NexaFlow's value.","file":"knowledge_base/04_sales_enablement/23_sales_playbook.md","filename":"23_sales_playbook.md","folder":"04_sales_enablement","retrieval_notes":"Retrieve for ICP, target customers, personas, discovery questions, qualification, sales stages, messaging, ROI positioning or competitive positioning. For responses to specific objections retrieve `objection_handling.md`; for demo flow retrieve `demo_script.md`.","body":"# Sales Playbook\n\n## Metadata\n\n- Category: Sales\n- Document Type: Sales Playbook\n- Version: 4.0\n- Status: Current\n- Last Updated: 2026-07-08\n- Authoritative: Yes\n- Keywords: sales playbook, ICP, ideal customer profile, buyer personas, discovery questions, qualification, MEDDPICC, sales stages, messaging, value proposition, ROI positioning, competitors, next steps\n- Use When: A seller needs to know who to target, how to run discovery, how to qualify an opportunity, what the sales stages are, or how to position NexaFlow's value.\n\n## Summary\n\nThis playbook defines how NexaFlow sells: the ideal customer profile, buyer personas, core messaging, discovery questions, qualification criteria and sales stages from first meeting to signature. It links to specialised documents for objections (`objection_handling.md`), demos (`demo_script.md`), proposals (`proposal_template.md`) and pricing (`pricing_guide_v3.md`).\n\n## Main Content\n\n### Ideal Customer Profile (ICP)\n\n| Attribute | Ideal Fit |\n|---|---|\n| Company size | 500–10,000 employees |\n| Industries | Manufacturing, financial services, healthcare, retail, professional services |\n| Systems | 3+ core business systems (ERP, CRM, HRIS, ITSM) that do not talk to each other |\n| Pain signal | Manual handoffs, spreadsheets, email approvals, SLA misses, audit findings |\n| Operations maturity | Named process owners; some existing automation (scripts, RPA) that is hard to maintain |\n| Budget | $40,000–$500,000 annual software budget for operations tooling |\n| Buying trigger | Growth without headcount, ERP migration, new compliance requirements, M&A integration |\n\n**Poor fit:** companies under 50 employees wanting only simple app-to-app automation, or buyers seeking a fully on-premise product (NexaFlow is cloud-only).\n\n### Buyer Personas\n\n| Persona | Cares About | Key Message |\n|---|---|---|\n| COO / VP Operations (economic buyer) | Cost, capacity, SLAs | \"Add capacity without adding headcount.\" |\n| CIO / Head of IT | Security, governance, integration sprawl | \"One governed platform instead of scattered scripts.\" |\n| CFO / Finance leader | ROI, payback, controls | \"Payback typically in 6–9 months with full audit trails.\" |\n| Process owner (champion) | Daily pain, team workload | \"Your team stops copy-pasting and chasing approvals.\" |\n| Security / Compliance | Risk, data privacy, AI governance | \"SOC 2 Type II, ISO 27001, HIPAA BAA, logged AI decisions.\" |\n\n### Core Messaging\n\n**Positioning statement:** NexaFlow is the AI operations platform that lets mid-sized and enterprise companies automate cross-system business processes with governed AI agents — live in weeks, not quarters.\n\n**Three value pillars:**\n1. **Speed to value** — standard enterprise implementation in 4–6 weeks.\n2. **AI you can govern** — every agent decision logged, with human approval gates.\n3. **Enterprise-ready** — security certifications, RBAC, audit logs, 200+ integrations, 99.9% SLA.\n\n**Proof points:** 40% reduction in manual work (ManufacturingCo), 35% faster processing (FinServe), 20 hours saved per week (Acme), 30% fewer errors (RetailMax).\n\n### Discovery Questions\n\n**Current state**\n- Walk me through the process from start to finish. Where does it start and who touches it?\n- Which systems are involved, and where is data re-keyed?\n- How many requests or transactions go through this process each month?\n\n**Pain and impact**\n- How long does it take today, and how long should it take?\n- How many hours per week does your team spend on manual steps?\n- What happens when something goes wrong — errors, SLA misses, audit findings?\n\n**Priorities and urgency**\n- Why solve this now? What happens if nothing changes in 12 months?\n- Is there a deadline — peak season, audit, system migration?\n\n**Decision process**\n- Who else will be involved in evaluating and approving this?\n- What does your security review process look like, and how long does it usually take?\n- How have you bought similar software before?\n\n**Technical fit**\n- Do you need SSO, SCIM, audit log retention or data residency?\n- Are any systems on-premise?\n\n### Qualification Criteria (MEDDPICC)\n\n| Letter | Question to Answer | Minimum to Advance Past Stage 2 |\n|---|---|---|\n| Metrics | What measurable outcome will they achieve? | At least one quantified pain (hours, days, error rate) |\n| Economic Buyer | Who signs? | Identified by name |\n| Decision Criteria | How will they choose? | Documented |\n| Decision Process | Steps to purchase | Mapped, including security review |\n| Paper Process | Legal and procurement steps | Understood before Stage 4 |\n| Identify Pain | Why now? | Clear business impact |\n| Champion | Who sells internally for us? | Named champion with access to EB |\n| Competition | Who else? | Known alternatives, including \"do nothing\" |\n\n### Sales Stages\n\n| Stage | Name | Exit Criteria |\n|---|---|---|\n| 1 | Discovery | Pain and process documented |\n| 2 | Qualification | MEDDPICC minimums met |\n| 3 | Solution Demo | Tailored demo delivered (`demo_script.md`); champion confirms fit |\n| 4 | Business Case & Security | ROI agreed; security review started |\n| 5 | Proposal | Proposal sent (`proposal_template.md`) with pricing from `pricing_guide_v3.md` |\n| 6 | Negotiation | Terms agreed within `discount_policy.md` |\n| 7 | Closed Won | Signed; handoff to implementation within 2 business days |\n\nTypical Enterprise sales cycle: 60–120 days. Professional: 21–45 days.\n\n### ROI Positioning\n\nBuild ROI with the customer, using their numbers:\n- Hours saved × loaded hourly cost (default assumption $45/hour if unknown).\n- Error reduction × cost per error (rework, write-offs, penalties).\n- Faster cycle time × revenue or customer impact.\n\nTypical NexaFlow customers reach payback in **6–9 months**.\n\n### Competitive Landscape\n\n| Alternative | How to Position |\n|---|---|\n| Lightweight app-to-app tools | Fine for simple tasks; lack governance, RBAC, audit logs and enterprise scale |\n| Legacy RPA suites | Brittle screen-scraping and high maintenance; NexaFlow uses APIs and AI agents |\n| In-house scripts | Hidden maintenance cost and key-person risk |\n| Do nothing | Quantify cost of manual work per year |\n\n### Next-Step Recommendations After Each Meeting\n\n- After discovery → book tailored demo with process owner and IT.\n- After demo → run ROI workshop and send security package.\n- After ROI → introduce implementation lead to discuss timeline.\n- Always end with a dated next step in the calendar.\n\n## Key Facts\n\n- ICP: 500–10,000 employees with 3+ disconnected core systems.\n- Qualification uses MEDDPICC; champion and economic buyer must be named by Stage 2.\n- Three value pillars: speed to value, governed AI, enterprise-ready.\n- Typical payback: 6–9 months; Enterprise sales cycle 60–120 days.\n- Start security review in Stage 4 to protect implementation timelines.\n\n## Related Documents\n\n- objection_handling.md\n- demo_script.md\n- proposal_template.md\n- customer_faq.md\n\n## Retrieval Notes\n\nRetrieve for ICP, target customers, personas, discovery questions, qualification, sales stages, messaging, ROI positioning or competitive positioning. For responses to specific objections retrieve `objection_handling.md`; for demo flow retrieve `demo_script.md`."},{"document_id":"NEXA-001","title":"Case Study: Acme Consulting Group","document_type":"Case Study","main_category":"Case Studies","secondary_topics":["Standard implementation track (5 weeks)
