","Salesforce, NetSuite and Microsoft Teams integration","AI agent with human approval","Payback in about 7 months"],"rag_tags":["case-study","professional-services","consulting","client-onboarding","project-setup","resource-staffing","timesheets","invoicing","20-hours-saved-per-week","25-faster-onboarding","salesforce","netsuite"],"version":"1.2","status":"Current","last_updated":"2026-03-09","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["02_case_study_finserve.md","05_case_study_retailmax.md","23_sales_playbook.md","14_implementation_timeline.md"],"summary":"Customer case study of Acme Consulting Group, a 1,200-employee professional services firm that automated client onboarding, project setup and billing handoffs across Salesforce, NetSuite and Microsoft Teams. It went live in 5 weeks on the standard Enterprise track and reports 25% faster client onboarding and 20 hours saved per week.","key_topics":["Professional services firm, 1,200 employees, Enterprise plan.","25% faster client onboarding (8 days to 6 days).","20 hours saved per week for the project operations team.","Implementation took 5 weeks on the standard track.","Payback in about 7 months."],"use_when":"Someone needs a professional services or consulting customer example, proof of faster client onboarding, or evidence of hours saved. Authoritative for Acme results only; not the authoritative source for general implementation timelines (use 14_implementation_timeline.md).","file":"knowledge_base/05_case_studies/01_case_study_acme.md","filename":"01_case_study_acme.md","folder":"05_case_studies","retrieval_notes":"Retrieve for professional services or consulting references, \"faster client onboarding\" proof points, \"hours saved per week\" examples or Salesforce + NetSuite automation stories. Not an authoritative source for general implementation timelines — use `implementation_timeline.md` for that.","body":"# Case Study: Acme Consulting Group\n\n## Metadata\n\n- Category: Case Studies\n- Document Type: Customer Case Study\n- Version: 1.2\n- Status: Approved for external use\n- Last Updated: 2026-03-09\n- Authoritative: Yes (for Acme results)\n- Keywords: case study, professional services, consulting, client onboarding, project setup, resource staffing, timesheets, invoicing, 20 hours saved per week, 25% faster onboarding, Salesforce, NetSuite, Microsoft Teams\n- Use When: Someone needs a professional services or consulting customer example, proof of faster client onboarding, or evidence of hours saved.\n\n## Summary\n\nAcme Consulting Group, a 1,200-person professional services firm, used NexaFlow to automate client onboarding, project setup and billing handoffs across Salesforce, NetSuite and Microsoft Teams. The implementation took 5 weeks on the standard Enterprise track. Acme now onboards new clients 25% faster and its project operations team saves 20 hours per week.\n\n## Main Content\n\n### Customer Profile\n\n| Attribute | Detail |\n|---|---|\n| Industry | Professional services (management and technology consulting) |\n| Headquarters | Chicago, USA, with offices in London and Singapore |\n| Employees | 1,200 |\n| Plan | Enterprise, 150 Full Users |\n| Systems | Salesforce, Oracle NetSuite, Microsoft Teams, SharePoint, DocuSign |\n| Go-live | November 2025 |\n\n### The Problem\n\nEvery time Acme won a new engagement, a chain of manual tasks began. Sales operations re-keyed deal details from Salesforce into NetSuite, the project management office created SharePoint folders and Teams channels by hand, and resource managers chased partners by email to confirm staffing. Conflict-of-interest checks sat in shared inboxes.\n\nThe results:\n- New client onboarding took an average of **8 business days** from signed statement of work to project kickoff.\n- The 6-person project operations team spent roughly **20 hours per week** on copy-paste work and chasing approvals.\n- Around 1 in 12 projects started with incorrect billing rates, causing invoice disputes.\n- Partners had no visibility into where onboarding was stuck.\n\n### The Implementation\n\nAcme followed NexaFlow's standard nine-phase enterprise onboarding process and went live in **5 weeks**.\n\n| Week | Activity |\n|---|---|\n| 1 | Discovery workshops with sales ops, PMO, finance and risk |\n| 1–2 | Solution design for three priority workflows |\n| 2 | Environment setup with Microsoft Entra ID SSO and SCIM |\n| 2–3 | Salesforce, NetSuite, Teams, SharePoint and DocuSign connectors configured |\n| 3–4 | Migration of 1,400 active client records and rate cards |\n| 4 | UAT with 12 business users |\n| 5 | Role-based training and go-live |\n\nThe project stayed on the standard track because all five systems had pre-built connectors and the data migration was small.\n\n### The Solution\n\n**Key workflows automated:**\n\n1. **Client onboarding** — when a Salesforce opportunity is marked Closed Won, NexaFlow creates the customer and project in NetSuite, generates the SharePoint folder structure and Teams channel, and sends the welcome pack.\n2. **Conflict check** — an AI agent in Agent Studio summarises the client, related entities and prior engagements, and routes the result to the risk team for approval in Teams.\n3. **Resource staffing requests** — staffing requests are sent to resource managers with skills and availability; approvals happen in Teams.\n4. **Rate card validation** — billing rates are checked against the signed SOW before the project is opened for time entry.\n5. **Kickoff readiness dashboard** — partners see each new client's onboarding status in Command Center.\n\n### Measurable Results\n\n| Metric | Before | After | Change |\n|---|---|---|---|\n| Client onboarding time | 8 business days | 6 business days | **25% faster onboarding** |\n| Manual work in project operations | ~20 hours/week | Near zero | **20 hours saved per week** |\n| Projects starting with billing rate errors | 1 in 12 | 1 in 50 | **~80% fewer rate errors** |\n| Conflict-check turnaround | 2 days | 4 hours | 75% faster |\n\nPayback on the subscription and implementation fee was achieved in about **7 months**.\n\n### Customer Quote\n\n\"We used to measure onboarding in emails. Now partners open a dashboard and see exactly where every new client stands.\" — Director of Project Operations, Acme Consulting Group\n\n### Lessons Learned\n\n- Starting with three workflows kept the project on the 4–6 week track.\n- Letting the AI agent prepare conflict-check summaries, while keeping human approval, built trust with the risk team.\n- Retiring the old onboarding spreadsheet in week 2 after go-live drove adoption.\n\n## Key Facts\n\n- Professional services firm, 1,200 employees, Enterprise plan.\n- 25% faster client onboarding (8 days to 6 days).\n- 20 hours saved per week for the project operations team.\n- Implementation took 5 weeks on the standard track.\n- Payback in about 7 months.\n\n## Related Documents\n\n- case_study_finserve.md\n- case_study_retailmax.md\n- sales_playbook.md\n- implementation_timeline.md\n\n## Retrieval Notes\n\nRetrieve for professional services or consulting references, \"faster client onboarding\" proof points, \"hours saved per week\" examples or Salesforce + NetSuite automation stories. Not an authoritative source for general implementation timelines — use `implementation_timeline.md` for that."},{"document_id":"NEXA-002","title":"Case Study: FinServe Capital","document_type":"Case Study","main_category":"Case Studies","secondary_topics":["Complex implementation track (10 weeks)","Security review and single-tenant deployment","NexaFlow Relay on-premise integration","AI document extraction"],"rag_tags":["case-study","financial-services","banking","lending","loan-processing","kyc","document-extraction","compliance","audit-logs","35-faster-processing","30-fewer-errors","security-review"],"version":"1.1","status":"Current","last_updated":"2026-04-21","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["01_case_study_acme.md","03_case_study_healthplus.md","24_security_overview.md","17_objection_handling.md"],"summary":"Customer case study of FinServe Capital, a 3,500-employee regional lender that automated commercial loan intake, KYC checks and credit memo preparation with AI agents. The complex 10-week implementation (single-tenant, Relay, seven integrations) produced 35% faster processing and 30% fewer data entry errors.","key_topics":["Financial services lender, 3,500 employees, Enterprise single-tenant.","35% faster loan processing (12 days to 7.8 days).","30% fewer data entry errors.","Complex implementation: 10 weeks, driven by security review, Relay and 7 integrations.","Zero KYC audit findings after go-live."],"use_when":"Someone needs a financial services or banking reference, proof of faster processing, fewer errors, or an example of a regulated, security-heavy implementation. Authoritative for FinServe results only; not the authoritative source for general implementation timelines (use 14_implementation_timeline.md).","file":"knowledge_base/05_case_studies/02_case_study_finserve.md","filename":"02_case_study_finserve.md","folder":"05_case_studies","retrieval_notes":"Retrieve for banking, lending or financial services references, \"faster processing\" or \"fewer errors\" proof points, AI document extraction examples, or examples of regulated complex implementations. Not the authoritative source for general timelines (use `implementation_timeline.md`).","body":"# Case Study: FinServe Capital\n\n## Metadata\n\n- Category: Case Studies\n- Document Type: Customer Case Study\n- Version: 1.1\n- Status: Approved for external use (customer name anonymised on request)\n- Last Updated: 2026-04-21\n- Authoritative: Yes (for FinServe results)\n- Keywords: case study, financial services, banking, lending, loan processing, KYC, document extraction, compliance, audit logs, 35% faster processing, 30% fewer errors, security review, NexaFlow Relay, complex implementation\n- Use When: Someone needs a financial services or banking reference, proof of faster processing, fewer errors, or an example of a regulated, security-heavy implementation.\n\n## Summary\n\nFinServe Capital, a regional lender with 3,500 employees, used NexaFlow AI agents and workflows to automate commercial loan application intake, KYC checks and credit memo preparation. Because of a detailed security review and an on-premise core banking integration, the project followed the complex implementation track and went live in 10 weeks. FinServe now processes loan applications 35% faster with 30% fewer data entry errors.\n\n## Main Content\n\n### Customer Profile\n\n| Attribute | Detail |\n|---|---|\n| Industry | Financial services (commercial and SME lending) |\n| Region | United States, 90 branches |\n| Employees | 3,500 |\n| Plan | Enterprise, 400 Full Users, single-tenant, US region |\n| Systems | On-premise core banking system, Salesforce Financial Services Cloud, DocuSign, Box, ServiceNow, Splunk |\n| Go-live | January 2026 |\n\n### The Problem\n\nCommercial loan applications arrived as PDFs, scanned documents and emails. Loan processors manually keyed borrower details, financial statements and ownership information into the loan origination system and core banking platform.\n\n- Average time from complete application to credit decision: **12 business days**.\n- Data entry errors in borrower financials triggered rework on roughly **1 in 7 applications**.\n- KYC and beneficial ownership checks were tracked in spreadsheets, creating audit findings.\n- Competitors offering faster decisions were winning SME customers.\n\n### The Implementation\n\nFinServe followed NexaFlow's nine-phase onboarding process on the **complex track (10 weeks)**. Complexity drivers were an extended security review, single-tenant deployment, on-premise core banking integration via NexaFlow Relay and seven total integrations.\n\n| Weeks | Activity |\n|---|---|\n| 1–2 | Discovery across lending, credit risk, compliance and IT; security review started at signature |\n| 2–3 | Solution design; model risk team reviewed AI agent approach |\n| 3–4 | Single-tenant environment, SSO + SCIM, customer-managed encryption keys |\n| 4–6 | Seven integrations including Relay connection to on-premise core banking |\n| 5–7 | Migration of 2.3 million historical application records for agent context |\n| 7–9 | SIT, UAT, performance testing and penetration test coordination |\n| 9–10 | Training in two waves and phased go-live (SME lending first) |\n| +30 days | Hypercare |\n\nThe security review took five weeks, running in parallel with design and setup.\n\n### The Solution\n\n**Key workflows automated:**\n\n1. **Loan application intake** — an AI document extraction agent reads financial statements, tax returns and IDs, extracts fields and flags low-confidence values for human review.\n2. **KYC and beneficial ownership checks** — workflows call screening services, compile results and route exceptions to compliance.\n3. **Credit memo preparation** — an agent drafts a credit memo summary from extracted data for the credit analyst to edit and approve.\n4. **Conditions tracking** — outstanding documents are requested from borrowers automatically via DocuSign and email.\n5. **Audit evidence** — every agent decision, approval and data change streams to Splunk for compliance reporting.\n\n### Measurable Results\n\n| Metric | Before | After | Change |\n|---|---|---|---|\n| Application-to-decision time | 12 business days | 7.8 business days | **35% faster processing** |\n| Applications needing rework due to data errors | 1 in 7 | 1 in 10 | **30% fewer errors** |\n| Processor time per application | 3.5 hours | 1.6 hours | 54% less |\n| KYC audit findings | 4 in prior audit | 0 in next audit | Eliminated |\n\n### Customer Quote\n\n\"Our regulators care about evidence. NexaFlow gave us speed for borrowers and a complete audit trail for compliance.\" — SVP Lending Operations, FinServe Capital\n\n### Lessons Learned\n\n- Starting the security review on the day of contract signature saved an estimated three weeks.\n- Keeping humans in the loop for low-confidence extractions satisfied the model risk team.\n- A phased go-live by business line reduced risk in a regulated environment.\n\n## Key Facts\n\n- Financial services lender, 3,500 employees, Enterprise single-tenant.\n- 35% faster loan processing (12 days to 7.8 days).\n- 30% fewer data entry errors.\n- Complex implementation: 10 weeks, driven by security review, Relay and 7 integrations.\n- Zero KYC audit findings after go-live.\n\n## Related Documents\n\n- case_study_acme.md\n- case_study_healthplus.md\n- security_overview.md\n- objection_handling.md\n\n## Retrieval Notes\n\nRetrieve for banking, lending or financial services references, \"faster processing\" or \"fewer errors\" proof points, AI document extraction examples, or examples of regulated complex implementations. Not the authoritative source for general timelines (use `implementation_timeline.md`)."},{"document_id":"NEXA-003","title":"Case Study: HealthPlus Medical Group","document_type":"Case Study","main_category":"Case Studies","secondary_topics":["Complex implementation track (11 weeks)","HIPAA BAA and privacy review","Epic EHR integration via NexaFlow Relay","PHI redaction for AI agents"],"rag_tags":["case-study","healthcare","hospital","clinics","patient-referrals","prior-authorization","patient-intake","hipaa","baa","eu-data-residency","epic","45-faster-referrals"],"version":"1.0","status":"Current","last_updated":"2026-05-14","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["02_case_study_finserve.md","24_security_overview.md","12_enterprise_setup.md","17_objection_handling.md"],"summary":"Customer case study of HealthPlus Medical Group, a 14-clinic healthcare provider that automated patient referrals, prior authorization and intake under a HIPAA BAA with Epic integration via Relay. The complex 11-week implementation produced 45% faster referral processing and cut coordinator manual work from about 22 to 4 hours per week.","key_topics":["Healthcare provider, 14 clinics, 6,000 staff, Enterprise with HIPAA BAA.","45% faster referral processing (9 days to 5 days).","Coordinator manual work cut from 22 to about 4 hours per week.","Complex implementation: 11 weeks due to HIPAA, BAA and EHR integration.","59% fewer patient status calls."],"use_when":"Someone needs a healthcare reference, a HIPAA-compliant deployment example, or proof of faster referral and prior authorization processing. Authoritative for HealthPlus results only; not the authoritative source for general implementation timelines (use 14_implementation_timeline.md). Note conflict C6: the in-body Keywords mention EU data residency and 22 hours saved, but the body states US region and 18 hours saved (net).","file":"knowledge_base/05_case_studies/03_case_study_healthplus.md","filename":"03_case_study_healthplus.md","folder":"05_case_studies","retrieval_notes":"Retrieve for healthcare, hospital, clinic, HIPAA or patient referral examples. Useful with `security_overview.md` when a prospect asks for proof of HIPAA-compliant deployments. Not the authoritative source for standard implementation timelines.","body":"# Case Study: HealthPlus Medical Group\n\n## Metadata\n\n- Category: Case Studies\n- Document Type: Customer Case Study\n- Version: 1.0\n- Status: Approved for external use\n- Last Updated: 2026-05-14\n- Authoritative: Yes (for HealthPlus results)\n- Keywords: case study, healthcare, hospital, clinics, patient referrals, prior authorization, patient intake, HIPAA, BAA, EU data residency, Epic, 45% faster referrals, 22 hours saved per week, complex implementation\n- Use When: Someone needs a healthcare reference, a HIPAA-compliant deployment example, or proof of faster referral and prior authorization processing.\n\n## Summary\n\nHealthPlus Medical Group, a multi-specialty provider with 14 clinics and 6,000 staff, used NexaFlow to automate patient referrals, prior authorization requests and new patient intake. Because of HIPAA requirements, a Business Associate Agreement and integration with its electronic health record system, the project followed the complex implementation track and went live in 11 weeks. HealthPlus now processes referrals 45% faster and cut its referral coordinators' manual work from 22 to about 4 hours per week.\n\n## Main Content\n\n### Customer Profile\n\n| Attribute | Detail |\n|---|---|\n| Industry | Healthcare (multi-specialty medical group) |\n| Locations | 14 clinics and 1 ambulatory surgery center |\n| Employees | 6,000 |\n| Plan | Enterprise, 260 Full Users, HIPAA BAA, US region |\n| Systems | Epic EHR (via NexaFlow Relay and HL7/FHIR APIs), Microsoft 365, ServiceNow, fax-to-email gateway, payer portals |\n| Go-live | March 2026 |\n\n### The Problem\n\nReferrals from outside physicians arrived by fax, e-referral portals and phone. Coordinators re-typed patient demographics and clinical notes into the EHR, checked insurance eligibility manually, and submitted prior authorization requests through several payer portals.\n\n- Average time from referral received to appointment scheduled: **9 days**.\n- Referral coordinators spent about **22 hours per week** collectively on re-keying and status chasing.\n- About 18% of prior authorization requests were initially denied for missing documentation.\n- Patients called repeatedly to ask about referral status, overloading clinic front desks.\n\n### The Implementation\n\nHealthPlus followed NexaFlow's nine-phase onboarding process on the **complex track (11 weeks)**. Complexity drivers were the HIPAA BAA negotiation, a detailed security and privacy review, EHR integration through NexaFlow Relay, and training for staff across 14 clinics.\n\n| Weeks | Activity |\n|---|---|\n| 1–2 | Discovery with referral management, revenue cycle, privacy office and IT |\n| 1–4 | Security and privacy review; BAA signed in week 4 |\n| 2–3 | Solution design, including PHI redaction rules for AI agents |\n| 3–5 | Environment setup, SSO + SCIM, Relay installation in hospital data center |\n| 5–7 | Integrations: Epic (FHIR), fax gateway, Microsoft 365, ServiceNow, payer portals |\n| 6–8 | Migration of 180,000 open and recent referral records (after BAA) |\n| 8–10 | Testing, including privacy testing and clinical workflow validation |\n| 9–11 | Training in waves by clinic; go-live clinic by clinic over two weeks |\n| +30 days | Hypercare |\n\n### The Solution\n\n**Key workflows automated:**\n\n1. **Referral intake** — an AI extraction agent reads faxed and portal referrals, extracts demographics, diagnosis codes and referring provider, and creates a referral in the EHR for coordinator review.\n2. **Insurance eligibility check** — the workflow verifies coverage automatically and flags issues before scheduling.\n3. **Prior authorization packets** — an agent assembles required clinical documentation per payer rules and highlights missing items before submission.\n4. **Patient status notifications** — patients receive SMS and email updates when a referral is received, approved and scheduled.\n5. **Referral leakage dashboard** — Command Center shows referrals not scheduled within 5 days.\n\n### Measurable Results\n\n| Metric | Before | After | Change |\n|---|---|---|---|\n| Referral-to-scheduled time | 9 days | 5 days | **45% faster referral processing** |\n| Coordinator manual work | ~22 hours/week | ~4 hours/week | **18 hours saved (net) per week** |\n| Initial prior auth denials for missing documents | 18% | 11% | 39% reduction |\n| Patient status calls to front desks | ~1,100/month | ~450/month | 59% fewer calls |\n\n### Customer Quote\n\n\"Our coordinators now spend their time with patients and physicians instead of fax machines — and our privacy office was involved from day one.\" — VP Patient Access, HealthPlus Medical Group\n\n### Lessons Learned\n\n- Engaging the privacy office before kickoff avoided rework on AI agent PHI rules.\n- Migrating PHI only after the BAA was signed kept the project compliant but added two weeks, which was planned for.\n- Clinic-by-clinic go-live let early clinics coach later ones.\n\n## Key Facts\n\n- Healthcare provider, 14 clinics, 6,000 staff, Enterprise with HIPAA BAA.\n- 45% faster referral processing (9 days to 5 days).\n- Coordinator manual work cut from 22 to about 4 hours per week.\n- Complex implementation: 11 weeks due to HIPAA, BAA and EHR integration.\n- 59% fewer patient status calls.\n\n## Related Documents\n\n- case_study_finserve.md\n- security_overview.md\n- enterprise_setup.md\n- objection_handling.md\n\n## Retrieval Notes\n\nRetrieve for healthcare, hospital, clinic, HIPAA or patient referral examples. Useful with `security_overview.md` when a prospect asks for proof of HIPAA-compliant deployments. Not the authoritative source for standard implementation timelines."},{"document_id":"NEXA-004","title":"Case Study: ManufacturingCo Industries","document_type":"Case Study","main_category":"Case Studies","secondary_topics":["Standard implementation track (6 weeks)","SAP S/4HANA premium connector","Supplier onboarding with AI document checks","Multiple workspaces per plant"],"rag_tags":["case-study","manufacturing","automotive-components","factories","plants","procurement","purchase-requests","supplier-onboarding","quality-incidents","invoice-matching","sap-s-4hana","coupa"],"version":"1.1","status":"Current","last_updated":"2026-06-02","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["05_case_study_retailmax.md","01_case_study_acme.md","15_integration_guide.md","23_sales_playbook.md"],"summary":"Customer case study of ManufacturingCo Industries, a 2,800-employee automotive components manufacturer that automated purchase requests, supplier onboarding, quality incidents and invoice matching on SAP S/4HANA and Coupa. It went live in 6 weeks on the standard track with a 40% reduction in manual work and 28% faster supplier onboarding.","key_topics":["Automotive components manufacturer, 4 plants, 2,800 employees, Enterprise plan.","40% reduction in manual work across procurement and quality.","28% faster supplier onboarding (25 to 18 business days).","Implementation took 6 weeks on the standard track, integrating SAP S/4HANA and Coupa.","Purchase request to PO cut from 3 days to 6 hours."],"use_when":"Someone needs a manufacturing reference, proof of reduced manual work, or examples of procurement, supplier or quality workflows on SAP. Authoritative for ManufacturingCo results only; not the authoritative source for general implementation timelines (use 14_implementation_timeline.md).","file":"knowledge_base/05_case_studies/04_case_study_manufacturingco.md","filename":"04_case_study_manufacturingco.md","folder":"05_case_studies","retrieval_notes":"Retrieve for manufacturing, factory, plant, procurement, supplier onboarding, quality or SAP references, and for any question like \"have we helped a manufacturing company reduce manual work?\". Not the authoritative source for general implementation timelines.","body":"# Case Study: ManufacturingCo Industries\n\n## Metadata\n\n- Category: Case Studies\n- Document Type: Customer Case Study\n- Version: 1.1\n- Status: Approved for external use\n- Last Updated: 2026-06-02\n- Authoritative: Yes (for ManufacturingCo results)\n- Keywords: case study, manufacturing, automotive components, factories, plants, procurement, purchase requests, supplier onboarding, quality incidents, invoice matching, SAP S/4HANA, Coupa, 40% reduction in manual work, reduce manual work\n- Use When: Someone needs a manufacturing reference, proof of reduced manual work, or examples of procurement, supplier or quality workflows on SAP.\n\n## Summary\n\nManufacturingCo Industries, an automotive components manufacturer with four plants and 2,800 employees, used NexaFlow to automate purchase requests, supplier onboarding, quality incident handling and invoice matching on top of SAP S/4HANA and Coupa. The implementation took 6 weeks on the standard Enterprise track. ManufacturingCo achieved a 40% reduction in manual work across procurement and quality teams and onboards suppliers 28% faster.\n\n## Main Content\n\n### Customer Profile\n\n| Attribute | Detail |\n|---|---|\n| Industry | Manufacturing (automotive components: brake assemblies and precision castings) |\n| Locations | 4 plants in the US and Mexico |\n| Employees | 2,800 |\n| Plan | Enterprise, 300 Full Users, US region |\n| Systems | SAP S/4HANA, Coupa, Microsoft Teams, SharePoint, a quality management system via REST API |\n| Go-live | April 2026 |\n\n### The Problem\n\nManufacturingCo's procurement and quality processes relied on email, spreadsheets and manual SAP entry.\n\n- **Purchase requests** from plant engineers were emailed as spreadsheets and keyed into SAP by buyers, taking an average of 3 days to become purchase orders.\n- **Supplier onboarding** required collecting certificates (ISO 9001, IATF 16949), tax forms and bank details by email, taking about 25 business days.\n- **Quality incidents** (non-conforming parts) were logged on paper at the line and later typed into the quality system, delaying supplier corrective action requests.\n- **Invoice matching** exceptions between SAP goods receipts and supplier invoices were resolved manually by accounts payable.\n- Procurement and quality teams estimated that roughly **half their week** went to administrative tasks.\n\n### The Implementation\n\nManufacturingCo followed NexaFlow's standard nine-phase onboarding process and went live in **6 weeks**, at the upper end of the standard 4–6 week timeline.\n\n| Week | Activity |\n|---|---|\n| 1 | Discovery at two plants and headquarters procurement |\n| 1–2 | Solution design for four workflows; workspace per plant |\n| 2 | Environment setup, Microsoft Entra ID SSO and SCIM |\n| 2–3 | SAP S/4HANA (premium connector), Coupa, Teams, SharePoint, quality system REST API |\n| 3–4 | Migration of 6,500 supplier records and 90,000 open purchase and receipt lines |\n| 4–5 | SIT and UAT with buyers, quality engineers and AP clerks |\n| 5 | Training for 300 users; plant floor supervisors used the approver video |\n| 6 | Go-live across all four plants |\n\nIt remained a standard project because all five integrations used pre-built or REST connectors, migration stayed under 1 million records, and no on-premise systems were involved.\n\n### The Solution\n\n**Key workflows automated:**\n\n1. **Purchase request to PO** — engineers submit requests via a Teams form; NexaFlow checks budget and preferred suppliers in SAP, routes approvals by value, and creates the purchase order automatically.\n2. **Supplier onboarding** — suppliers upload certificates and tax documents through a portal; an AI agent checks certificate expiry dates and completeness, then creates the vendor in SAP after approval.\n3. **Quality incident handling** — line supervisors log non-conforming parts on a tablet with photos; NexaFlow creates the incident, notifies quality engineers and issues a supplier corrective action request.\n4. **Three-way invoice matching** — invoices from Coupa are matched to SAP POs and goods receipts; only true exceptions go to AP.\n5. **Plant operations dashboard** — Command Center shows PO cycle time, open incidents and supplier onboarding status by plant.\n\n### Measurable Results\n\n| Metric | Before | After | Change |\n|---|---|---|---|\n| Manual administrative work (procurement and quality) | Baseline | 40% lower | **40% reduction in manual work** |\n| Supplier onboarding time | 25 business days | 18 business days | **28% faster supplier onboarding** |\n| Purchase request to PO | 3 days | 6 hours | 92% faster |\n| Invoice exceptions handled manually | 22% of invoices | 8% of invoices | 64% fewer |\n| Time to raise supplier corrective action | 5 days | 1 day | 80% faster |\n\n### Customer Quote\n\n\"Our buyers and quality engineers are back to managing suppliers and quality, not typing. A 40% cut in manual work across four plants is real capacity.\" — VP Supply Chain, ManufacturingCo Industries\n\n### Lessons Learned\n\n- One workspace per plant, with shared templates from headquarters, balanced local flexibility with standards.\n- The SAP premium connector avoided any custom integration work.\n- Including floor supervisors in UAT made the tablet incident form practical on the line.\n\n## Key Facts\n\n- Automotive components manufacturer, 4 plants, 2,800 employees, Enterprise plan.\n- 40% reduction in manual work across procurement and quality.\n- 28% faster supplier onboarding (25 to 18 business days).\n- Implementation took 6 weeks on the standard track, integrating SAP S/4HANA and Coupa.\n- Purchase request to PO cut from 3 days to 6 hours.\n\n## Related Documents\n\n- case_study_retailmax.md\n- case_study_acme.md\n- integration_guide.md\n- sales_playbook.md\n\n## Retrieval Notes\n\nRetrieve for manufacturing, factory, plant, procurement, supplier onboarding, quality or SAP references, and for any question like \"have we helped a manufacturing company reduce manual work?\". Not the authoritative source for general implementation timelines."},{"document_id":"NEXA-005","title":"Case Study: RetailMax","document_type":"Case Study","main_category":"Case Studies","secondary_topics":["Fast standard implementation (4 weeks)","Free Approver licences for store managers","Shopify, NetSuite and Zendesk integration","AI order exception triage"],"rag_tags":["case-study","retail","stores","e-commerce","returns","refunds","order-exceptions","store-operations","customer-service","shopify","zendesk","netsuite"],"version":"1.3","status":"Current","last_updated":"2026-02-17","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["01_case_study_acme.md","04_case_study_manufacturingco.md","16_licensing_model.md","14_implementation_timeline.md"],"summary":"Customer case study of RetailMax, a 220-store omnichannel retailer that automated order exceptions, returns and refunds, and store maintenance requests. It went live in 4 weeks before the holiday peak, with 30% fewer order and refund errors and 18 hours saved per week.","key_topics":["Omnichannel retailer, 220 stores, Enterprise plan with 180 Full Users.","30% fewer order and refund errors.","18 hours saved per week in customer service operations.","Went live in 4 weeks — the fast end of the standard 4–6 week timeline.","Refund processing 64% faster."],"use_when":"Someone needs a retail or e-commerce reference, proof of fewer errors, store operations automation, or an example of a fast 4-week implementation. Authoritative for RetailMax results only; not the authoritative source for general implementation timelines (use 14_implementation_timeline.md).","file":"knowledge_base/05_case_studies/05_case_study_retailmax.md","filename":"05_case_study_retailmax.md","folder":"05_case_studies","retrieval_notes":"Retrieve for retail, e-commerce, returns/refunds or store operations references, \"fewer errors\" proof points, or an example of the fastest standard implementation. Not the authoritative source for implementation timelines (use `implementation_timeline.md`).","body":"# Case Study: RetailMax\n\n## Metadata\n\n- Category: Case Studies\n- Document Type: Customer Case Study\n- Version: 1.3\n- Status: Approved for external use\n- Last Updated: 2026-02-17\n- Authoritative: Yes (for RetailMax results)\n- Keywords: case study, retail, stores, e-commerce, returns, refunds, order exceptions, store operations, customer service, Shopify, Zendesk, NetSuite, 30% fewer errors, 18 hours saved per week, fast implementation\n- Use When: Someone needs a retail or e-commerce reference, proof of fewer errors, store operations automation, or an example of a fast 4-week implementation.\n\n## Summary\n\nRetailMax, an apparel and home goods retailer with 220 stores and a growing online channel, used NexaFlow to automate order exception handling, returns and refunds, and store maintenance requests. The project was scoped tightly and went live in 4 weeks, the fastest end of the standard 4–6 week enterprise timeline. RetailMax reduced order and refund errors by 30% and saves 18 hours per week in customer service operations.\n\n## Main Content\n\n### Customer Profile\n\n| Attribute | Detail |\n|---|---|\n| Industry | Retail (apparel and home goods, omnichannel) |\n| Locations | 220 stores in the US and Canada, plus e-commerce |\n| Employees | 9,000 (including store staff) |\n| Plan | Enterprise, 180 Full Users; store managers use free Approver access |\n| Systems | Shopify Plus, Oracle NetSuite, Zendesk, Slack, Google Workspace |\n| Go-live | September 2025, before peak holiday season |\n\n### The Problem\n\nRetailMax's online sales had grown 60% in two years, but back-office processes had not kept up.\n\n- Order exceptions (address problems, payment holds, out-of-stock items) were handled from a shared Zendesk view with no prioritisation.\n- Refunds for returns required agents to check Shopify, NetSuite and the warehouse system manually; about **1 in 20 refunds** had an error (wrong amount, duplicate refund or missed restocking).\n- Store maintenance requests were emailed to regional managers and often lost.\n- The customer service operations team spent around **18 hours per week** on manual reconciliation.\n- Leadership wanted the solution live **before the holiday peak**, giving the team 5 weeks.\n\n### The Implementation\n\nRetailMax followed NexaFlow's standard nine-phase onboarding process and went live in **4 weeks**.\n\n| Week | Activity |\n|---|---|\n| 1 | Discovery and solution design (combined, 3 workflows in scope) |\n| 1–2 | Environment setup with Google Workspace SSO and SCIM |\n| 2 | Shopify Plus, NetSuite, Zendesk and Slack connectors configured |\n| 2–3 | Migration of 35,000 open orders and return authorisations |\n| 3 | UAT with customer service leads and 5 pilot stores |\n| 4 | Operator training, 10-minute approver video for store managers, go-live |\n\nFactors that kept it fast: four systems with pre-built connectors, a small migration, a standard security questionnaire completed in one week, and a full-time project lead on the RetailMax side.\n\n### The Solution\n\n**Key workflows automated:**\n\n1. **Order exception triage** — an AI agent classifies each exception, fixes simple address issues automatically and routes the rest to the right queue by priority and order value.\n2. **Returns and refund processing** — when a return is received, NexaFlow verifies the item, calculates the refund, issues it in Shopify, updates NetSuite and triggers restocking.\n3. **Duplicate refund prevention** — a rule checks for existing refunds before processing.\n4. **Store maintenance requests** — store managers submit requests via a form; approvals happen in Slack; vendors are dispatched automatically.\n5. **Peak season dashboard** — Command Center tracks exception backlog and refund SLA in real time.\n\n### Measurable Results\n\n| Metric | Before | After | Change |\n|---|---|---|---|\n| Refund and order processing errors | 1 in 20 | 1 in 29 | **30% fewer errors** |\n| Manual reconciliation effort | ~18 hours/week | Minimal | **18 hours saved per week** |\n| Average refund processing time | 4.2 days | 1.5 days | 64% faster |\n| Holiday peak exception backlog | 2,400 (prior year) | 600 | 75% lower |\n\n### Customer Quote\n\n\"We had five weeks before peak season. NexaFlow was live in four, and it was the calmest holiday our service team has had.\" — Director of Customer Operations, RetailMax\n\n### Lessons Learned\n\n- A hard deadline plus a narrow scope (three workflows) made a 4-week go-live realistic.\n- Giving store managers free Approver access in Slack avoided buying extra licenses.\n- Phase 2 (vendor invoice automation) started after hypercare ended.\n\n## Key Facts\n\n- Omnichannel retailer, 220 stores, Enterprise plan with 180 Full Users.\n- 30% fewer order and refund errors.\n- 18 hours saved per week in customer service operations.\n- Went live in 4 weeks — the fast end of the standard 4–6 week timeline.\n- Refund processing 64% faster.\n\n## Related Documents\n\n- case_study_acme.md\n- case_study_manufacturingco.md\n- licensing_model.md\n- implementation_timeline.md\n\n## Retrieval Notes\n\nRetrieve for retail, e-commerce, returns/refunds or store operations references, \"fewer errors\" proof points, or an example of the fastest standard implementation. Not the authoritative source for implementation timelines (use `implementation_timeline.md`)."}],"chunks":[{"doc":"NEXA-010","heading":"Summary","text":"The Enterprise plan adds the scale, governance and deployment options large organisations need. This document describes performance and scalability limits, availability commitments, deployment models, multi-workspace governance, advanced AI controls and the enterprise support model. It describes what the product can do; the steps to configure these capabilities during onboarding are in `enterprise_setup.md`.","outdated":false},{"doc":"NEXA-010","heading":"Key Facts","text":"- 99.9% uptime SLA; RPO 1 hour, RTO 4 hours.\n- Proven at 10 million runs per month in one tenant.\n- Single-tenant option and US/EU/APAC data residency.\n- No self-hosted on-premise version; on-prem systems connect via Relay.\n- Enterprise includes named CSM, dedicated implementation team and 30-day hypercare.","outdated":false},{"doc":"NEXA-010","heading":"Scalability and Performance","text":"NexaFlow's execution engine scales horizontally, so throughput increases automatically as workload grows.\n\n| Metric | Enterprise Capability |\n|---|---|\n| Included workflow runs | 500,000 per month (more available, see pricing) |\n| Proven peak volume | 10 million runs per month in a single tenant |\n| Concurrent runs | Up to 2,000 simultaneous runs per tenant (raisable) |\n| Median step latency | Under 300 ms for native steps |\n| API rate limit | 3,000 requests/minute, raisable |\n| Users | Tested with 25,000 named users in one tenant |\n\nLarge batch jobs (for example, nightly processing of 200,000 invoices) are queued and processed in parallel with priority controls so interactive workflows are not slowed.","outdated":false},{"doc":"NEXA-010","heading":"Availability and Resilience","text":"- **99.9% monthly uptime SLA** with service credits.\n- Multi-availability-zone architecture with automated failover.\n- RPO 1 hour, RTO 4 hours; optional cross-region disaster recovery.\n- Planned maintenance windows are announced 7 days in advance and scheduled outside customer business hours.\n- Public status page and incident notifications by email and webhook.","outdated":false},{"doc":"NEXA-010","heading":"Deployment Models","text":"1. **Multi-tenant cloud (default)** — logically isolated tenant, fastest to provision.\n2. **Single-tenant cloud (optional)** — dedicated compute and database for customers with strict isolation requirements. Provisioning adds roughly 1 week to environment setup.\n3. **Data residency** — choose US, EU or APAC. All customer data, backups and logs remain in the selected region.\n\nNexaFlow does not offer a fully self-hosted on-premise version. On-premise systems connect through the NexaFlow Relay agent.","outdated":false},{"doc":"NEXA-010","heading":"Governance for Large Organisations","text":"- **Multiple workspaces** — separate spaces for Finance, HR, IT and regions, each with its own builders, connectors and approval rules.\n- **Environment promotion** — Development → Staging → Production, with required approvals before a flow is published to Production.\n- **Center of Excellence (CoE) controls** — central admins can publish approved templates, restrict which connectors each workspace may use and review all production changes.\n- **Custom roles and SCIM** — fine-grained RBAC, automatically provisioned from the identity provider.\n- **Change history** — every flow version, publisher and approver is recorded in the audit log.","outdated":false},{"doc":"NEXA-010","heading":"Advanced AI Controls","text":"- Approved model lists and bring-your-own LLM keys.\n- Policy templates for agent confidence thresholds (for example, route to a human below 85% confidence).\n- PII redaction before model calls.\n- Agent evaluation reports showing accuracy, overrides and drift over time.","outdated":false},{"doc":"NEXA-010","heading":"Enterprise Support Model","text":"- Named Customer Success Manager (CSM).\n- 24/7 support with 1-hour P1 response target.\n- Dedicated implementation team: engagement manager, solution architect and integration engineer.\n- 30 days of hypercare after go-live, then quarterly business reviews.\n- Role-based training program for admins, builders and operators.","outdated":false},{"doc":"NEXA-010","heading":"Typical Enterprise Buyer Requirements Mapped","text":"| Requirement | NexaFlow Answer |\n|---|---|\n| \"We need SSO and automatic deprovisioning\" | SAML/OIDC SSO + SCIM |\n| \"Our data must stay in the EU\" | EU data residency (Frankfurt) |\n| \"We need 7-year audit retention\" | Extendable audit log retention + SIEM streaming |\n| \"We must connect to on-prem SAP ECC\" | NexaFlow Relay |\n| \"We process millions of transactions\" | Proven 10M runs/month per tenant |\n| \"Business units must be separated\" | Multiple workspaces with scoped RBAC |","outdated":false},{"doc":"NEXA-013","heading":"Summary","text":"This matrix lists which NexaFlow capabilities are included in the Starter, Professional and Enterprise plans. It is aligned with `pricing_guide_v3.md` (effective 2026-07-01), which is the authoritative source for prices and usage allowances. Use this document for \"is feature X included?\" questions and the pricing guide for \"what does it cost?\" questions.","outdated":false},{"doc":"NEXA-013","heading":"Key Facts","text":"- SSO is available on Professional and Enterprise; SCIM is Enterprise-only.\n- Audit logs: none on Starter, 90 days on Professional, 1 year (up to 7) on Enterprise.\n- Enterprise includes 500,000 workflow runs per month and unlimited AI agents.\n- Uptime SLA: 99.5% Professional, 99.9% Enterprise.\n- Enterprise implementation is guided and required.","outdated":false},{"doc":"NEXA-013","heading":"Plan Positioning","text":"- **Starter** — small teams automating departmental workflows. Self-serve.\n- **Professional** — growing mid-sized companies automating cross-department processes with SSO and more integrations.\n- **Enterprise** — large organisations needing advanced security, governance, scale, dedicated support and guided implementation.","outdated":false},{"doc":"NEXA-013","heading":"Core Workflow Features","text":"| Feature | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Flow Builder (visual canvas) | Yes | Yes | Yes |\n| Workflow templates | 30 | 120+ | 120+ plus custom template library |\n| Active workflows | 20 | 200 | Unlimited |\n| Workflow runs included / month | 5,000 | 50,000 | 500,000 |\n| Environments | Production only | Dev + Production | Dev + Staging + Production |\n| Flow version history | 30 days | 1 year | Unlimited |\n| Human approval steps | Yes | Yes | Yes |\n| Parallel branches and loops | No | Yes | Yes |","outdated":false},{"doc":"NEXA-013","heading":"AI Agent Features","text":"| Feature | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Agent Studio | Yes | Yes | Yes |\n| Active AI agents | 2 | 15 | Unlimited |\n| Document extraction agents | No | Yes | Yes |\n| Knowledge sources per agent | 1 | 10 | Unlimited |\n| Bring-your-own LLM key | No | No | Yes |\n| Agent confidence thresholds and approval gates | Basic | Yes | Yes, with policy templates |\n| Agent decision logs | 30 days | 90 days | 1 year (extendable to 7 years) |","outdated":false},{"doc":"NEXA-013","heading":"Integrations and API","text":"| Feature | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Pre-built connectors | 25 standard | All 200+ | All 200+ |\n| Premium connectors (SAP, Oracle, Workday) | No | Add-on | Included |\n| Generic REST connector | No | Yes | Yes |\n| NexaFlow Relay (on-premise agent) | No | No | Yes |\n| Nexa API (REST) | Read-only | Full | Full |\n| GraphQL API | No | Yes | Yes |\n| Webhooks | 5 | 100 | Unlimited |\n| API rate limit | 60 req/min | 600 req/min | 3,000 req/min (raisable) |","outdated":false},{"doc":"NEXA-013","heading":"Security, Identity and Governance","text":"| Feature | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Email + MFA login | Yes | Yes | Yes |\n| SSO (SAML 2.0 / OIDC) | No | Yes | Yes |\n| SCIM user provisioning | No | No | Yes |\n| Role-based access control | 3 fixed roles | 5 default roles | 5 default roles + custom roles |\n| Audit logs | No | 90-day retention | 1-year retention (extendable to 7 years) |\n| Audit log export / SIEM streaming | No | CSV export | SIEM streaming (Splunk, Datadog, Sentinel) |\n| IP allowlisting | No | No | Yes |\n| Data residency choice | US only | US or EU | US, EU or APAC |\n| Single-tenant deployment | No | No | Optional |\n| Customer-managed encryption keys | No | No | Yes |\n| HIPAA BAA | No | No | Yes |","outdated":false},{"doc":"NEXA-013","heading":"Dashboards and Reporting","text":"| Feature | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Command Center standard dashboards | Yes | Yes | Yes |\n| Custom dashboards | No | 10 | Unlimited |\n| Hours-saved / ROI tracking | No | Yes | Yes |\n| BI export (Snowflake, BigQuery) | No | No | Yes |","outdated":false},{"doc":"NEXA-013","heading":"Support and Services","text":"| Feature | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Support channel | Email | Email + chat | 24/7 phone, chat, email |\n| Target first response (P1) | 1 business day | 4 hours | 1 hour |\n| Uptime SLA | None | 99.5% | 99.9% |\n| Customer Success Manager | No | Pooled | Named CSM |\n| Implementation | Self-serve | Optional Quick Start | Guided implementation (required) |\n| Training | Online academy | Academy + 2 live sessions | Role-based training program |","outdated":false},{"doc":"NEXA-013","heading":"Notes","text":"- Usage allowances above match `pricing_guide_v3.md`. Earlier matrices (v2) showed Professional with 25,000 runs; that figure is retired.\n- Custom roles, SCIM and SIEM streaming are Enterprise-only and are the most common reason Professional customers upgrade.","outdated":false},{"doc":"NEXA-015","heading":"Summary","text":"NexaFlow connects to business systems through NexaFlow Connect (200+ pre-built connectors), a generic REST connector, the Nexa API, webhooks and the NexaFlow Relay on-premise agent. This guide lists supported systems, explains each integration method, and covers authentication, limits and best practices. Integration configuration during onboarding is scheduled in `implementation_timeline.md`.","outdated":false},{"doc":"NEXA-015","heading":"Key Facts","text":"- 200+ pre-built connectors; premium connectors include SAP, Oracle Fusion and Workday.\n- REST and GraphQL APIs, OAuth 2.0, Python and JS SDKs.\n- NexaFlow Relay connects on-premise systems with outbound-only connections (Enterprise).\n- Webhooks are HMAC-signed and retried for 24 hours.\n- More than five integrations usually makes an implementation \"complex\" (8–12 weeks).","outdated":false},{"doc":"NEXA-015","heading":"Integration Methods","text":"| Method | Best For | Plans |\n|---|---|---|\n| Pre-built connectors | Popular SaaS and ERP systems | All (25 on Starter) |\n| Generic REST connector | Any system with a REST API | Professional, Enterprise |\n| Nexa API (REST / GraphQL) | Developers triggering flows or reading data | All (read-only on Starter) |\n| Webhooks (inbound and outbound) | Real-time event notifications | All (limits vary) |\n| NexaFlow Relay | On-premise databases, file shares, legacy apps | Enterprise |\n| SFTP / file drop | Batch CSV or EDI files | Professional, Enterprise |","outdated":false},{"doc":"NEXA-015","heading":"Supported Systems (Selected)","text":"**CRM:** Salesforce Sales Cloud and Service Cloud, HubSpot, Microsoft Dynamics 365 CRM, Zoho CRM\n**ERP & Finance:** SAP S/4HANA, SAP ECC (via Relay), Oracle NetSuite, Oracle Fusion, Microsoft Dynamics 365 Finance, QuickBooks Online, Xero, Coupa\n**HR:** Workday, SAP SuccessFactors, BambooHR, ADP Workforce Now\n**ITSM & Service:** ServiceNow, Jira Service Management, Zendesk, Freshdesk\n**Collaboration:** Slack, Microsoft Teams, Google Workspace, Microsoft 365 (Outlook, SharePoint, OneDrive)\n**Data:** Snowflake, BigQuery, PostgreSQL, SQL Server, MySQL, Oracle Database\n**Identity:** Okta, Microsoft Entra ID (Azure AD), Ping Identity (used for SSO and SCIM)\n**Documents:** DocuSign, Adobe Acrobat Sign, Box, Dropbox\n\nSAP, Oracle Fusion and Workday connectors are classified as premium connectors: an add-on on Professional and included on Enterprise.","outdated":false},{"doc":"NEXA-015","heading":"The Nexa API","text":"- **REST API** — resources for flows, runs, agents, users, roles and audit events. JSON over HTTPS.\n- **GraphQL API** — query run history and dashboard metrics efficiently (Professional and Enterprise).\n- **Authentication** — OAuth 2.0 client credentials for server-to-server use; personal API keys for testing. Keys are scoped to roles and can be rotated or revoked from the Admin Console.\n- **Rate limits** — 60 requests/minute (Starter), 600 (Professional), 3,000 (Enterprise, raisable on request).\n- **Versioning** — the API is versioned in the URL (`/v3/`). Deprecated versions receive 12 months' notice.\n- **SDKs** — official Python and JavaScript/TypeScript SDKs.","outdated":false},{"doc":"NEXA-015","heading":"Webhooks","text":"Outbound webhooks send signed (HMAC-SHA256) event payloads when a run starts, completes, fails or waits for approval. Inbound webhooks give each flow a unique URL that can trigger it. Failed deliveries retry with exponential backoff for up to 24 hours.","outdated":false},{"doc":"NEXA-015","heading":"NexaFlow Relay (On-Premise Agent)","text":"The Relay is a lightweight agent installed inside the customer network (Linux or Windows, or as a Docker container). It opens an outbound-only TLS connection to NexaFlow, so no inbound firewall ports are required. It supports on-premise databases, SAP ECC, file shares and internal HTTP services. Enterprise customers commonly deploy two Relay instances for high availability. Relay installation usually needs the customer's network and security teams, which is one reason integration-heavy projects can extend beyond the standard implementation timeline.","outdated":false},{"doc":"NEXA-015","heading":"Credential Security","text":"Connector credentials are encrypted with AES-256 and stored in a dedicated secrets vault. Enterprise customers can use customer-managed keys. Credentials are never shown again after being saved. See `security_overview.md`.","outdated":false},{"doc":"NEXA-015","heading":"Integration Best Practices","text":"1. Create a dedicated service account in each connected system with least-privilege permissions.\n2. Build and test in the Development environment first, using sandbox instances of the target systems.\n3. Map fields and data owners before configuration; unclear field mapping is the top cause of integration delays.\n4. Enable failure alerts to Slack or Teams for every production flow.\n5. Keep the number of integrations in the first go-live phase small (typically 3–5) and add more after launch.","outdated":false},{"doc":"NEXA-015","heading":"Integration Complexity and Timelines","text":"In the standard enterprise implementation, integration configuration happens in weeks 2–3. Projects with more than five integrations, on-premise systems via Relay, or custom API work are treated as complex and typically move into the 8–12 week range. The authoritative timeline is in `implementation_timeline.md`.","outdated":false},{"doc":"NEXA-021","heading":"Summary","text":"NexaFlow Technologies sells a B2B workflow automation and AI operations platform for mid-sized and enterprise companies. The platform combines a visual workflow builder, configurable AI agents, 200+ pre-built integrations, operational dashboards and an open API. This document explains the five core modules, typical use cases and the value customers get. Detailed plan-by-plan feature availability lives in `feature_matrix.md`.","outdated":false},{"doc":"NEXA-021","heading":"Key Facts","text":"- Five core modules: Flow Builder, Agent Studio, NexaFlow Connect, Command Center, Nexa API/Admin Console.\n- 200+ pre-built connectors and 120+ workflow templates.\n- REST and GraphQL APIs with webhooks.\n- Hosted on AWS; US, EU and APAC data residency for Enterprise.\n- AI agent decisions are fully logged and can require human approval.","outdated":false},{"doc":"NEXA-021","heading":"What NexaFlow Is","text":"NexaFlow is a cloud platform that lets operations, finance, HR, IT and customer teams automate multi-step business processes that span several systems. Instead of employees copying data between a CRM, an ERP, email and spreadsheets, NexaFlow listens for events, applies business rules, calls AI agents when judgement is needed, and routes exceptions to humans.\n\nNexaFlow is delivered as multi-tenant SaaS on AWS. Enterprise customers can request a single-tenant (dedicated) environment and choose a data residency region (US, EU or APAC). Details are in `enterprise_capabilities.md`.","outdated":false},{"doc":"NEXA-021","heading":"The Five Core Modules","text":"**1. Flow Builder**\nA drag-and-drop canvas for designing workflows. Flows are made of triggers (a new record, a schedule, a webhook, an email), steps (create, update, transform, approve, notify) and conditions (branching, loops, parallel paths). Flows are versioned, so teams can test a draft version without affecting the live one. More than 120 workflow templates are included for common processes such as invoice approval, employee onboarding, purchase requests and customer escalations.\n\n**2. Agent Studio**\nAgent Studio is where teams build AI agents that sit inside workflows. An agent is given instructions, a set of allowed tools (for example \"read a Salesforce account\" or \"draft an email\"), and optional knowledge sources. Typical agents classify incoming requests, extract fields from documents (invoices, contracts, claims), summarise case history, or recommend the next action. Every agent decision is logged with its inputs and outputs, and agents can be configured to require human approval above a confidence threshold.\n\n**3. NexaFlow Connect (Integrations)**\nMore than 200 pre-built connectors for systems such as Salesforce, HubSpot, SAP S/4HANA, Oracle NetSuite, Microsoft Dynamics 365, Workday, ServiceNow, Zendesk, Jira, Slack, Microsoft Teams, Google Workspace, Snowflake and major databases. A generic REST connector and a secure on-premise agent (NexaFlow Relay) cover systems without a pre-built connector. See `integration_guide.md`.\n\n**4. Command Center (Dashboards)**\nReal-time dashboards showing workflow volume, cycle time, SLA breaches, exception queues, agent accuracy and hours saved. Managers can build custom dashboards, set alerts and export data to BI tools.\n\n**5. Nexa API and Admin Console**\nThe Nexa API (REST and GraphQL, with webhooks) lets engineering teams trigger flows, manage users and pull run data programmatically. The Admin Console handles users, role-based access control (RBAC), SSO, environments (Development, Staging, Production) and audit logs. Security controls are described in `security_overview.md`.","outdated":false},{"doc":"NEXA-021","heading":"Common Use Cases","text":"| Function | Example Workflow |\n|---|---|\n| Finance | Invoice capture, 3-way match, approval routing, ERP posting |\n| Operations | Purchase requests, supplier onboarding, quality incident handling |\n| HR | Employee onboarding and offboarding across HRIS, IT and payroll |\n| Customer Service | Ticket triage by AI agent, escalation, refund approvals |\n| Sales Ops | Lead routing, quote approvals, contract handoff to finance |\n| IT | Access requests, license provisioning, incident notifications |","outdated":false},{"doc":"NEXA-021","heading":"Who Uses NexaFlow","text":"- **Operations leaders** who own process efficiency and SLA targets.\n- **IT and automation teams** who govern integrations and security.\n- **Business analysts** who build and maintain flows without writing code.\n- **Developers** who extend the platform through the API.","outdated":false},{"doc":"NEXA-021","heading":"How Customers Measure Value","text":"Customers typically track hours of manual work removed, processing time, error rates and onboarding speed. Published customer results include 40% reduction in manual work at a manufacturer and 35% faster processing at a financial services firm (see the case study documents).","outdated":false},{"doc":"NEXA-021","heading":"Deployment Summary","text":"Starter customers self-onboard in days. Professional and Enterprise customers go through a guided implementation. A standard enterprise implementation takes 4–6 weeks; this is covered in the Implementation documents, not here.","outdated":false},{"doc":"NEXA-024","heading":"Summary","text":"NexaFlow is built for regulated and security-conscious organisations. The platform is SOC 2 Type II and ISO 27001 certified, supports GDPR, and offers HIPAA-ready deployments with a Business Associate Agreement on Enterprise. This document covers infrastructure security, encryption, identity (SSO, MFA, SCIM), role-based access control, audit logs and how customer data is handled by AI agents.","outdated":false},{"doc":"NEXA-024","heading":"Key Facts","text":"- SOC 2 Type II, ISO 27001, GDPR; HIPAA with BAA on Enterprise.\n- AES-256 at rest, TLS 1.2+ in transit, customer-managed keys on Enterprise.\n- SSO (SAML/OIDC) on Professional+; SCIM and custom roles on Enterprise.\n- Audit logs: 90 days (Professional), 1–7 years with SIEM streaming (Enterprise).\n- Customer data is never used to train AI models.","outdated":false},{"doc":"NEXA-024","heading":"Certifications and Compliance","text":"| Standard | Status |\n|---|---|\n| SOC 2 Type II | Certified, audited annually (latest report: March 2026) |\n| ISO/IEC 27001:2022 | Certified |\n| GDPR | Compliant; Data Processing Agreement available to all customers |\n| HIPAA | Supported on Enterprise with signed BAA |\n| CCPA | Compliant |\n| Penetration testing | Independent third-party test twice a year; summary available under NDA |\n\nSOC 2 reports and the standard security questionnaire (CAIQ) are shared through the NexaFlow Trust Center after an NDA is signed.","outdated":false},{"doc":"NEXA-024","heading":"Infrastructure","text":"- Hosted on AWS in US (Virginia), EU (Frankfurt) and APAC (Sydney) regions.\n- Production runs across multiple availability zones with automated failover.\n- Recovery Point Objective (RPO): 1 hour. Recovery Time Objective (RTO): 4 hours.\n- Encrypted backups are retained for 35 days.\n- Employee production access requires hardware MFA, is time-bound and is logged.","outdated":false},{"doc":"NEXA-024","heading":"Encryption","text":"- **In transit:** TLS 1.2 or higher for all traffic.\n- **At rest:** AES-256 for databases, file storage and backups.\n- **Secrets:** connector credentials stored in a dedicated vault.\n- **Customer-managed keys (CMK):** available on Enterprise via AWS KMS.","outdated":false},{"doc":"NEXA-024","heading":"Identity and Authentication","text":"- **MFA** is available on all plans and can be enforced by admins.\n- **Single Sign-On** via SAML 2.0 or OpenID Connect on Professional and Enterprise. Tested with Okta, Microsoft Entra ID, Ping Identity and Google Workspace.\n- **SCIM 2.0 provisioning** (Enterprise) automatically creates, updates and deactivates users from the identity provider.\n- **Session controls** include idle timeout and IP allowlisting (Enterprise).","outdated":false},{"doc":"NEXA-024","heading":"Role-Based Access Control (RBAC)","text":"NexaFlow uses role-based access control across flows, agents, connectors and data.\n\nDefault roles (Professional and Enterprise):\n\n1. **Owner** — full control including billing and security settings.\n2. **Admin** — manages users, roles, connectors and environments.\n3. **Builder** — creates and edits flows and agents in permitted workspaces.\n4. **Operator** — runs flows, handles approvals and exception queues.\n5. **Viewer** — read-only access to dashboards and run history.\n\nEnterprise customers can create **custom roles** with granular permissions (for example \"can approve payments over $10,000 but cannot edit flows\"). Permissions can be scoped by workspace, so finance flows are invisible to HR builders. Starter includes three fixed roles (Admin, Builder, Viewer).","outdated":false},{"doc":"NEXA-024","heading":"Audit Logs","text":"Audit logs record who did what and when: logins, SSO events, permission changes, flow edits and publishes, connector credential changes, API key usage, agent decisions and data exports.\n\n- Starter: not available.\n- Professional: 90-day retention, CSV export.\n- Enterprise: 1-year retention by default, extendable up to 7 years; real-time streaming to SIEM tools (Splunk, Datadog, Microsoft Sentinel).\n- Audit logs are immutable and cannot be edited or deleted by customer admins.","outdated":false},{"doc":"NEXA-024","heading":"AI Agent Data Handling","text":"- Customer data is **never used to train** foundation models.\n- LLM providers are contractually bound to zero data retention.\n- Enterprise customers may bring their own LLM key or restrict agents to an approved model list.\n- Agents can only access tools and connectors explicitly granted to them, and every agent action is written to the audit log.\n- PII redaction can be applied before content is sent to a model.","outdated":false},{"doc":"NEXA-024","heading":"Data Retention and Deletion","text":"Run data is retained according to plan settings (configurable on Enterprise). On contract termination, customer data is deleted within 30 days and a deletion certificate is available on request.","outdated":false},{"doc":"NEXA-024","heading":"Security Reviews During Sales and Onboarding","text":"Most enterprise buyers run a vendor security review. A standard review (questionnaire + SOC 2 report) typically takes 1–2 weeks. Reviews needing custom contract terms, on-site assessments or penetration test coordination take longer and are a common reason onboarding moves into the extended 8–12 week timeline (see `implementation_timeline.md`).","outdated":false},{"doc":"NEXA-009","heading":"Summary","text":"This policy defines the discounts NexaFlow sellers can offer and who must approve them. Standard discounts (annual billing, multi-year terms) are built into `pricing_guide_v3.md` and need no approval. Additional discretionary discounts follow an approval matrix by seniority. The policy also covers special programs, prohibited practices and how discounts interact with renewals.","outdated":false},{"doc":"NEXA-009","heading":"Key Facts","text":"- Annual billing (~17%) and multi-year discounts (5% / 10%) need no approval.\n- AEs can give up to 10%; Sales Managers up to 20%; VP Sales up to 30%; above 30% needs the CFO.\n- Complex Enterprise implementation fees are not discountable.\n- Nonprofit and education discounts are 15%.\n- Unconditional quarter-end discounts are prohibited.","outdated":false},{"doc":"NEXA-009","heading":"1. Standard Discounts (No Approval Required)","text":"| Discount | Amount | Notes |\n|---|---|---|\n| Annual billing | ~17% vs monthly price | Already reflected in annual list prices ($29 / $59 / $95) |\n| 2-year term | 5% off annual price | Paid annually in advance |\n| 3-year term | 10% off annual price | Paid annually in advance |\n\nStandard discounts are stackable with each other only in the sense that the multi-year percentage applies to the annual price. They do not count toward the discretionary limits below.","outdated":false},{"doc":"NEXA-009","heading":"2. Discretionary Discount Approval Matrix","text":"Discretionary discount is measured as the percentage below the **annual list or tier target price** after standard discounts.\n\n| Additional Discount | Approver | Turnaround |\n|---|---|---|\n| 0–10% | Account Executive (self-approved, logged in CRM) | Immediate |\n| 10.1–20% | Sales Manager | 1 business day |\n| 20.1–30% | VP Sales | 2 business days |\n| Above 30% | CFO + VP Sales | 5 business days; deal desk review required |\n\nFor Enterprise deals, the tier floor in `enterprise_pricing.md` corresponds roughly to the 10% Sales Manager threshold.","outdated":false},{"doc":"NEXA-009","heading":"3. Implementation Fee Discounts","text":"- Quick Start (Professional, $5,000): up to 50% off with Sales Manager approval.\n- Enterprise Standard Implementation ($15,000): up to 25% off with Sales Manager approval.\n- Enterprise Complex Implementation ($35,000): **not discountable**.\n- Implementation fees may never be fully waived for Enterprise.","outdated":false},{"doc":"NEXA-009","heading":"4. Special Programs","text":"| Program | Discount | Eligibility |\n|---|---|---|\n| Nonprofit | 15% | Registered nonprofit; Starter and Professional only |\n| Education | 15% | Accredited schools and universities |\n| Startup | 25% for year 1 | Under 50 employees, less than $10M funding, Starter or Professional |\n| Competitive displacement | Up to 15% for year 1 | Replacing a named competitor contract; VP Sales approval |\n| Case study partner | Up to 5% | Customer agrees to a public case study within 6 months of go-live |\n\nSpecial program discounts count toward the discretionary matrix, so a nonprofit receiving 15% plus another 10% totals 25% and needs VP Sales approval.","outdated":false},{"doc":"NEXA-009","heading":"5. End-of-Quarter Discounts","text":"End-of-quarter discounts are allowed only in exchange for a clear commitment (signature by a set date, larger user count or longer term). Offering unconditional \"quarter-end\" discounts trains customers to wait and is not permitted.","outdated":false},{"doc":"NEXA-009","heading":"6. Renewal Rules","text":"- Discretionary discounts apply to the initial term only unless the contract states otherwise.\n- At renewal, pricing moves back toward list, subject to the renewal cap (7% default for Enterprise).\n- Customers on legacy Pricing Guide v2 prices move to v3 pricing at renewal with the renewal cap applied. See `pricing_faq.md` for historical prices.","outdated":false},{"doc":"NEXA-009","heading":"7. Prohibited Practices","text":"- Side letters or verbal discount promises not in the order form.\n- Free months added to the end of a contract without approval (treated as a discount).\n- Discounting overage rates below Enterprise committed-block pricing.\n- Splitting one customer into multiple small contracts to avoid approval thresholds.\n- Sharing internal floors or this policy with customers.","outdated":false},{"doc":"NEXA-009","heading":"8. How to Request Approval","text":"1. Create a discount request in the CRM opportunity.\n2. Include deal size, term, competitor involved, and what the customer gives in return.\n3. Attach the ROI summary.\n4. Approvals expire after 30 days if the deal has not closed.","outdated":false},{"doc":"NEXA-009","heading":"Worked Example","text":"A Professional customer with 120 users wants a 2-year contract and 15% extra discount.\n- Annual list: $59 → 2-year standard discount 5% → $56.05.\n- 15% discretionary → $47.64 per user/month → requires **Sales Manager** approval (10.1–20% band).","outdated":false},{"doc":"NEXA-011","heading":"Summary","text":"Enterprise plans are custom-quoted starting from the $95 per user per month list price in `pricing_guide_v3.md`. This document explains how Enterprise quotes are built, the volume tiers, the minimum contract, what can and cannot be negotiated, and how to trade concessions for commitments. It is internal guidance for sales and deal desk teams and must not be shared with customers.","outdated":false},{"doc":"NEXA-011","heading":"Key Facts","text":"- Enterprise starts at $95/user/month (annual), minimum 100 users, $114,000 minimum ACV.\n- Volume tiers go down to $75 target for 1,000–2,499 users.\n- Multi-year discounts: 5% for 2 years, 10% for 3 years.\n- Complex implementation ($35,000) is not discountable.\n- The old $85 Enterprise price from Pricing Guide v2 is outdated.","outdated":false},{"doc":"NEXA-011","heading":"How an Enterprise Quote Is Built","text":"An Enterprise quote has four components:\n\n1. **Platform subscription** — users × per-user price × 12 months.\n2. **Usage allowance** — 500,000 workflow runs and 250,000 AI agent actions per month are included; larger committed volumes are priced in blocks.\n3. **Add-ons** — single-tenant deployment, extended audit retention, extra sandboxes.\n4. **One-time implementation** — $15,000 Standard (4–6 weeks) or $35,000 Complex (8–12 weeks).","outdated":false},{"doc":"NEXA-011","heading":"Volume Tiers (Per User / Month, Annual Billing)","text":"| Committed Users | Target Price | Floor Without VP Approval |\n|---|---|---|\n| 100–249 | $95 | $86 |\n| 250–499 | $89 | $80 |\n| 500–999 | $82 | $74 |\n| 1,000–2,499 | $75 | $68 |\n| 2,500+ | Deal desk review | Deal desk review |\n\nThe \"target price\" is what sellers should quote first. The \"floor\" is the lowest price a Sales Manager can approve under `discount_policy.md`; anything below requires VP Sales approval.","outdated":false},{"doc":"NEXA-011","heading":"Minimum Contract","text":"- Minimum 100 users.\n- Minimum annual contract value (ACV): **$114,000** (100 users × $95 × 12).\n- Customers below 100 users should be offered Professional unless they require an Enterprise-only feature (SCIM, custom roles, HIPAA BAA, data residency outside US/EU, single-tenant). In those cases the 100-user minimum still applies.","outdated":false},{"doc":"NEXA-011","heading":"Committed Usage Blocks","text":"| Additional Monthly Runs (committed) | Price per 1,000 Runs |\n|---|---|\n| Up to 500,000 extra | $4.00 (standard overage) |\n| 500,001–2,000,000 extra | $3.20 |\n| Above 2,000,000 extra | $2.50 |\n\nCommitting volume in the contract is cheaper for the customer than paying overage and gives NexaFlow predictable revenue.","outdated":false},{"doc":"NEXA-011","heading":"What Can Be Negotiated","text":"| Lever | Guidance |\n|---|---|\n| Per-user price | Within tier floor; below floor needs VP approval |\n| Multi-year discount | 5% (2-year), 10% (3-year) — standard, no approval needed |\n| Payment terms | Annual in advance is standard; quarterly billing allowed for ACV above $250,000 with a 3% uplift |\n| Implementation fee | Up to 25% off the Standard package with Sales Manager approval; Complex package is not discountable |\n| Ramp pricing | Allowed: e.g., 150 users in year 1 rising to 400 in year 2, priced at year-2 tier |\n| Renewal cap | Default 7%; may be lowered to 5% for 3-year terms |\n| Pilot | Paid 60-day pilot credited against year-1 subscription |","outdated":false},{"doc":"NEXA-011","heading":"What Cannot Be Negotiated","text":"- Free implementation for Enterprise.\n- Uptime SLA above 99.9%.\n- Unlimited workflow runs without a committed volume.\n- Price protection longer than 3 years.\n- Monthly billing on Enterprise.","outdated":false},{"doc":"NEXA-011","heading":"Give-Get Principle","text":"Never give a concession without getting something back. Examples:\n\n- Give 5% extra discount → Get a 3-year term, a published case study, or signature by quarter end.\n- Give reduced implementation fee → Get an executive sponsor and a committed go-live date.\n- Give ramp pricing → Get a higher year-2 user commitment.","outdated":false},{"doc":"NEXA-011","heading":"Historical Note","text":"Enterprise list price was $85 per user/month under Pricing Guide v2 (2025). That figure is **no longer valid** for new quotes. Existing customers on v2 contracts keep their price until renewal, then move to v3 tiers with the renewal cap applied. See `pricing_faq.md`.","outdated":true},{"doc":"NEXA-011","heading":"Deal Desk Checklist","text":"1. Confirm user count, workflow volume and Enterprise-only requirements.\n2. Choose Standard or Complex implementation based on integrations, migration volume and security review (see `implementation_timeline.md`).\n3. Apply volume tier and multi-year discount.\n4. Check any extra discount against `discount_policy.md` approval matrix.\n5. Attach ROI summary and relevant case study before sending the proposal.","outdated":false},{"doc":"NEXA-016","heading":"Summary","text":"NexaFlow is licensed per named user per month, with usage allowances for workflow runs and AI agent actions. Not every person who touches a workflow needs a paid license: lightweight approvers and viewers are handled differently from builders and operators. This document explains license types, how users are counted, true-ups, upgrades and downgrades. Prices themselves are defined in `pricing_guide_v3.md`.","outdated":false},{"doc":"NEXA-016","heading":"Key Facts","text":"- Licensed per named Full User per month, plus usage allowances.\n- Approvers and external participants are free and unlimited.\n- Viewers are free up to 3× the Full User count (Professional and Enterprise).\n- Enterprise has a 100-user minimum and quarterly true-ups.\n- Downgrades happen only at renewal.","outdated":false},{"doc":"NEXA-016","heading":"Licensing Principles","text":"1. **Named users** — a license is assigned to one identified person and cannot be shared.\n2. **Usage allowances** — each plan includes workflow runs and AI agent actions; usage above allowance is billed as overage.\n3. **Per-tenant** — licenses belong to one NexaFlow tenant (organisation).","outdated":false},{"doc":"NEXA-016","heading":"License Types","text":"| License Type | Who | Counts as Paid User? | Plans |\n|---|---|---|---|\n| Full User | Builders, Admins, Operators working exception queues | Yes | All |\n| Viewer | Read-only dashboard access | Free up to 3× the number of Full Users | Professional, Enterprise |\n| Approver | People who only approve/reject tasks via email, Slack or Teams | Free, unlimited | All |\n| External Participant | Suppliers, customers or candidates completing a form in a flow | Free, unlimited | Professional, Enterprise |\n| Service Account / API User | System integrations using the Nexa API | Free (5 on Professional, 25 on Enterprise) | Professional, Enterprise |\n\nExample: a finance department with 20 people building and operating flows, 60 managers who view dashboards and 300 employees who approve expenses in Teams needs **20 Full User licenses** only (60 viewers is within the free 3× allowance of 60).","outdated":false},{"doc":"NEXA-016","heading":"Minimum and Maximum Users","text":"| Plan | Minimum | Maximum |\n|---|---|---|\n| Starter | 5 | 25 |\n| Professional | 10 | 250 |\n| Enterprise | 100 | No maximum |\n\nA Professional customer that grows beyond 250 Full Users must move to Enterprise at renewal, or mid-term if they exceed 275 users.","outdated":false},{"doc":"NEXA-016","heading":"Adding and Removing Users","text":"- **Adding users:** allowed any time. New licenses are prorated to the contract renewal date.\n- **Reassigning licenses:** a license can be moved from a departing employee to a new one at no cost. SCIM (Enterprise) does this automatically.\n- **Removing users:** the license count cannot drop below the contracted number during the term. Reductions take effect at renewal.","outdated":false},{"doc":"NEXA-016","heading":"True-Up","text":"Enterprise contracts include a **quarterly true-up**. If the number of active Full Users exceeds the contracted count, the extra users are invoiced at the contracted per-user price, prorated. Professional customers are billed automatically when users are added.","outdated":false},{"doc":"NEXA-016","heading":"Upgrades and Downgrades","text":"| Change | When Allowed | Pricing Effect |\n|---|---|---|\n| Starter → Professional | Any time | Prorated credit for unused Starter term |\n| Professional → Enterprise | Any time | Prorated credit; Enterprise implementation fee applies |\n| Enterprise → Professional | Renewal only | Enterprise-only features are removed |\n| Professional → Starter | Renewal only | Must fit within 25 users and Starter limits |","outdated":false},{"doc":"NEXA-016","heading":"Contract Terms","text":"- Starter and Professional: monthly or annual.\n- Enterprise: 1, 2 or 3 years; annual billing in advance.\n- Auto-renewal applies unless either party gives 60 days' written notice.","outdated":false},{"doc":"NEXA-016","heading":"Sandbox and Non-Production Use","text":"Development and Staging environments do not consume additional licenses. Workflow runs in non-production environments do not count toward allowances, up to 10% of the production allowance.","outdated":false},{"doc":"NEXA-016","heading":"Partner and Agency Use","text":"Consulting partners building flows on behalf of a customer use the customer's licenses or a free Partner Builder seat (maximum 3 per tenant, Enterprise only).","outdated":false},{"doc":"NEXA-016","heading":"Common Licensing Questions","text":"- **Do approvers need a license?** No — approve/reject via email, Slack or Teams is free.\n- **Do AI agents need a license?** No. Agents are limited by the plan's active-agent count and agent-action allowance, not user licenses.\n- **Can we share one login among a team?** No. Shared logins breach the license terms and break audit trails.","outdated":false},{"doc":"NEXA-019","heading":"Summary","text":"This FAQ answers common customer and seller questions about NexaFlow pricing, billing and pl
