 processing** |\n| Applications needing rework due to data errors | 1 in 7 | 1 in 10 | **30% fewer errors** |\n| Processor time per application | 3.5 hours | 1.6 hours | 54% less |\n| KYC audit findings | 4 in prior audit | 0 in next audit | Eliminated |","outdated":false},{"doc":"NEXA-002","heading":"Customer Quote","text":"\"Our regulators care about evidence. NexaFlow gave us speed for borrowers and a complete audit trail for compliance.\" — SVP Lending Operations, FinServe Capital","outdated":false},{"doc":"NEXA-002","heading":"Lessons Learned","text":"- Starting the security review on the day of contract signature saved an estimated three weeks.\n- Keeping humans in the loop for low-confidence extractions satisfied the model risk team.\n- A phased go-live by business line reduced risk in a regulated environment.","outdated":false},{"doc":"NEXA-003","heading":"Summary","text":"HealthPlus Medical Group, a multi-specialty provider with 14 clinics and 6,000 staff, used NexaFlow to automate patient referrals, prior authorization requests and new patient intake. Because of HIPAA requirements, a Business Associate Agreement and integration with its electronic health record system, the project followed the complex implementation track and went live in 11 weeks. HealthPlus now processes referrals 45% faster and cut its referral coordinators' manual work from 22 to about 4 hours per week.","outdated":false},{"doc":"NEXA-003","heading":"Key Facts","text":"- Healthcare provider, 14 clinics, 6,000 staff, Enterprise with HIPAA BAA.\n- 45% faster referral processing (9 days to 5 days).\n- Coordinator manual work cut from 22 to about 4 hours per week.\n- Complex implementation: 11 weeks due to HIPAA, BAA and EHR integration.\n- 59% fewer patient status calls.","outdated":false},{"doc":"NEXA-003","heading":"Customer Profile","text":"| Attribute | Detail |\n|---|---|\n| Industry | Healthcare (multi-specialty medical group) |\n| Locations | 14 clinics and 1 ambulatory surgery center |\n| Employees | 6,000 |\n| Plan | Enterprise, 260 Full Users, HIPAA BAA, US region |\n| Systems | Epic EHR (via NexaFlow Relay and HL7/FHIR APIs), Microsoft 365, ServiceNow, fax-to-email gateway, payer portals |\n| Go-live | March 2026 |","outdated":false},{"doc":"NEXA-003","heading":"The Problem","text":"Referrals from outside physicians arrived by fax, e-referral portals and phone. Coordinators re-typed patient demographics and clinical notes into the EHR, checked insurance eligibility manually, and submitted prior authorization requests through several payer portals.\n\n- Average time from referral received to appointment scheduled: **9 days**.\n- Referral coordinators spent about **22 hours per week** collectively on re-keying and status chasing.\n- About 18% of prior authorization requests were initially denied for missing documentation.\n- Patients called repeatedly to ask about referral status, overloading clinic front desks.","outdated":false},{"doc":"NEXA-003","heading":"The Implementation","text":"HealthPlus followed NexaFlow's nine-phase onboarding process on the **complex track (11 weeks)**. Complexity drivers were the HIPAA BAA negotiation, a detailed security and privacy review, EHR integration through NexaFlow Relay, and training for staff across 14 clinics.\n\n| Weeks | Activity |\n|---|---|\n| 1–2 | Discovery with referral management, revenue cycle, privacy office and IT |\n| 1–4 | Security and privacy review; BAA signed in week 4 |\n| 2–3 | Solution design, including PHI redaction rules for AI agents |\n| 3–5 | Environment setup, SSO + SCIM, Relay installation in hospital data center |\n| 5–7 | Integrations: Epic (FHIR), fax gateway, Microsoft 365, ServiceNow, payer portals |\n| 6–8 | Migration of 180,000 open and recent referral records (after BAA) |\n| 8–10 | Testing, including privacy testing and clinical workflow validation |\n| 9–11 | Training in waves by clinic; go-live clinic by clinic over two weeks |\n| +30 days | Hypercare |","outdated":false},{"doc":"NEXA-003","heading":"The Solution","text":"**Key workflows automated:**\n\n1. **Referral intake** — an AI extraction agent reads faxed and portal referrals, extracts demographics, diagnosis codes and referring provider, and creates a referral in the EHR for coordinator review.\n2. **Insurance eligibility check** — the workflow verifies coverage automatically and flags issues before scheduling.\n3. **Prior authorization packets** — an agent assembles required clinical documentation per payer rules and highlights missing items before submission.\n4. **Patient status notifications** — patients receive SMS and email updates when a referral is received, approved and scheduled.\n5. **Referral leakage dashboard** — Command Center shows referrals not scheduled within 5 days.","outdated":false},{"doc":"NEXA-003","heading":"Measurable Results","text":"| Metric | Before | After | Change |\n|---|---|---|---|\n| Referral-to-scheduled time | 9 days | 5 days | **45% faster referral processing** |\n| Coordinator manual work | ~22 hours/week | ~4 hours/week | **18 hours saved (net) per week** |\n| Initial prior auth denials for missing documents | 18% | 11% | 39% reduction |\n| Patient status calls to front desks | ~1,100/month | ~450/month | 59% fewer calls |","outdated":false},{"doc":"NEXA-003","heading":"Customer Quote","text":"\"Our coordinators now spend their time with patients and physicians instead of fax machines — and our privacy office was involved from day one.\" — VP Patient Access, HealthPlus Medical Group","outdated":false},{"doc":"NEXA-003","heading":"Lessons Learned","text":"- Engaging the privacy office before kickoff avoided rework on AI agent PHI rules.\n- Migrating PHI only after the BAA was signed kept the project compliant but added two weeks, which was planned for.\n- Clinic-by-clinic go-live let early clinics coach later ones.","outdated":false},{"doc":"NEXA-004","heading":"Summary","text":"ManufacturingCo Industries, an automotive components manufacturer with four plants and 2,800 employees, used NexaFlow to automate purchase requests, supplier onboarding, quality incident handling and invoice matching on top of SAP S/4HANA and Coupa. The implementation took 6 weeks on the standard Enterprise track. ManufacturingCo achieved a 40% reduction in manual work across procurement and quality teams and onboards suppliers 28% faster.","outdated":false},{"doc":"NEXA-004","heading":"Key Facts","text":"- Automotive components manufacturer, 4 plants, 2,800 employees, Enterprise plan.\n- 40% reduction in manual work across procurement and quality.\n- 28% faster supplier onboarding (25 to 18 business days).\n- Implementation took 6 weeks on the standard track, integrating SAP S/4HANA and Coupa.\n- Purchase request to PO cut from 3 days to 6 hours.","outdated":false},{"doc":"NEXA-004","heading":"Customer Profile","text":"| Attribute | Detail |\n|---|---|\n| Industry | Manufacturing (automotive components: brake assemblies and precision castings) |\n| Locations | 4 plants in the US and Mexico |\n| Employees | 2,800 |\n| Plan | Enterprise, 300 Full Users, US region |\n| Systems | SAP S/4HANA, Coupa, Microsoft Teams, SharePoint, a quality management system via REST API |\n| Go-live | April 2026 |","outdated":false},{"doc":"NEXA-004","heading":"The Problem","text":"ManufacturingCo's procurement and quality processes relied on email, spreadsheets and manual SAP entry.\n\n- **Purchase requests** from plant engineers were emailed as spreadsheets and keyed into SAP by buyers, taking an average of 3 days to become purchase orders.\n- **Supplier onboarding** required collecting certificates (ISO 9001, IATF 16949), tax forms and bank details by email, taking about 25 business days.\n- **Quality incidents** (non-conforming parts) were logged on paper at the line and later typed into the quality system, delaying supplier corrective action requests.\n- **Invoice matching** exceptions between SAP goods receipts and supplier invoices were resolved manually by accounts payable.\n- Procurement and quality teams estimated that roughly **half their week** went to administrative tasks.","outdated":false},{"doc":"NEXA-004","heading":"The Implementation","text":"ManufacturingCo followed NexaFlow's standard nine-phase onboarding process and went live in **6 weeks**, at the upper end of the standard 4–6 week timeline.\n\n| Week | Activity |\n|---|---|\n| 1 | Discovery at two plants and headquarters procurement |\n| 1–2 | Solution design for four workflows; workspace per plant |\n| 2 | Environment setup, Microsoft Entra ID SSO and SCIM |\n| 2–3 | SAP S/4HANA (premium connector), Coupa, Teams, SharePoint, quality system REST API |\n| 3–4 | Migration of 6,500 supplier records and 90,000 open purchase and receipt lines |\n| 4–5 | SIT and UAT with buyers, quality engineers and AP clerks |\n| 5 | Training for 300 users; plant floor supervisors used the approver video |\n| 6 | Go-live across all four plants |\n\nIt remained a standard project because all five integrations used pre-built or REST connectors, migration stayed under 1 million records, and no on-premise systems were involved.","outdated":false},{"doc":"NEXA-004","heading":"The Solution","text":"**Key workflows automated:**\n\n1. **Purchase request to PO** — engineers submit requests via a Teams form; NexaFlow checks budget and preferred suppliers in SAP, routes approvals by value, and creates the purchase order automatically.\n2. **Supplier onboarding** — suppliers upload certificates and tax documents through a portal; an AI agent checks certificate expiry dates and completeness, then creates the vendor in SAP after approval.\n3. **Quality incident handling** — line supervisors log non-conforming parts on a tablet with photos; NexaFlow creates the incident, notifies quality engineers and issues a supplier corrective action request.\n4. **Three-way invoice matching** — invoices from Coupa are matched to SAP POs and goods receipts; only true exceptions go to AP.\n5. **Plant operations dashboard** — Command Center shows PO cycle time, open incidents and supplier onboarding status by plant.","outdated":false},{"doc":"NEXA-004","heading":"Measurable Results","text":"| Metric | Before | After | Change |\n|---|---|---|---|\n| Manual administrative work (procurement and quality) | Baseline | 40% lower | **40% reduction in manual work** |\n| Supplier onboarding time | 25 business days | 18 business days | **28% faster supplier onboarding** |\n| Purchase request to PO | 3 days | 6 hours | 92% faster |\n| Invoice exceptions handled manually | 22% of invoices | 8% of invoices | 64% fewer |\n| Time to raise supplier corrective action | 5 days | 1 day | 80% faster |","outdated":false},{"doc":"NEXA-004","heading":"Customer Quote","text":"\"Our buyers and quality engineers are back to managing suppliers and quality, not typing. A 40% cut in manual work across four plants is real capacity.\" — VP Supply Chain, ManufacturingCo Industries","outdated":false},{"doc":"NEXA-004","heading":"Lessons Learned","text":"- One workspace per plant, with shared templates from headquarters, balanced local flexibility with standards.\n- The SAP premium connector avoided any custom integration work.\n- Including floor supervisors in UAT made the tablet incident form practical on the line.","outdated":false},{"doc":"NEXA-005","heading":"Summary","text":"RetailMax, an apparel and home goods retailer with 220 stores and a growing online channel, used NexaFlow to automate order exception handling, returns and refunds, and store maintenance requests. The project was scoped tightly and went live in 4 weeks, the fastest end of the standard 4–6 week enterprise timeline. RetailMax reduced order and refund errors by 30% and saves 18 hours per week in customer service operations.","outdated":false},{"doc":"NEXA-005","heading":"Key Facts","text":"- Omnichannel retailer, 220 stores, Enterprise plan with 180 Full Users.\n- 30% fewer order and refund errors.\n- 18 hours saved per week in customer service operations.\n- Went live in 4 weeks — the fast end of the standard 4–6 week timeline.\n- Refund processing 64% faster.","outdated":false},{"doc":"NEXA-005","heading":"Customer Profile","text":"| Attribute | Detail |\n|---|---|\n| Industry | Retail (apparel and home goods, omnichannel) |\n| Locations | 220 stores in the US and Canada, plus e-commerce |\n| Employees | 9,000 (including store staff) |\n| Plan | Enterprise, 180 Full Users; store managers use free Approver access |\n| Systems | Shopify Plus, Oracle NetSuite, Zendesk, Slack, Google Workspace |\n| Go-live | September 2025, before peak holiday season |","outdated":false},{"doc":"NEXA-005","heading":"The Problem","text":"RetailMax's online sales had grown 60% in two years, but back-office processes had not kept up.\n\n- Order exceptions (address problems, payment holds, out-of-stock items) were handled from a shared Zendesk view with no prioritisation.\n- Refunds for returns required agents to check Shopify, NetSuite and the warehouse system manually; about **1 in 20 refunds** had an error (wrong amount, duplicate refund or missed restocking).\n- Store maintenance requests were emailed to regional managers and often lost.\n- The customer service operations team spent around **18 hours per week** on manual reconciliation.\n- Leadership wanted the solution live **before the holiday peak**, giving the team 5 weeks.","outdated":false},{"doc":"NEXA-005","heading":"The Implementation","text":"RetailMax followed NexaFlow's standard nine-phase onboarding process and went live in **4 weeks**.\n\n| Week | Activity |\n|---|---|\n| 1 | Discovery and solution design (combined, 3 workflows in scope) |\n| 1–2 | Environment setup with Google Workspace SSO and SCIM |\n| 2 | Shopify Plus, NetSuite, Zendesk and Slack connectors configured |\n| 2–3 | Migration of 35,000 open orders and return authorisations |\n| 3 | UAT with customer service leads and 5 pilot stores |\n| 4 | Operator training, 10-minute approver video for store managers, go-live |\n\nFactors that kept it fast: four systems with pre-built connectors, a small migration, a standard security questionnaire completed in one week, and a full-time project lead on the RetailMax side.","outdated":false},{"doc":"NEXA-005","heading":"The Solution","text":"**Key workflows automated:**\n\n1. **Order exception triage** — an AI agent classifies each exception, fixes simple address issues automatically and routes the rest to the right queue by priority and order value.\n2. **Returns and refund processing** — when a return is received, NexaFlow verifies the item, calculates the refund, issues it in Shopify, updates NetSuite and triggers restocking.\n3. **Duplicate refund prevention** — a rule checks for existing refunds before processing.\n4. **Store maintenance requests** — store managers submit requests via a form; approvals happen in Slack; vendors are dispatched automatically.\n5. **Peak season dashboard** — Command Center tracks exception backlog and refund SLA in real time.","outdated":false},{"doc":"NEXA-005","heading":"Measurable Results","text":"| Metric | Before | After | Change |\n|---|---|---|---|\n| Refund and order processing errors | 1 in 20 | 1 in 29 | **30% fewer errors** |\n| Manual reconciliation effort | ~18 hours/week | Minimal | **18 hours saved per week** |\n| Average refund processing time | 4.2 days | 1.5 days | 64% faster |\n| Holiday peak exception backlog | 2,400 (prior year) | 600 | 75% lower |","outdated":false},{"doc":"NEXA-005","heading":"Customer Quote","text":"\"We had five weeks before peak season. NexaFlow was live in four, and it was the calmest holiday our service team has had.\" — Director of Customer Operations, RetailMax","outdated":false},{"doc":"NEXA-005","heading":"Lessons Learned","text":"- A hard deadline plus a narrow scope (three workflows) made a 4-week go-live realistic.\n- Giving store managers free Approver access in Slack avoided buying <script>/* NexaFlow KB search engine — search-only (no API key, runs fully in the browser or Node).
   Index-first: 1) route the question with knowledge_base/index.md routes, 2) rank documents on their
   YAML/index metadata, 3) rank sections inside the best documents, 4) compose an extractive answer. */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.KBEngine = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const STOP = new Set(("a an the and or but if of to in on at by for with from into about as is are was were be been being " +
    "do does did doing have has had having i me my we our us you your they them their it its this that these those " +
    "what which who whom whose when where why how can could should would will shall may might must " +
    "there here than then so such not no yes any all some each per also just very too more most only " +
    "using use knowledge base index md answer cite file files used please tell give show want need know " +
    "say says said right wrong correct true").split(/\s+/));
  // "too" is a stopword, but "expensive" carries the meaning.

  const SYN = {
    cost: ["price", "pricing"], costs: ["price", "pricing"], price: ["cost", "pricing"], pricing: ["price", "cost"],
    expensive: ["price", "objection", "budget", "cost"], cheap: ["price", "cost"],
    onboarding: ["implementation", "onboard", "phase"], implementation: ["onboarding"],
    timeline: ["weeks", "duration", "long"], long: ["timeline", "weeks"], typical: ["standard"],
    sso: ["saml", "oidc", "sign"], rbac: ["role", "roles", "permission"], role: ["rbac", "roles"], roles: ["rbac", "role"],
    audit: ["logs", "log"], logs: ["audit"],
    manufacturing: ["manufacturer", "plant", "factory", "manufacturingco"], manufacturer: ["manufacturing"],
    manual: ["work"], reduce: ["reduction"], respond: ["objection", "response"], prospect: ["objection", "seller"],
    annual: ["annually", "yearly", "billing", "year"], discount: ["discounts"], discounts: ["discount"],
    support: ["supports", "available"], helped: ["case", "study"], customer: ["customers"],
    "85": ["v2", "outdated", "historical", "legacy"], legacy: ["v2", "historical"], old: ["v2", "historical", "legacy"],
  };

  function stem(w) {
    if (w.length <= 4 || /^\d/.test(w)) return w;
    if (w.endsWith("ies")) return w.slice(0, -3) + "y";
    if (w.endsWith("ing") && w.length > 6) return w.slice(0, -3);
    if (w.endsWith("ed") && w.length > 5) return w.slice(0, -2);
    if (w.endsWith("es") && /(ch|sh|x|ss)es$/.test(w)) return w.slice(0, -2);
    if (w.endsWith("s") && !w.endsWith("ss") && !w.endsWith("us")) return w.slice(0, -1);
    return w;
  }
  function words(text) {
    return (String(text).toLowerCase().replace(/\$(\d)/g, "$1").match(/[a-z0-9]+/g) || []).filter(w => !STOP.has(w));
  }
  // any dollar amount also counts as the word "price", so "cost/price" questions match "$95"
  const tokens = text => { const t = words(text).map(stem); if (/\$\d/.test(text)) t.push("price"); return t; };

  function queryTerms(q) {
    const base = words(q);
    const terms = new Map();
    for (const w of base) terms.set(stem(w), Math.max(terms.get(stem(w)) || 0, 1));
    for (const w of base) for (const s of (SYN[w] || [])) for (const t of tokens(s)) if (!terms.has(t)) terms.set(t, 0.5);
    return terms; // term -> weight
  }

  function BM25(docsTokens, k1 = 1.4, b = 0.75) {
    const N = docsTokens.length, df = new Map(), tf = [], len = [];
    let total = 0;
    docsTokens.forEach(toks => {
      const m = new Map(); toks.forEach(t => m.set(t, (m.get(t) || 0) + 1)); tf.push(m); len.push(toks.length); total += toks.length;
      for (const t of m.keys()) df.set(t, (df.get(t) || 0) + 1);
    });
    const avg = total / Math.max(N, 1);
    const idf = t => { const n = df.get(t) || 0; return Math.log(1 + (N - n + 0.5) / (n + 0.5)); };
    return {
      idf,
      score(i, terms) {
        let s = 0; const m = tf[i];
        for (const [t, w] of terms) { const f = m.get(t); if (!f) continue; s += w * idf(t) * (f * (k1 + 1)) / (f + k1 * (1 - b + b * len[i] / avg)); }
        return s;
      },
      has(i, t) { return tf[i].has(t); },
    };
  }

  function create(kb) {
    const docs = kb.documents, chunks = kb.chunks;
    const byId = new Map(docs.map(d => [d.document_id, d]));
    const byFile = new Map(docs.map(d => [d.filename, d]));
    const rep = (s, n) => Array(n).fill(s).join(" ");
    const docText = d => [rep(d.title, 3), d.main_category, rep(d.rag_tags.join(" "), 2), rep(d.use_when, 2),
      d.secondary_topics.join(" "), d.key_topics.join(" "), d.summary, d.retrieval_notes].join(" ");
    const docIndex = BM25(docs.map(d => tokens(docText(d))));
    const chunkIndex = BM25(chunks.map(c => tokens(rep(c.heading, 2) + " " + byId.get(c.doc).title + " " + c.text)));
    const routeIndex = BM25(kb.routes.map(r => tokens(r.question + " " + r.category + " " + ((byFile.get(r.primary) || {}).title || ""))));

    function triggered(list, ql) {
      const priceCtx = /(cost|price|pricing|user|month|\$|enterprise|list)/.test(ql);
      return list.some(t => /^\$?\d[\d,]*$/.test(t) ? (new RegExp("(^|[^\\d.])\\$?" + t.replace("$", "") + "(?![\\d%])").test(ql) && priceCtx) : ql.includes(t));
    }

    function lineCandidates(text) {
      const out = [];
      let header = null;
      for (let line of text.split("\n")) {
        line = line.trim();
        if (/^\|?\s*:?-{3,}/.test(line)) continue;          // table separator row
        if (!line.startsWith("|")) header = null;
        if (!line || /^#/.test(line)) continue;
        if (line.startsWith("|")) {
          const cells = line.split("|").map(c => c.trim()).filter(Boolean);
          if (!header) { header = cells; continue; }          // first row of a table = header, not an answer line
          if (cells.length >= 2) out.push({ text: cells[0] + " — " + cells.slice(1).map((c, i) => (header[i + 1] ? header[i + 1] + ": " : "") + c).join(" · "), rowKey: cells[0] });
          continue;
        }
        line = line.replace(/^[-*]\s+(\[[ x]\]\s+)?/, "").replace(/^\d+\.\s+/, "").replace(/^>\s*/, "");
        const parts = line.length > 260 ? line.split(/(?<=[.!?])\s+(?=[A-Z*])/) : [line];
        parts.forEach(p => { if (p.length > 25) out.push({ text: p }); });
      }
      return out;
    }

    function ask(question) {
      const ql = " " + question.toLowerCase() + " ";
      const terms = queryTerms(question);
      const coreTerms = [...terms].filter(([, w]) => w === 1).map(([t]) => t);
      const result = { question, terms: coreTerms, found: false };
      if (!coreTerms.length) return result;

      // 1) Route with index.md
      let route = null, rBest = 0;
      kb.routes.forEach((r, i) => { const s = routeIndex.score(i, terms); if (s > rBest) { rBest = s; route = r; } });
      if (rBest < 2.5) route = null;

      // 2) Rank documents on index metadata
      const dScores = docs.map((d, i) => docIndex.score(i, terms));
      const dMax = Math.max(...dScores, 1e-9);

      // 3) Rank sections
      const outdatedAsked = kb.outdated_rules.filter(r => triggered(r.triggers, ql));
      const cScores = chunks.map((c, i) => {
        let s = chunkIndex.score(i, terms);
        if (c.outdated) s *= outdatedAsked.length ? 1.3 : 0.35;
        return s;
      });
      const best = new Map();
      chunks.forEach((c, i) => { if (!best.has(c.doc) || cScores[i] > cScores[best.get(c.doc)]) best.set(c.doc, i); });
      const cMax = Math.max(...cScores, 1e-9);

      const ranked = docs.map((d, i) => {
        let s = 0.5 * dScores[i] / dMax + 0.5 * (cScores[best.get(d.document_id)] || 0) / cMax;
        if (d.authoritative === "Yes") s *= 1.1; else s *= 0.9;
        if (route && d.filename === route.primary) s *= 1.45;
        else if (route && d.main_category === route.category) s *= 1.1;
        return { doc: d, score: s };
      }).sort((a, b) => b.score - a.score);

      const top = ranked[0];
      // coverage: share of core query terms that appear in the best document's text
      const coveredIn = d => coreTerms.filter(t => chunks.some((c, i) => c.doc === d.document_id && chunkIndex.has(i, t)) || docIndex.has(docs.indexOf(d), t));
      const coverage = coveredIn(top.doc).length / coreTerms.length;
      result.route = route;
      result.coverage = coverage;
      if (top.score < 0.3 || coverage < 0.5) {
        result.suggestions = ranked.slice(0, 3).map(r => r.doc);
        return result;
      }
      const selected = ranked.filter(r => r.score >= 0.45 * top.score).slice(0, 3);
      const selIds = new Set(selected.map(r => r.doc.document_id));

      // evidence sections: best chunks from selected docs
      const evidence = chunks.map((c, i) => ({ c, s: cScores[i] }))
        .filter(x => selIds.has(x.c.doc) && x.s > 0 && x.c.heading !== "Key Facts" && x.c.heading !== "Summary")
        .sort((a, b) => b.s - a.s).slice(0, 4);

      // 4) Extractive answer lines
      const cands = [];
      selected.forEach((r, rank) => {
        const w = 1 - rank * 0.12;
        r.doc.key_topics.forEach(k => cands.push({ text: k, doc: r.doc, w: w * 1.5 }));
        evidence.filter(e => e.c.doc === r.doc.document_id).forEach((e, j) =>
          lineCandidates(e.c.text).forEach(l => cands.push({ text: l.text, rowKey: l.rowKey, doc: r.doc, outdated: e.c.outdated,
            // a table row counts fully only if its own first cell matches the question (header words are shared by every row)
            w: w * (j === 0 ? 1.1 : 0.95) * (l.rowKey ? (tokens(l.rowKey).some(t => coreTerms.includes(t)) ? 0.85 : 0.4) : 1) })));
      });
      // if the question names a plan, drop table rows about the other plans
      const PLANS = ["starter", "professional", "enterprise"];
      const askedPlans = PLANS.filter(p => coreTerms.includes(p));
      const offPlan = c => askedPlans.length && c.rowKey && PLANS.includes(c.rowKey.toLowerCase()) && !askedPlans.includes(c.rowKey.toLowerCase());
      const scored = cands.filter(c => !offPlan(c)).map(c => {
        const ct = new Set(tokens(c.text)); let s = 0;
        for (const [t, w] of terms) if (ct.has(t)) s += w * chunkIndex.idf(t);
        return { ...c, s: s * c.w / Math.pow(Math.max(ct.size, 4), 0.25), toks: ct };
      }).filter(c => c.s > 0 && (!c.outdated || outdatedAsked.length)).sort((a, b) => b.s - a.s);
      const picked = [];
      for (const c of scored) {
        if (picked.length >= 6) break;
        const dup = picked.some(p => { let inter = 0; c.toks.forEach(t => { if (p.toks.has(t)) inter++; }); return inter / Math.min(c.toks.size, p.toks.size) > 0.6; });
        if (!dup) picked.push(c);
      }
      // make sure every selected document contributes at least one line
      selected.forEach(r => {
        if (!picked.some(p => p.doc === r.doc)) { const c = scored.find(x => x.doc === r.doc); if (c) picked.push(c); }
      });

      const selFiles = new Set(selected.map(r => r.doc.filename));
      result.found = true;
      result.lines = picked.map(p => ({ text: p.text, doc: p.doc.document_id, outdated: !!p.outdated }));
      result.sources = selected.map(r => r.doc);
      result.evidence = evidence.map(e => ({ doc: e.c.doc, heading: e.c.heading, text: e.c.text, outdated: e.c.outdated }));
      result.verdicts = outdatedAsked.map(r => ({ id: r.id, text: r.verdict, files: r.files }));
      result.cautions = kb.conflicts.filter(c => triggered(c.triggers, ql) && c.files.some(f => selFiles.has(f)));
      result.uncovered = coreTerms.filter(t => !selected.some(r => coveredIn(r.doc).includes(t)));
      result.confidence = Math.min(1, coverage * (top.score > 0.8 ? 1 : 0.85));
      return result;
    }

    return { ask, byId, byFile, docs };
  }

  return { create, tokens, queryTerms };
});

const inline = s => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
const CAT_IC = {"Product & Security":["🛡️","#E7F3FF"],"Pricing & Licensing":["💲","#E6F4EA"],"Implementation":["🛠️","#FFF4E5"],"Sales Enablement":["📣","#F3E8FD"],"Case Studies":["🏆","#FDECEC"]};
const GRAD = ["linear-gradient(160deg,#1877F2,#0A4FB3)","linear-gradient(160deg,#00A400,#04752F)","linear-gradient(160deg,#F7B928,#E07C00)","linear-gradient(160deg,#9360F7,#5B2BC4)","linear-gradient(160deg,#F3425F,#B5163A)","linear-gradient(160deg,#2ABBA7,#0F7F73)"];
const NCOL = ["#1877F2","#00A400","#E07C00","#7A4BE0","#E41E3F","#0F9D8A"];

/* ---------- tiny markdown renderer (tables, lists, quotes, headings) ---------- */
function md(src, target){
  const lines = src.split("\n"); let h = "", i = 0;
  const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g,"-");
  while (i < lines.length){
    let l = lines[i];
    if (/^\s*$/.test(l)){ i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))){
      const n = m[1].length, t = m[2];
      h += `<h${n} id="h-${slug(t)}" class="${target && t.trim()===target.trim()?"target":""}">${inline(t)}</h${n}>`; i++; continue;
    }
    if (/^\s*---\s*$/.test(l)){ h += "<hr>"; i++; continue; }
    if (l.startsWith("|")){
      const rows = []; while (i < lines.length && lines[i].startsWith("|")){ rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const body = rows.filter(r=>!/^\|\s*:?-{3,}/.test(r));
      h += "<table><thead><tr>" + cells(body[0]).map(c=>`<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
        body.slice(1).map(r=>"<tr>"+cells(r).map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>").join("") + "</tbody></table>";
      continue;
    }
    if (/^>\s?/.test(l)){ let q=[]; while(i<lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,"")); i++; } h += `<blockquote>${inline(q.join(" "))}</blockquote>`; continue; }
    if (/^\s*[-*]\s+/.test(l)){ let it=[]; while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ it.push(lines[i].replace(/^\s*[-*]\s+/,"").replace(/^\[ \]\s*/,"☐ ").replace(/^\[x\]\s*/i,"☑ ")); i++; } h += "<ul>"+it.map(x=>`<li>${inline(x)}</li>`).join("")+"</ul>"; continue; }
    if (/^\s*\d+\.\s+/.test(l)){ let it=[]; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ it.push(lines[i].replace(/^\s*\d+\.\s+/,"")); i++; } h += "<ol>"+it.map(x=>`<li>${inline(x)}</li>`).join("")+"</ol>"; continue; }
    let p=[]; while(i<lines.length && lines[i].trim() && !/^(#{1,4}\s|\||>|\s*[-*]\s|\s*\d+\.\s|\s*---\s*$)/.test(lines[i])){ p.push(lines[i]); i++; }
    if (!p.length){ p.push(lines[i]); i++; }
    h += `<p>${inline(p.join(" "))}</p>`;
  }
  return h;
}

const badges = d => `<span class="badge ${d.authoritative==="Yes"?"b-ok":"b-no"}">${d.authoritative==="Yes"?"✓ Authoritative":"Not authoritative"}</span>` +
  `<span class="badge b-no">${esc(d.status)} · v${esc(d.version)}</span>` + (d.contains_outdated_information==="Yes"?`<span class="badge b-old">Contains outdated section</span>`:"");
const cite = id => { const d = E.byId.get(id); return `<button class="cite" data-doc="${id}" title="${esc(d.title)} — ${esc(d.file)}">${id.replace("NEXA-","N-")}</button>`; };
const BOT = `<div class="av" style="background:var(--blue)"><span style="font:700 18px Helvetica,Arial">N</span></div>`;
const postHead = (when) => `<div class="ph">${BOT}<div><div class="who">NexaFlow KB Assistant</div><div class="when">${when}</div></div><button class="more" title="More">···</button></div>`;
const actions = `<div class="acts"><button class="act" data-act="up">👍 Helpful</button><button class="act" data-act="down">👎 Not helpful</button><button class="act" data-act="copy">📋 Copy answer</button></div>`;

/* ---------- left & right columns ---------- */
function renderSides(){
  let l = `<button class="nav" data-view="home"><span class="av" style="background:#42B72A;width:36px;height:36px">You</span>NexaFlow Team</button>
    <button class="nav" data-view="home"><span class="ic" style="background:#E7F3FF">🏠</span>Home feed</button>
    <button class="nav" data-view="index"><span class="ic" style="background:#E7F3FF">🗂️</span><span>Knowledge base index<small>Routing &amp; source of truth</small></span></button>
    <button class="nav" data-view="conflicts"><span class="ic" style="background:#FFF4E5">⚠️</span><span>Known conflicts<small>${KB.conflicts.length} flagged · 1 resolved</small></span></button>
    <hr class="s"><div class="sect">Categories</div>`;
  KB.categories.forEach(c => { const [ic,bg]=CAT_IC[c.name]||["📄","#eee"]; l += `<button class="nav" data-cat="${esc(c.name)}"><span class="ic" style="background:${bg}">${ic}</span><span>${esc(c.name)}<small>${c.docs.length} documents</small></span></button>`; });
  l += `<hr class="s"><div class="foot">Search-only prototype · answers are quoted from 25 validated documents · no AI, no API key.<br>${esc(KB.validation.replace(/\*\*/g,""))}</div>`;
  $("#left").innerHTML = l;

  let r = `<h3>Suggested questions</h3>`;
  KB.sample_questions.forEach((s,i) => r += `<button class="sq" data-q="${esc(s.display)}"><span class="n" style="background:${NCOL[i%6]}">${s.id}</span><span>${esc(s.display)}</span></button>`);
  r += `<hr class="s"><h3>Known conflicts</h3>`;
  KB.conflicts.forEach(c => { const res=/RESOLVED/.test(c.status); r += `<button class="cf" data-view="conflicts"><b style="background:${res?"var(--ok-bg)":"var(--warn-bg)"};color:${res?"var(--ok)":"var(--warn)"}">${c.id}</b>${esc(c.text.replace(/\*\*/g,"").slice(0,78))}…</button>`; });
  r += `<hr class="s"><h3>Knowledge base</h3><div class="foot"><span class="dot"></span>25 documents · ${KB.chunks.length} sections · 5 categories<br>Validated: PASS (0 fails)</div>`;
  $("#right").innerHTML = r;

  $("#stories").innerHTML = KB.sample_questions.map((s,i) =>
    `<button class="story" style="background:${GRAD[i%6]}" data-q="${esc(s.display)}"><span class="qn">${s.id}</span><b>${esc(s.label)}</b><small>Tap to ask</small></button>`).join("");
}

/* ---------- feed posts ---------- */
const feed = () => $("#feed");
function addPost(html, top=true){
  const el = document.createElement("article"); el.className="card post"; el.innerHTML = html;
  if (top) { feed().prepend(el); el.scrollIntoView({behavior:"smooth", block:"start"}); } else feed().append(el);
  return el;
}

function answerPost(question){
  const r = E.ask(question);
  const when = `Just now · 🔍 Search${r.route?` · Routed via index.md → ${esc(r.route.category)}`:""}`;
  let h = postHead(when) + `<div class="qb"><span class="lbl">You asked</span>${esc(question)}</div>`;
  if (!r.found){
    h += `<div class="caution"><b>I couldn't find this in the knowledge base.</b>None of the 25 documents covers enough of this question, so I won't guess.${r.terms&&r.terms.length?` Terms searched: ${r.terms.map(esc).join(", ")}.`:""}</div>`;
    if (r.suggestions && r.suggestions.length){ h += `<div class="src"><h4>Closest documents</h4>` + r.suggestions.map(srcRow).join("") + `</div>`; }
    h += `<div class="stats"><span>Tip: try one of the suggested questions or name a topic (pricing, onboarding, SSO, case study).</span></div>` + actions;
    return wire(addPost(h), r, question);
  }
  r.verdicts.forEach(v => h += `<div class="verdict"><b>⚠ Outdated figure</b>${inline(v.text)} ${v.files.map(f=>cite(E.byFile.get(f).document_id)).join("")}</div>`);
  h += `<div style="font-weight:600;margin-top:6px">From the knowledge base</div><ul class="ans">` +
    r.lines.map(x => `<li>${x.outdated?'<span class="badge b-old">Historical</span>':""}${inline(x.text)}${cite(x.doc)}</li>`).join("") + `</ul>`;
  if (r.uncovered && r.uncovered.length) h += `<div class="gap">Not found in the cited documents: ${r.uncovered.map(esc).join(", ")}</div>`;
  r.cautions.forEach(c => h += `<div class="caution"><b>${/RESOLVED/.test(c.status)?"✅":"⚠"} ${c.id} · ${esc(c.status)}</b>${inline(c.text)} ${c.files.map(f=>cite(E.byFile.get(f).document_id)).join("")}</div>`);
  r.evidence.forEach((e,i) => { const d = E.byId.get(e.doc);
    h += `<details class="evi" ${i===0?"open":""}><summary>${i===0?"📌 Best matching section":"📄 More evidence"}: ${esc(d.title)} › ${esc(e.heading)}${e.outdated?' <span class="badge b-old">Historical</span>':""}<span class="chev">▾</span></summary><div class="md">${md(e.text)}<p><button class="cite" data-doc="${e.doc}" data-sec="${esc(e.heading.split(" › ")[0])}">Open full document ↗</button></p></div></details>`; });
  h += `<div class="src"><h4>📎 Files used (${r.sources.length})</h4>` + r.sources.map(srcRow).join("") + `</div>`;
  h += `<div class="stats"><span class="rx"><i>👍</i><span class="cnt">0</span></span><span>${r.sources.length} sources · ${r.lines.length} facts · coverage ${Math.round(r.coverage*100)}%</span></div>` + actions;
  return wire(addPost(h), r, question);
}
function srcRow(d){ return `<button class="srow" data-doc="${d.document_id}"><span class="fi">📄</span><span><span class="t">${d.document_id} · ${esc(d.title)}</span><br><code>${esc(d.file)}</code><br>${badges(d)}</span></button>`; }

function wire(el, r, question){
  const cnt = el.querySelector(".cnt");
  el.querySelectorAll(".act").forEach(b => b.addEventListener("click", () => {
    const a = b.dataset.act;
    if (a === "copy"){
      const txt = [`Q: ${question}`, ""].concat(r.found ? [...r.verdicts.map(v=>"! "+v.text), ...r.lines.map(x=>`- ${x.text.replace(/\*\*/g,"")} [${x.doc}]`), ...r.cautions.map(c=>`! ${c.id} (${c.status}): ${c.text.replace(/\*\*/g,"")}`), "", "Files used:", ...r.sources.map(d=>`- ${d.file}`)] : ["Not found in the knowledge base."]).join("\n");
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>{ b.textContent="✅ Copied"; setTimeout(()=>b.textContent="📋 Copy answer",1500); }).catch(()=>{ b.textContent="Copy blocked"; });
      return;
    }
    const wasOn = b.classList.contains("on");
    el.querySelectorAll('.act[data-act="up"],.act[data-act="down"]').forEach(x=>x.classList.remove("on","neg"));
    if (!wasOn){ b.classList.add("on"); if (a==="down") b.classList.add("neg"); }
    if (cnt) cnt.textContent = el.querySelector('.act[data-act="up"].on') ? "1" : "0";
  }));
  return el;
}

function welcomePost(){
  const h = postHead("Pinned · 📌") + `<div class="qb">👋 Welcome to the <b>NexaFlow knowledge base</b>. Ask a question in the box above and I'll answer from our 25 validated documents.</div>
  <ul class="ans"><li>Every answer cites its files and opens the source when you click a <span class="cite">N-020</span> tag.</li>
  <li>I follow <code>knowledge_base/index.md</code>: route to a category, prefer authoritative and current documents.</li>
  <li>Outdated prices (Pricing Guide v2) and known conflicts are flagged, never hidden.</li>
  <li>Search mode quotes the documents directly — no AI writes or invents text.</li></ul>
  <div class="stats"><span>Try a suggested question from the cards above ⬆</span><span>25 docs · 5 categories</span></div>`;
  addPost(h, false);
}

function categoryPost(name){
  const c = KB.categories.find(x=>x.name===name); if (!c) return;
  const [ic] = CAT_IC[name]||["📄"];
  let h = postHead(`Category · ${esc(c.folder)}/`) + `<div class="qb">${ic} <b>${esc(name)}</b> — ${c.docs.length} documents</div>`;
  h += c.docs.map(id => { const d=E.byId.get(id); return `<button class="srow" data-doc="${id}"><span class="fi">📄</span><span><span class="t">${id} · ${esc(d.title)}</span><br><span style="font-size:13.5px">${inline(d.summary)}</span><br>${badges(d)}</span></button>`; }).join("");
  addPost(h + `<div style="height:8px"></div>`);
}

function indexPost(){
  let h = postHead("Knowledge base index · knowledge_base/index.md") + `<div class="qb">🗂️ <b>How questions are routed</b></div>`;
  h += `<table class="kv"><tr><th>If the question is about…</th><th>Primary document</th></tr>` +
    KB.routes.map(r => { const d = E.byFile.get(r.primary); return `<tr><td>${esc(r.question)}<br><small style="color:var(--muted)">${esc(r.category)}</small></td><td>${d?cite(d.document_id)+" "+esc(d.title):esc(r.category)+" index"}</td></tr>`; }).join("") + `</table>`;
  h += `<div class="qb" style="margin-top:16px">✅ <b>Source of truth by topic</b></div><table class="kv"><tr><th>Topic</th><th>Authoritative</th><th>Do not use</th></tr>` +
    KB.source_of_truth.map(t => `<tr><td>${esc(t.topic)}</td><td>${esc(t.source)}</td><td>${esc(t.avoid)}</td></tr>`).join("") + `</table><div style="height:10px"></div>`;
  addPost(h);
}

function conflictsPost(){
  let h = postHead("Known conflicts · from inventory_report.md") + `<div class="qb">⚠️ <b>${KB.conflicts.length} known conflicts</b> between documents. Answers touching these topics show a warning.</div>`;
  KB.conflicts.forEach(c => h += `<div class="caution" style="${/RESOLVED/.test(c.status)?"background:var(--ok-bg);color:#14532D":""}"><b>${c.id} · ${esc(c.status)}</b>${inline(c.text)} ${c.files.map(f=>cite(E.byFile.get(f).document_id)).join("")}</div>`);
  addPost(h + `<div style="height:8px"></div>`);
}

/* ---------- document viewer ---------- */
function openDoc(id, sec){
  const d = E.byId.get(id); if (!d) return;
  $("#mbox").innerHTML = `<div class="mhead">${BOT}<div><div style="font-weight:700">${d.document_id} · ${esc(d.title)}</div><div style="font-size:12px;color:var(--muted)"><code>${esc(d.file)}</code></div></div><button class="x" aria-label="Close">✕</button></div>
    <div class="meta"><span>Category <b>${esc(d.main_category)}</b></span><span>Type <b>${esc(d.document_type)}</b></span><span>Version <b>${esc(d.version)}</b></span><span>Updated <b>${esc(d.last_updated)}</b></span><span>${badges(d)}</span>${d.supersedes!=="None"?`<span>Supersedes <b>${esc(d.supersedes)}</b></span>`:""}</div>
    <div class="meta" style="display:block"><b>Use when:</b> ${inline(d.use_when)}</div>
    <div class="mbody md">${md(d.body, sec)}</div>`;
  $("#modal").classList.add("on"); document.body.style.overflow="hidden";
  const t = $("#mbox .target"); if (t) setTimeout(()=>t.scrollIntoView({block:"center"}),30);
}
function closeDoc(){ $("#modal").classList.remove("on"); document.body.style.overflow=""; }

/* ---------- events ---------- */
function ask(q){ q = (q||"").trim(); if (!q) return; answerPost(q); $("#q").value=""; $("#topq").value=""; }
$("#ask").addEventListener("submit", e => { e.preventDefault(); ask($("#q").value); });
$("#topq").addEventListener("keydown", e => { if (e.key==="Enter") ask(e.target.value); });
document.addEventListener("click", e => {
  const t = e.target.closest("[data-doc],[data-q],[data-cat],[data-view],.x");
  if (!t) { if (e.target.id==="modal") closeDoc(); return; }
  if (t.classList.contains("x")) return closeDoc();
  if (t.dataset.doc) return openDoc(t.dataset.doc, t.dataset.sec);
  if (t.dataset.q) return ask(t.dataset.q);
  if (t.dataset.cat) return categoryPost(t.dataset.cat);
  if (t.dataset.view){
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x.dataset.view===t.dataset.view));
    if (t.dataset.view==="index") indexPost(); else if (t.dataset.view==="conflicts") conflictsPost(); else { window.scrollTo({top:0,behavior:"smooth"}); $("#q").focus(); }
  }
});
document.addEventListener("keydown", e => { if (e.key==="Escape") closeDoc(); });

renderSides(); welcomePost();
const pre = new URLSearchParams(location.search).get("q"); if (pre) ask(pre);
})();
</script>
</body>
</html>
