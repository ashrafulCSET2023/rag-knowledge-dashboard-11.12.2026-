 and US/EU/APAC data residency.","No self-hosted on-premise version; on-prem systems connect via Relay.","Enterprise includes named CSM, dedicated implementation team and 30-day hypercare."],"use_when":"Someone asks whether NexaFlow can handle large-scale or complex enterprise requirements such as scale, availability, governance, data residency or dedicated environments.","file":"knowledge_base/01_product_and_security/10_enterprise_capabilities.md","filename":"10_enterprise_capabilities.md","folder":"01_product_and_security","retrieval_notes":"Retrieve for questions about scale, uptime, SLA, single-tenant deployment, data residency, governance across business units, or \"can NexaFlow handle enterprise volume\". For how these capabilities are configured during onboarding, retrieve `enterprise_setup.md`.","body":"# Enterprise Capabilities\n\n## Metadata\n\n- Category: Product\n- Document Type: Capability Brief\n- Version: 2.3\n- Status: Current\n- Last Updated: 2026-07-10\n- Authoritative: Yes\n- Keywords: enterprise, scalability, high availability, uptime SLA, single-tenant, data residency, governance, multi-workspace, center of excellence, sandbox, performance, workflow runs, dedicated support\n- Use When: Someone asks whether NexaFlow can handle large-scale or complex enterprise requirements such as scale, availability, governance, data residency or dedicated environments.\n\n## Summary\n\nThe Enterprise plan adds the scale, governance and deployment options large organisations need. This document describes performance and scalability limits, availability commitments, deployment models, multi-workspace governance, advanced AI controls and the enterprise support model. It describes what the product can do; the steps to configure these capabilities during onboarding are in `enterprise_setup.md`.\n\n## Main Content\n\n### Scalability and Performance\n\nNexaFlow's execution engine scales horizontally, so throughput increases automatically as workload grows.\n\n| Metric | Enterprise Capability |\n|---|---|\n| Included workflow runs | 500,000 per month (more available, see pricing) |\n| Proven peak volume | 10 million runs per month in a single tenant |\n| Concurrent runs | Up to 2,000 simultaneous runs per tenant (raisable) |\n| Median step latency | Under 300 ms for native steps |\n| API rate limit | 3,000 requests/minute, raisable |\n| Users | Tested with 25,000 named users in one tenant |\n\nLarge batch jobs (for example, nightly processing of 200,000 invoices) are queued and processed in parallel with priority controls so interactive workflows are not slowed.\n\n### Availability and Resilience\n\n- **99.9% monthly uptime SLA** with service credits.\n- Multi-availability-zone architecture with automated failover.\n- RPO 1 hour, RTO 4 hours; optional cross-region disaster recovery.\n- Planned maintenance windows are announced 7 days in advance and scheduled outside customer business hours.\n- Public status page and incident notifications by email and webhook.\n\n### Deployment Models\n\n1. **Multi-tenant cloud (default)** — logically isolated tenant, fastest to provision.\n2. **Single-tenant cloud (optional)** — dedicated compute and database for customers with strict isolation requirements. Provisioning adds roughly 1 week to environment setup.\n3. **Data residency** — choose US, EU or APAC. All customer data, backups and logs remain in the selected region.\n\nNexaFlow does not offer a fully self-hosted on-premise version. On-premise systems connect through the NexaFlow Relay agent.\n\n### Governance for Large Organisations\n\n- **Multiple workspaces** — separate spaces for Finance, HR, IT and regions, each with its own builders, connectors and approval rules.\n- **Environment promotion** — Development → Staging → Production, with required approvals before a flow is published to Production.\n- **Center of Excellence (CoE) controls** — central admins can publish approved templates, restrict which connectors each workspace may use and review all production changes.\n- **Custom roles and SCIM** — fine-grained RBAC, automatically provisioned from the identity provider.\n- **Change history** — every flow version, publisher and approver is recorded in the audit log.\n\n### Advanced AI Controls\n\n- Approved model lists and bring-your-own LLM keys.\n- Policy templates for agent confidence thresholds (for example, route to a human below 85% confidence).\n- PII redaction before model calls.\n- Agent evaluation reports showing accuracy, overrides and drift over time.\n\n### Enterprise Support Model\n\n- Named Customer Success Manager (CSM).\n- 24/7 support with 1-hour P1 response target.\n- Dedicated implementation team: engagement manager, solution architect and integration engineer.\n- 30 days of hypercare after go-live, then quarterly business reviews.\n- Role-based training program for admins, builders and operators.\n\n### Typical Enterprise Buyer Requirements Mapped\n\n| Requirement | NexaFlow Answer |\n|---|---|\n| \"We need SSO and automatic deprovisioning\" | SAML/OIDC SSO + SCIM |\n| \"Our data must stay in the EU\" | EU data residency (Frankfurt) |\n| \"We need 7-year audit retention\" | Extendable audit log retention + SIEM streaming |\n| \"We must connect to on-prem SAP ECC\" | NexaFlow Relay |\n| \"We process millions of transactions\" | Proven 10M runs/month per tenant |\n| \"Business units must be separated\" | Multiple workspaces with scoped RBAC |\n\n## Key Facts\n\n- 99.9% uptime SLA; RPO 1 hour, RTO 4 hours.\n- Proven at 10 million runs per month in one tenant.\n- Single-tenant option and US/EU/APAC data residency.\n- No self-hosted on-premise version; on-prem systems connect via Relay.\n- Enterprise includes named CSM, dedicated implementation team and 30-day hypercare.\n\n## Related Documents\n\n- product_overview.md\n- security_overview.md\n- feature_matrix.md\n- enterprise_setup.md\n\n## Retrieval Notes\n\nRetrieve for questions about scale, uptime, SLA, single-tenant deployment, data residency, governance across business units, or \"can NexaFlow handle enterprise volume\". For how these capabilities are configured during onboarding, retrieve `enterprise_setup.md`."},{"document_id":"NEXA-013","title":"Feature Matrix by Plan","document_type":"Feature Comparison Matrix","main_category":"Product & Security","secondary_topics":["Plan selection","Security and identity features by plan","Usage allowances","Support and SLA by plan"],"rag_tags":["feature-comparison","starter","professional","enterprise","plan-features","sso","scim","rbac","audit-logs","api-limits","ai-agents","workflow-runs"],"version":"3.0","status":"Current","last_updated":"2026-07-01","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["21_product_overview.md","24_security_overview.md","20_pricing_guide_v3.md","10_enterprise_capabilities.md"],"summary":"Plan-by-plan comparison of Starter, Professional and Enterprise features covering workflows, AI agents, integrations and API, security and governance, dashboards and support, aligned with Pricing Guide v3.","key_topics":["SSO is available on Professional and Enterprise; SCIM is Enterprise-only.","Audit logs: none on Starter, 90 days on Professional, 1 year (up to 7) on Enterprise.","Enterprise includes 500,000 workflow runs per month and unlimited AI agents.","Uptime SLA: 99.5% Professional, 99.9% Enterprise.","Enterprise implementation is guided and required."],"use_when":"Someone asks which features are included in which plan, or whether a specific capability (SSO, audit logs, API access, custom roles) is available on a plan.","file":"knowledge_base/01_product_and_security/13_feature_matrix.md","filename":"13_feature_matrix.md","folder":"01_product_and_security","retrieval_notes":"Retrieve for \"which plan includes X\", \"does Professional have SSO/audit logs\", \"API rate limits\", \"how many AI agents/workflows per plan\" questions. Pair with `security_overview.md` for how a security feature works, and with `pricing_guide_v3.md` if the question also asks about cost.","body":"# Feature Matrix by Plan\n\n## Metadata\n\n- Category: Product\n- Document Type: Feature Comparison Matrix\n- Version: 3.0\n- Status: Current\n- Last Updated: 2026-07-01\n- Authoritative: Yes\n- Keywords: feature comparison, Starter, Professional, Enterprise, plan features, SSO, SCIM, RBAC, audit logs, API limits, AI agents, workflow runs, SLA\n- Use When: Someone asks which features are included in which plan, or whether a specific capability (SSO, audit logs, API access, custom roles) is available on a plan.\n\n## Summary\n\nThis matrix lists which NexaFlow capabilities are included in the Starter, Professional and Enterprise plans. It is aligned with `pricing_guide_v3.md` (effective 2026-07-01), which is the authoritative source for prices and usage allowances. Use this document for \"is feature X included?\" questions and the pricing guide for \"what does it cost?\" questions.\n\n## Main Content\n\n### Plan Positioning\n\n- **Starter** — small teams automating departmental workflows. Self-serve.\n- **Professional** — growing mid-sized companies automating cross-department processes with SSO and more integrations.\n- **Enterprise** — large organisations needing advanced security, governance, scale, dedicated support and guided implementation.\n\n### Core Workflow Features\n\n| Feature | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Flow Builder (visual canvas) | Yes | Yes | Yes |\n| Workflow templates | 30 | 120+ | 120+ plus custom template library |\n| Active workflows | 20 | 200 | Unlimited |\n| Workflow runs included / month | 5,000 | 50,000 | 500,000 |\n| Environments | Production only | Dev + Production | Dev + Staging + Production |\n| Flow version history | 30 days | 1 year | Unlimited |\n| Human approval steps | Yes | Yes | Yes |\n| Parallel branches and loops | No | Yes | Yes |\n\n### AI Agent Features\n\n| Feature | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Agent Studio | Yes | Yes | Yes |\n| Active AI agents | 2 | 15 | Unlimited |\n| Document extraction agents | No | Yes | Yes |\n| Knowledge sources per agent | 1 | 10 | Unlimited |\n| Bring-your-own LLM key | No | No | Yes |\n| Agent confidence thresholds and approval gates | Basic | Yes | Yes, with policy templates |\n| Agent decision logs | 30 days | 90 days | 1 year (extendable to 7 years) |\n\n### Integrations and API\n\n| Feature | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Pre-built connectors | 25 standard | All 200+ | All 200+ |\n| Premium connectors (SAP, Oracle, Workday) | No | Add-on | Included |\n| Generic REST connector | No | Yes | Yes |\n| NexaFlow Relay (on-premise agent) | No | No | Yes |\n| Nexa API (REST) | Read-only | Full | Full |\n| GraphQL API | No | Yes | Yes |\n| Webhooks | 5 | 100 | Unlimited |\n| API rate limit | 60 req/min | 600 req/min | 3,000 req/min (raisable) |\n\n### Security, Identity and Governance\n\n| Feature | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Email + MFA login | Yes | Yes | Yes |\n| SSO (SAML 2.0 / OIDC) | No | Yes | Yes |\n| SCIM user provisioning | No | No | Yes |\n| Role-based access control | 3 fixed roles | 5 default roles | 5 default roles + custom roles |\n| Audit logs | No | 90-day retention | 1-year retention (extendable to 7 years) |\n| Audit log export / SIEM streaming | No | CSV export | SIEM streaming (Splunk, Datadog, Sentinel) |\n| IP allowlisting | No | No | Yes |\n| Data residency choice | US only | US or EU | US, EU or APAC |\n| Single-tenant deployment | No | No | Optional |\n| Customer-managed encryption keys | No | No | Yes |\n| HIPAA BAA | No | No | Yes |\n\n### Dashboards and Reporting\n\n| Feature | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Command Center standard dashboards | Yes | Yes | Yes |\n| Custom dashboards | No | 10 | Unlimited |\n| Hours-saved / ROI tracking | No | Yes | Yes |\n| BI export (Snowflake, BigQuery) | No | No | Yes |\n\n### Support and Services\n\n| Feature | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Support channel | Email | Email + chat | 24/7 phone, chat, email |\n| Target first response (P1) | 1 business day | 4 hours | 1 hour |\n| Uptime SLA | None | 99.5% | 99.9% |\n| Customer Success Manager | No | Pooled | Named CSM |\n| Implementation | Self-serve | Optional Quick Start | Guided implementation (required) |\n| Training | Online academy | Academy + 2 live sessions | Role-based training program |\n\n### Notes\n\n- Usage allowances above match `pricing_guide_v3.md`. Earlier matrices (v2) showed Professional with 25,000 runs; that figure is retired.\n- Custom roles, SCIM and SIEM streaming are Enterprise-only and are the most common reason Professional customers upgrade.\n\n## Key Facts\n\n- SSO is available on Professional and Enterprise; SCIM is Enterprise-only.\n- Audit logs: none on Starter, 90 days on Professional, 1 year (up to 7) on Enterprise.\n- Enterprise includes 500,000 workflow runs per month and unlimited AI agents.\n- Uptime SLA: 99.5% Professional, 99.9% Enterprise.\n- Enterprise implementation is guided and required.\n\n## Related Documents\n\n- product_overview.md\n- security_overview.md\n- pricing_guide_v3.md\n- enterprise_capabilities.md\n\n## Retrieval Notes\n\nRetrieve for \"which plan includes X\", \"does Professional have SSO/audit logs\", \"API rate limits\", \"how many AI agents/workflows per plan\" questions. Pair with `security_overview.md` for how a security feature works, and with `pricing_guide_v3.md` if the question also asks about cost."},{"document_id":"NEXA-015","title":"Integration Guide","document_type":"Guide","main_category":"Product & Security","secondary_topics":["API authentication and rate limits","On-premise connectivity","Implementation complexity","Premium connector licensing"],"rag_tags":["integrations","connectors","nexaflow-connect","rest-api","graphql","webhooks","salesforce","sap","workday","servicenow","nexaflow-relay","on-premise"],"version":"2.6","status":"Current","last_updated":"2026-06-18","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["21_product_overview.md","24_security_overview.md","14_implementation_timeline.md","12_enterprise_setup.md"],"summary":"Lists the systems NexaFlow integrates with and explains each integration method, the Nexa API, webhooks, NexaFlow Relay for on-premise systems, credential security, best practices and how integrations affect implementation complexity.","key_topics":["200+ pre-built connectors; premium connectors include SAP, Oracle Fusion and Workday.","REST and GraphQL APIs, OAuth 2.0, Python and JS SDKs.","NexaFlow Relay connects on-premise systems with outbound-only connections (Enterprise).","Webhooks are HMAC-signed and retried for 24 hours.","More than five integrations usually makes an implementation \"complex\" (8–12 weeks)."],"use_when":"Someone asks which systems NexaFlow integrates with, how the API works, how on-premise systems connect, or how integrations are authenticated.","file":"knowledge_base/01_product_and_security/15_integration_guide.md","filename":"15_integration_guide.md","folder":"01_product_and_security","retrieval_notes":"Retrieve for questions about supported systems (\"do you integrate with SAP/Workday?\"), API capabilities, webhooks, authentication, rate limits or on-premise connectivity. For the schedule of integration work during onboarding, also retrieve `implementation_timeline.md`.","body":"# Integration Guide\n\n## Metadata\n\n- Category: Product\n- Document Type: Technical Guide\n- Version: 2.6\n- Status: Current\n- Last Updated: 2026-06-18\n- Authoritative: Yes\n- Keywords: integrations, connectors, NexaFlow Connect, REST API, GraphQL, webhooks, Salesforce, SAP, Workday, ServiceNow, NexaFlow Relay, on-premise, authentication, OAuth, API keys, rate limits\n- Use When: Someone asks which systems NexaFlow integrates with, how the API works, how on-premise systems connect, or how integrations are authenticated.\n\n## Summary\n\nNexaFlow connects to business systems through NexaFlow Connect (200+ pre-built connectors), a generic REST connector, the Nexa API, webhooks and the NexaFlow Relay on-premise agent. This guide lists supported systems, explains each integration method, and covers authentication, limits and best practices. Integration configuration during onboarding is scheduled in `implementation_timeline.md`.\n\n## Main Content\n\n### Integration Methods\n\n| Method | Best For | Plans |\n|---|---|---|\n| Pre-built connectors | Popular SaaS and ERP systems | All (25 on Starter) |\n| Generic REST connector | Any system with a REST API | Professional, Enterprise |\n| Nexa API (REST / GraphQL) | Developers triggering flows or reading data | All (read-only on Starter) |\n| Webhooks (inbound and outbound) | Real-time event notifications | All (limits vary) |\n| NexaFlow Relay | On-premise databases, file shares, legacy apps | Enterprise |\n| SFTP / file drop | Batch CSV or EDI files | Professional, Enterprise |\n\n### Supported Systems (Selected)\n\n**CRM:** Salesforce Sales Cloud and Service Cloud, HubSpot, Microsoft Dynamics 365 CRM, Zoho CRM\n**ERP & Finance:** SAP S/4HANA, SAP ECC (via Relay), Oracle NetSuite, Oracle Fusion, Microsoft Dynamics 365 Finance, QuickBooks Online, Xero, Coupa\n**HR:** Workday, SAP SuccessFactors, BambooHR, ADP Workforce Now\n**ITSM & Service:** ServiceNow, Jira Service Management, Zendesk, Freshdesk\n**Collaboration:** Slack, Microsoft Teams, Google Workspace, Microsoft 365 (Outlook, SharePoint, OneDrive)\n**Data:** Snowflake, BigQuery, PostgreSQL, SQL Server, MySQL, Oracle Database\n**Identity:** Okta, Microsoft Entra ID (Azure AD), Ping Identity (used for SSO and SCIM)\n**Documents:** DocuSign, Adobe Acrobat Sign, Box, Dropbox\n\nSAP, Oracle Fusion and Workday connectors are classified as premium connectors: an add-on on Professional and included on Enterprise.\n\n### The Nexa API\n\n- **REST API** — resources for flows, runs, agents, users, roles and audit events. JSON over HTTPS.\n- **GraphQL API** — query run history and dashboard metrics efficiently (Professional and Enterprise).\n- **Authentication** — OAuth 2.0 client credentials for server-to-server use; personal API keys for testing. Keys are scoped to roles and can be rotated or revoked from the Admin Console.\n- **Rate limits** — 60 requests/minute (Starter), 600 (Professional), 3,000 (Enterprise, raisable on request).\n- **Versioning** — the API is versioned in the URL (`/v3/`). Deprecated versions receive 12 months' notice.\n- **SDKs** — official Python and JavaScript/TypeScript SDKs.\n\n### Webhooks\n\nOutbound webhooks send signed (HMAC-SHA256) event payloads when a run starts, completes, fails or waits for approval. Inbound webhooks give each flow a unique URL that can trigger it. Failed deliveries retry with exponential backoff for up to 24 hours.\n\n### NexaFlow Relay (On-Premise Agent)\n\nThe Relay is a lightweight agent installed inside the customer network (Linux or Windows, or as a Docker container). It opens an outbound-only TLS connection to NexaFlow, so no inbound firewall ports are required. It supports on-premise databases, SAP ECC, file shares and internal HTTP services. Enterprise customers commonly deploy two Relay instances for high availability. Relay installation usually needs the customer's network and security teams, which is one reason integration-heavy projects can extend beyond the standard implementation timeline.\n\n### Credential Security\n\nConnector credentials are encrypted with AES-256 and stored in a dedicated secrets vault. Enterprise customers can use customer-managed keys. Credentials are never shown again after being saved. See `security_overview.md`.\n\n### Integration Best Practices\n\n1. Create a dedicated service account in each connected system with least-privilege permissions.\n2. Build and test in the Development environment first, using sandbox instances of the target systems.\n3. Map fields and data owners before configuration; unclear field mapping is the top cause of integration delays.\n4. Enable failure alerts to Slack or Teams for every production flow.\n5. Keep the number of integrations in the first go-live phase small (typically 3–5) and add more after launch.\n\n### Integration Complexity and Timelines\n\nIn the standard enterprise implementation, integration configuration happens in weeks 2–3. Projects with more than five integrations, on-premise systems via Relay, or custom API work are treated as complex and typically move into the 8–12 week range. The authoritative timeline is in `implementation_timeline.md`.\n\n## Key Facts\n\n- 200+ pre-built connectors; premium connectors include SAP, Oracle Fusion and Workday.\n- REST and GraphQL APIs, OAuth 2.0, Python and JS SDKs.\n- NexaFlow Relay connects on-premise systems with outbound-only connections (Enterprise).\n- Webhooks are HMAC-signed and retried for 24 hours.\n- More than five integrations usually makes an implementation \"complex\" (8–12 weeks).\n\n## Related Documents\n\n- product_overview.md\n- security_overview.md\n- implementation_timeline.md\n- enterprise_setup.md\n\n## Retrieval Notes\n\nRetrieve for questions about supported systems (\"do you integrate with SAP/Workday?\"), API capabilities, webhooks, authentication, rate limits or on-premise connectivity. For the schedule of integration work during onboarding, also retrieve `implementation_timeline.md`."},{"document_id":"NEXA-021","title":"NexaFlow Platform — Product Overview","document_type":"Product Overview","main_category":"Product & Security","secondary_topics":["Use cases by function","Integrations","AI agents","Deployment summary"],"rag_tags":["platform-overview","workflow-automation","ai-agents","flow-builder","agent-studio","command-center","nexa-api","nexaflow-connect","use-cases"],"version":"4.2","status":"Current","last_updated":"2026-08-04","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["13_feature_matrix.md","15_integration_guide.md","24_security_overview.md","10_enterprise_capabilities.md"],"summary":"High-level explanation of the NexaFlow workflow automation and AI operations platform, its five core modules, common use cases, user types and how customers measure value.","key_topics":["Five core modules: Flow Builder, Agent Studio, NexaFlow Connect, Command Center, Nexa API/Admin Console.","200+ pre-built connectors and 120+ workflow templates.","REST and GraphQL APIs with webhooks.","Hosted on AWS; US, EU and APAC data residency for Enterprise.","AI agent decisions are fully logged and can require human approval."],"use_when":"Someone needs a high-level explanation of what NexaFlow does, its core modules, who uses it, or how the pieces fit together. For plan-specific details use 13_feature_matrix.md (see conflict C5 on Professional implementation).","file":"knowledge_base/01_product_and_security/21_product_overview.md","filename":"21_product_overview.md","folder":"01_product_and_security","retrieval_notes":"Retrieve this file for general \"what is NexaFlow / what does the product do / what modules exist / what are AI agents in NexaFlow\" questions. For plan-specific availability use `feature_matrix.md`; for security, SSO or audit log detail use `security_overview.md`; for onboarding timelines use the Implementation documents, not this file.","body":"# NexaFlow Platform — Product Overview\n\n## Metadata\n\n- Category: Product\n- Document Type: Product Overview\n- Version: 4.2\n- Status: Current\n- Last Updated: 2026-08-04\n- Authoritative: Yes\n- Keywords: platform overview, workflow automation, AI agents, Flow Builder, Agent Studio, Command Center, Nexa API, NexaFlow Connect, use cases\n- Use When: Someone needs a high-level explanation of what NexaFlow does, its core modules, who uses it, or how the pieces fit together.\n\n## Summary\n\nNexaFlow Technologies sells a B2B workflow automation and AI operations platform for mid-sized and enterprise companies. The platform combines a visual workflow builder, configurable AI agents, 200+ pre-built integrations, operational dashboards and an open API. This document explains the five core modules, typical use cases and the value customers get. Detailed plan-by-plan feature availability lives in `feature_matrix.md`.\n\n## Main Content\n\n### What NexaFlow Is\n\nNexaFlow is a cloud platform that lets operations, finance, HR, IT and customer teams automate multi-step business processes that span several systems. Instead of employees copying data between a CRM, an ERP, email and spreadsheets, NexaFlow listens for events, applies business rules, calls AI agents when judgement is needed, and routes exceptions to humans.\n\nNexaFlow is delivered as multi-tenant SaaS on AWS. Enterprise customers can request a single-tenant (dedicated) environment and choose a data residency region (US, EU or APAC). Details are in `enterprise_capabilities.md`.\n\n### The Five Core Modules\n\n**1. Flow Builder**\nA drag-and-drop canvas for designing workflows. Flows are made of triggers (a new record, a schedule, a webhook, an email), steps (create, update, transform, approve, notify) and conditions (branching, loops, parallel paths). Flows are versioned, so teams can test a draft version without affecting the live one. More than 120 workflow templates are included for common processes such as invoice approval, employee onboarding, purchase requests and customer escalations.\n\n**2. Agent Studio**\nAgent Studio is where teams build AI agents that sit inside workflows. An agent is given instructions, a set of allowed tools (for example \"read a Salesforce account\" or \"draft an email\"), and optional knowledge sources. Typical agents classify incoming requests, extract fields from documents (invoices, contracts, claims), summarise case history, or recommend the next action. Every agent decision is logged with its inputs and outputs, and agents can be configured to require human approval above a confidence threshold.\n\n**3. NexaFlow Connect (Integrations)**\nMore than 200 pre-built connectors for systems such as Salesforce, HubSpot, SAP S/4HANA, Oracle NetSuite, Microsoft Dynamics 365, Workday, ServiceNow, Zendesk, Jira, Slack, Microsoft Teams, Google Workspace, Snowflake and major databases. A generic REST connector and a secure on-premise agent (NexaFlow Relay) cover systems without a pre-built connector. See `integration_guide.md`.\n\n**4. Command Center (Dashboards)**\nReal-time dashboards showing workflow volume, cycle time, SLA breaches, exception queues, agent accuracy and hours saved. Managers can build custom dashboards, set alerts and export data to BI tools.\n\n**5. Nexa API and Admin Console**\nThe Nexa API (REST and GraphQL, with webhooks) lets engineering teams trigger flows, manage users and pull run data programmatically. The Admin Console handles users, role-based access control (RBAC), SSO, environments (Development, Staging, Production) and audit logs. Security controls are described in `security_overview.md`.\n\n### Common Use Cases\n\n| Function | Example Workflow |\n|---|---|\n| Finance | Invoice capture, 3-way match, approval routing, ERP posting |\n| Operations | Purchase requests, supplier onboarding, quality incident handling |\n| HR | Employee onboarding and offboarding across HRIS, IT and payroll |\n| Customer Service | Ticket triage by AI agent, escalation, refund approvals |\n| Sales Ops | Lead routing, quote approvals, contract handoff to finance |\n| IT | Access requests, license provisioning, incident notifications |\n\n### Who Uses NexaFlow\n\n- **Operations leaders** who own process efficiency and SLA targets.\n- **IT and automation teams** who govern integrations and security.\n- **Business analysts** who build and maintain flows without writing code.\n- **Developers** who extend the platform through the API.\n\n### How Customers Measure Value\n\nCustomers typically track hours of manual work removed, processing time, error rates and onboarding speed. Published customer results include 40% reduction in manual work at a manufacturer and 35% faster processing at a financial services firm (see the case study documents).\n\n### Deployment Summary\n\nStarter customers self-onboard in days. Professional and Enterprise customers go through a guided implementation. A standard enterprise implementation takes 4–6 weeks; this is covered in the Implementation documents, not here.\n\n## Key Facts\n\n- Five core modules: Flow Builder, Agent Studio, NexaFlow Connect, Command Center, Nexa API/Admin Console.\n- 200+ pre-built connectors and 120+ workflow templates.\n- REST and GraphQL APIs with webhooks.\n- Hosted on AWS; US, EU and APAC data residency for Enterprise.\n- AI agent decisions are fully logged and can require human approval.\n\n## Related Documents\n\n- feature_matrix.md\n- integration_guide.md\n- security_overview.md\n- enterprise_capabilities.md\n\n## Retrieval Notes\n\nRetrieve this file for general \"what is NexaFlow / what does the product do / what modules exist / what are AI agents in NexaFlow\" questions. For plan-specific availability use `feature_matrix.md`; for security, SSO or audit log detail use `security_overview.md`; for onboarding timelines use the Implementation documents, not this file."},{"document_id":"NEXA-024","title":"Security Overview","document_type":"Security & Compliance Overview","main_category":"Product & Security","secondary_topics":["Compliance certifications","AI data privacy","Audit logs by plan","Security reviews during onboarding"],"rag_tags":["security","compliance","soc-2-type-ii","iso-27001","gdpr","hipaa","encryption","sso","saml","oidc","mfa","scim"],"version":"5.1","status":"Current","last_updated":"2026-05-22","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["13_feature_matrix.md","10_enterprise_capabilities.md","12_enterprise_setup.md","17_objection_handling.md"],"summary":"Covers NexaFlow security and compliance: certifications, infrastructure, encryption, identity and authentication, role-based access control, audit logs, AI agent data handling, data retention and security reviews.","key_topics":["SOC 2 Type II, ISO 27001, GDPR; HIPAA with BAA on Enterprise.","AES-256 at rest, TLS 1.2+ in transit, customer-managed keys on Enterprise.","SSO (SAML/OIDC) on Professional+; SCIM and custom roles on Enterprise.","Audit logs: 90 days (Professional), 1–7 years with SIEM streaming (Enterprise).","Customer data is never used to train AI models."],"use_when":"Someone asks about security certifications, encryption, identity and access management, audit logs, AI data privacy, or needs to answer a security questionnaire.","file":"knowledge_base/01_product_and_security/24_security_overview.md","filename":"24_security_overview.md","folder":"01_product_and_security","retrieval_notes":"Retrieve for any question about security, compliance certifications, encryption, SSO, MFA, SCIM, RBAC, audit logs, AI data privacy or security questionnaires. Combine with `feature_matrix.md` if the question is plan-specific, and with `objection_handling.md` if a salesperson asks how to respond to a security concern.","body":"# Security Overview\n\n## Metadata\n\n- Category: Product\n- Document Type: Security & Compliance Overview\n- Version: 5.1\n- Status: Current\n- Last Updated: 2026-05-22\n- Authoritative: Yes\n- Keywords: security, compliance, SOC 2 Type II, ISO 27001, GDPR, HIPAA, encryption, SSO, SAML, OIDC, MFA, SCIM, RBAC, role-based access, audit logs, penetration testing, data retention, AI data usage\n- Use When: Someone asks about security certifications, encryption, identity and access management, audit logs, AI data privacy, or needs to answer a security questionnaire.\n\n## Summary\n\nNexaFlow is built for regulated and security-conscious organisations. The platform is SOC 2 Type II and ISO 27001 certified, supports GDPR, and offers HIPAA-ready deployments with a Business Associate Agreement on Enterprise. This document covers infrastructure security, encryption, identity (SSO, MFA, SCIM), role-based access control, audit logs and how customer data is handled by AI agents.\n\n## Main Content\n\n### Certifications and Compliance\n\n| Standard | Status |\n|---|---|\n| SOC 2 Type II | Certified, audited annually (latest report: March 2026) |\n| ISO/IEC 27001:2022 | Certified |\n| GDPR | Compliant; Data Processing Agreement available to all customers |\n| HIPAA | Supported on Enterprise with signed BAA |\n| CCPA | Compliant |\n| Penetration testing | Independent third-party test twice a year; summary available under NDA |\n\nSOC 2 reports and the standard security questionnaire (CAIQ) are shared through the NexaFlow Trust Center after an NDA is signed.\n\n### Infrastructure\n\n- Hosted on AWS in US (Virginia), EU (Frankfurt) and APAC (Sydney) regions.\n- Production runs across multiple availability zones with automated failover.\n- Recovery Point Objective (RPO): 1 hour. Recovery Time Objective (RTO): 4 hours.\n- Encrypted backups are retained for 35 days.\n- Employee production access requires hardware MFA, is time-bound and is logged.\n\n### Encryption\n\n- **In transit:** TLS 1.2 or higher for all traffic.\n- **At rest:** AES-256 for databases, file storage and backups.\n- **Secrets:** connector credentials stored in a dedicated vault.\n- **Customer-managed keys (CMK):** available on Enterprise via AWS KMS.\n\n### Identity and Authentication\n\n- **MFA** is available on all plans and can be enforced by admins.\n- **Single Sign-On** via SAML 2.0 or OpenID Connect on Professional and Enterprise. Tested with Okta, Microsoft Entra ID, Ping Identity and Google Workspace.\n- **SCIM 2.0 provisioning** (Enterprise) automatically creates, updates and deactivates users from the identity provider.\n- **Session controls** include idle timeout and IP allowlisting (Enterprise).\n\n### Role-Based Access Control (RBAC)\n\nNexaFlow uses role-based access control across flows, agents, connectors and data.\n\nDefault roles (Professional and Enterprise):\n\n1. **Owner** — full control including billing and security settings.\n2. **Admin** — manages users, roles, connectors and environments.\n3. **Builder** — creates and edits flows and agents in permitted workspaces.\n4. **Operator** — runs flows, handles approvals and exception queues.\n5. **Viewer** — read-only access to dashboards and run history.\n\nEnterprise customers can create **custom roles** with granular permissions (for example \"can approve payments over $10,000 but cannot edit flows\"). Permissions can be scoped by workspace, so finance flows are invisible to HR builders. Starter includes three fixed roles (Admin, Builder, Viewer).\n\n### Audit Logs\n\nAudit logs record who did what and when: logins, SSO events, permission changes, flow edits and publishes, connector credential changes, API key usage, agent decisions and data exports.\n\n- Starter: not available.\n- Professional: 90-day retention, CSV export.\n- Enterprise: 1-year retention by default, extendable up to 7 years; real-time streaming to SIEM tools (Splunk, Datadog, Microsoft Sentinel).\n- Audit logs are immutable and cannot be edited or deleted by customer admins.\n\n### AI Agent Data Handling\n\n- Customer data is **never used to train** foundation models.\n- LLM providers are contractually bound to zero data retention.\n- Enterprise customers may bring their own LLM key or restrict agents to an approved model list.\n- Agents can only access tools and connectors explicitly granted to them, and every agent action is written to the audit log.\n- PII redaction can be applied before content is sent to a model.\n\n### Data Retention and Deletion\n\nRun data is retained according to plan settings (configurable on Enterprise). On contract termination, customer data is deleted within 30 days and a deletion certificate is available on request.\n\n### Security Reviews During Sales and Onboarding\n\nMost enterprise buyers run a vendor security review. A standard review (questionnaire + SOC 2 report) typically takes 1–2 weeks. Reviews needing custom contract terms, on-site assessments or penetration test coordination take longer and are a common reason onboarding moves into the extended 8–12 week timeline (see `implementation_timeline.md`).\n\n## Key Facts\n\n- SOC 2 Type II, ISO 27001, GDPR; HIPAA with BAA on Enterprise.\n- AES-256 at rest, TLS 1.2+ in transit, customer-managed keys on Enterprise.\n- SSO (SAML/OIDC) on Professional+; SCIM and custom roles on Enterprise.\n- Audit logs: 90 days (Professional), 1–7 years with SIEM streaming (Enterprise).\n- Customer data is never used to train AI models.\n\n## Related Documents\n\n- feature_matrix.md\n- enterprise_capabilities.md\n- enterprise_setup.md\n- objection_handling.md\n\n## Retrieval Notes\n\nRetrieve for any question about security, compliance certifications, encryption, SSO, MFA, SCIM, RBAC, audit logs, AI data privacy or security questionnaires. Combine with `feature_matrix.md` if the question is plan-specific, and with `objection_handling.md` if a salesperson asks how to respond to a security concern."},{"document_id":"NEXA-009","title":"Discount Policy","document_type":"Policy","main_category":"Pricing & Licensing","secondary_topics":["Enterprise deal approval","Implementation fee discounts","Renewal pricing","Legacy v2 customers"],"rag_tags":["discount","discount-approval","approval-matrix","annual-discount","multi-year-discount","nonprofit-discount","education-discount","startup","promotional-discount","end-of-quarter","cfo-approval","deal-desk"],"version":"3.0","status":"Current","last_updated":"2026-07-01","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["20_pricing_guide_v3.md","11_enterprise_pricing.md","19_pricing_faq.md","17_objection_handling.md"],"summary":"Internal policy defining standard discounts, the discretionary discount approval matrix, implementation fee discounts, special programs, renewal rules and prohibited discounting practices.","key_topics":["Annual billing (~17%) and multi-year discounts (5% / 10%) need no approval.","AEs can give up to 10%; Sales Managers up to 20%; VP Sales up to 30%; above 30% needs the CFO.","Complex Enterprise implementation fees are not discountable.","Nonprofit and education discounts are 15%.","Unconditional quarter-end discounts are prohibited."],"use_when":"Someone asks how much discount can be given, who approves discounts, whether annual or multi-year discounts exist, or which special discounts are allowed. Reviewer decision 2026-11-12 (conflict C1): for Enterprise deals, any price below the tier floor in 11_enterprise_pricing.md requires VP Sales approval, even where this policy's matrix would allow a Sales Manager.","file":"knowledge_base/02_pricing_and_licensing/09_discount_policy.md","filename":"09_discount_policy.md","folder":"02_pricing_and_licensing","retrieval_notes":"Retrieve for \"how much discount can I give\", \"who approves a 25% discount\", \"are there annual/multi-year discounts\", nonprofit/education/startup discount questions, and renewal discount rules. For actual list prices retrieve `pricing_guide_v3.md`.","body":"# Discount Policy\n\n## Metadata\n\n- Category: Pricing\n- Document Type: Internal Policy\n- Version: 3.0\n- Status: Current\n- Last Updated: 2026-07-01\n- Authoritative: Yes\n- Keywords: discount, discount approval, approval matrix, annual discount, multi-year discount, nonprofit discount, education discount, startup, promotional discount, end of quarter, CFO approval, deal desk\n- Use When: Someone asks how much discount can be given, who approves discounts, whether annual or multi-year discounts exist, or which special discounts are allowed.\n\n## Summary\n\nThis policy defines the discounts NexaFlow sellers can offer and who must approve them. Standard discounts (annual billing, multi-year terms) are built into `pricing_guide_v3.md` and need no approval. Additional discretionary discounts follow an approval matrix by seniority. The policy also covers special programs, prohibited practices and how discounts interact with renewals.\n\n## Main Content\n\n### 1. Standard Discounts (No Approval Required)\n\n| Discount | Amount | Notes |\n|---|---|---|\n| Annual billing | ~17% vs monthly price | Already reflected in annual list prices ($29 / $59 / $95) |\n| 2-year term | 5% off annual price | Paid annually in advance |\n| 3-year term | 10% off annual price | Paid annually in advance |\n\nStandard discounts are stackable with each other only in the sense that the multi-year percentage applies to the annual price. They do not count toward the discretionary limits below.\n\n### 2. Discretionary Discount Approval Matrix\n\nDiscretionary discount is measured as the percentage below the **annual list or tier target price** after standard discounts.\n\n| Additional Discount | Approver | Turnaround |\n|---|---|---|\n| 0–10% | Account Executive (self-approved, logged in CRM) | Immediate |\n| 10.1–20% | Sales Manager | 1 business day |\n| 20.1–30% | VP Sales | 2 business days |\n| Above 30% | CFO + VP Sales | 5 business days; deal desk review required |\n\nFor Enterprise deals, the tier floor in `enterprise_pricing.md` corresponds roughly to the 10% Sales Manager threshold.\n\n### 3. Implementation Fee Discounts\n\n- Quick Start (Professional, $5,000): up to 50% off with Sales Manager approval.\n- Enterprise Standard Implementation ($15,000): up to 25% off with Sales Manager approval.\n- Enterprise Complex Implementation ($35,000): **not discountable**.\n- Implementation fees may never be fully waived for Enterprise.\n\n### 4. Special Programs\n\n| Program | Discount | Eligibility |\n|---|---|---|\n| Nonprofit | 15% | Registered nonprofit; Starter and Professional only |\n| Education | 15% | Accredited schools and universities |\n| Startup | 25% for year 1 | Under 50 employees, less than $10M funding, Starter or Professional |\n| Competitive displacement | Up to 15% for year 1 | Replacing a named competitor contract; VP Sales approval |\n| Case study partner | Up to 5% | Customer agrees to a public case study within 6 months of go-live |\n\nSpecial program discounts count toward the discretionary matrix, so a nonprofit receiving 15% plus another 10% totals 25% and needs VP Sales approval.\n\n### 5. End-of-Quarter Discounts\n\nEnd-of-quarter discounts are allowed only in exchange for a clear commitment (signature by a set date, larger user count or longer term). Offering unconditional \"quarter-end\" discounts trains customers to wait and is not permitted.\n\n### 6. Renewal Rules\n\n- Discretionary discounts apply to the initial term only unless the contract states otherwise.\n- At renewal, pricing moves back toward list, subject to the renewal cap (7% default for Enterprise).\n- Customers on legacy Pricing Guide v2 prices move to v3 pricing at renewal with the renewal cap applied. See `pricing_faq.md` for historical prices.\n\n### 7. Prohibited Practices\n\n- Side letters or verbal discount promises not in the order form.\n- Free months added to the end of a contract without approval (treated as a discount).\n- Discounting overage rates below Enterprise committed-block pricing.\n- Splitting one customer into multiple small contracts to avoid approval thresholds.\n- Sharing internal floors or this policy with customers.\n\n### 8. How to Request Approval\n\n1. Create a discount request in the CRM opportunity.\n2. Include deal size, term, competitor involved, and what the customer gives in return.\n3. Attach the ROI summary.\n4. Approvals expire after 30 days if the deal has not closed.\n\n### Worked Example\n\nA Professional customer with 120 users wants a 2-year contract and 15% extra discount.\n- Annual list: $59 → 2-year standard discount 5% → $56.05.\n- 15% discretionary → $47.64 per user/month → requires **Sales Manager** approval (10.1–20% band).\n\n## Key Facts\n\n- Annual billing (~17%) and multi-year discounts (5% / 10%) need no approval.\n- AEs can give up to 10%; Sales Managers up to 20%; VP Sales up to 30%; above 30% needs the CFO.\n- Complex Enterprise implementation fees are not discountable.\n- Nonprofit and education discounts are 15%.\n- Unconditional quarter-end discounts are prohibited.\n\n## Related Documents\n\n- pricing_guide_v3.md\n- enterprise_pricing.md\n- pricing_faq.md\n- objection_handling.md\n\n## Retrieval Notes\n\nRetrieve for \"how much discount can I give\", \"who approves a 25% discount\", \"are there annual/multi-year discounts\", nonprofit/education/startup discount questions, and renewal discount rules. For actual list prices retrieve `pricing_guide_v3.md`."},{"document_id":"NEXA-011","title":"Enterprise Pricing and Negotiation Guidelines","document_type":"Guide","main_category":"Pricing & Licensing","secondary_topics":["Discount approval","Implementation fees","Deal desk process","Legacy v2 Enterprise pricing"],"rag_tags":["enterprise-pricing","custom-quote","negotiation","deal-desk","volume-tiers","multi-year","acv","minimum-contract","implementation-fee","price-floor","concessions","procurement"],"version":"3.0","status":"Current","last_updated":"2026-07-01","authoritative":"Yes","supersedes":"None","contains_outdated_information":"Yes","related_documents":["20_pricing_guide_v3.md","09_discount_policy.md","16_licensing_model.md","22_proposal_template.md"],"summary":"Internal guidance on building, quoting and negotiating Enterprise deals: quote components, volume tiers with price floors, minimum contract, committed usage blocks and negotiable versus non-negotiable terms. It includes a historical note on the outdated Pricing Guide v2 Enterprise price of $85.","key_topics":["Enterprise starts at $95/user/month (annual), minimum 100 users, $114,000 minimum ACV.","Volume tiers go down to $75 target for 1,000–2,499 users.","Multi-year discounts: 5% for 2 years, 10% for 3 years.","Complex implementation ($35,000) is not discountable.","The old $85 Enterprise price from Pricing Guide v2 is outdated."],"use_when":"A seller needs to structure, quote or negotiate an Enterprise deal, or someone asks how Enterprise pricing scales with volume. Authoritative for Enterprise deal structure; list prices come from 20_pricing_guide_v3.md. Reviewer decision 2026-11-12 (conflict C1): its rule that prices below the tier floor need VP Sales approval prevails. Its historical note on the $85 v2 price is outdated.","file":"knowledge_base/02_pricing_and_licensing/11_enterprise_pricing.md","filename":"11_enterprise_pricing.md","folder":"02_pricing_and_licensing","retrieval_notes":"Retrieve for Enterprise quote structure, volume pricing, minimum contract size, what is negotiable, ramp deals and deal desk steps. For base list prices always also retrieve `pricing_guide_v3.md`; for approval authority retrieve `discount_policy.md`.","body":"# Enterprise Pricing and Negotiation Guidelines\n\n## Metadata\n\n- Category: Pricing\n- Document Type: Internal Sales Guidance\n- Version: 3.0\n- Status: Current\n- Last Updated: 2026-07-01\n- Authoritative: Yes (for Enterprise deal structure; list prices come from pricing_guide_v3.md)\n- Keywords: enterprise pricing, custom quote, negotiation, deal desk, volume tiers, multi-year, ACV, minimum contract, implementation fee, price floor, concessions, procurement\n- Use When: A seller needs to structure, quote or negotiate an Enterprise deal, or someone asks how Enterprise pricing scales with volume.\n\n## Summary\n\nEnterprise plans are custom-quoted starting from the $95 per user per month list price in `pricing_guide_v3.md`. This document explains how Enterprise quotes are built, the volume tiers, the minimum contract, what can and cannot be negotiated, and how to trade concessions for commitments. It is internal guidance for sales and deal desk teams and must not be shared with customers.\n\n## Main Content\n\n### How an Enterprise Quote Is Built\n\nAn Enterprise quote has four components:\n\n1. **Platform subscription** — users × per-user price × 12 months.\n2. **Usage allowance** — 500,000 workflow runs and 250,000 AI agent actions per month are included; larger committed volumes are priced in blocks.\n3. **Add-ons** — single-tenant deployment, extended audit retention, extra sandboxes.\n4. **One-time implementation** — $15,000 Standard (4–6 weeks) or $35,000 Complex (8–12 weeks).\n\n### Volume Tiers (Per User / Month, Annual Billing)\n\n| Committed Users | Target Price | Floor Without VP Approval |\n|---|---|---|\n| 100–249 | $95 | $86 |\n| 250–499 | $89 | $80 |\n| 500–999 | $82 | $74 |\n| 1,000–2,499 | $75 | $68 |\n| 2,500+ | Deal desk review | Deal desk review |\n\nThe \"target price\" is what sellers should quote first. The \"floor\" is the lowest price a Sales Manager can approve under `discount_policy.md`; anything below requires VP Sales approval.\n\n### Minimum Contract\n\n- Minimum 100 users.\n- Minimum annual contract value (ACV): **$114,000** (100 users × $95 × 12).\n- Customers below 100 users should be offered Professional unless they require an Enterprise-only feature (SCIM, custom roles, HIPAA BAA, data residency outside US/EU, single-tenant). In those cases the 100-user minimum still applies.\n\n### Committed Usage Blocks\n\n| Additional Monthly Runs (committed) | Price per 1,000 Runs |\n|---|---|\n| Up to 500,000 extra | $4.00 (standard overage) |\n| 500,001–2,000,000 extra | $3.20 |\n| Above 2,000,000 extra | $2.50 |\n\nCommitting volume in the contract is cheaper for the customer than paying overage and gives NexaFlow predictable revenue.\n\n### What Can Be Negotiated\n\n| Lever | Guidance |\n|---|---|\n| Per-user price | Within tier floor; below floor needs VP approval |\n| Multi-year discount | 5% (2-year), 10% (3-year) — standard, no approval needed |\n| Payment terms | Annual in advance is standard; quarterly billing allowed for ACV above $250,000 with a 3% uplift |\n| Implementation fee | Up to 25% off the Standard package with Sales Manager approval; Complex package is not discountable |\n| Ramp pricing | Allowed: e.g., 150 users in year 1 rising to 400 in year 2, priced at year-2 tier |\n| Renewal cap | Default 7%; may be lowered to 5% for 3-year terms |\n| Pilot | Paid 60-day pilot credited against year-1 subscription |\n\n### What Cannot Be Negotiated\n\n- Free implementation for Enterprise.\n- Uptime SLA above 99.9%.\n- Unlimited workflow runs without a committed volume.\n- Price protection longer than 3 years.\n- Monthly billing on Enterprise.\n\n### Give-Get Principle\n\nNever give a concession without getting something back. Examples:\n\n- Give 5% extra discount → Get a 3-year term, a published case study, or signature by quarter end.\n- Give reduced implementation fee → Get an executive sponsor and a committed go-live date.\n- Give ramp pricing → Get a higher year-2 user commitment.\n\n### Historical Note\n\nEnterprise list price was $85 per user/month under Pricing Guide v2 (2025). That figure is **no longer valid** for new quotes. Existing customers on v2 contracts keep their price until renewal, then move to v3 tiers with the renewal cap applied. See `pricing_faq.md`.\n\n### Deal Desk Checklist\n\n1. Confirm user count, workflow volume and Enterprise-only requirements.\n2. Choose Standard or Complex implementation based on integrations, migration volume and security review (see `implementation_timeline.md`).\n3. Apply volume tier and multi-year discount.\n4. Check any extra discount against `discount_policy.md` approval matrix.\n5. Attach ROI summary and relevant case study before sending the proposal.\n\n## Key Facts\n\n- Enterprise starts at $95/user/month (annual), minimum 100 users, $114,000 minimum ACV.\n- Volume tiers go down to $75 target for 1,000–2,499 users.\n- Multi-year discounts: 5% for 2 years, 10% for 3 years.\n- Complex implementation ($35,000) is not discountable.\n- The old $85 Enterprise price from Pricing Guide v2 is outdated.\n\n## Related Documents\n\n- pricing_guide_v3.md\n- discount_policy.md\n- licensing_model.md\n- proposal_template.md\n\n## Retrieval Notes\n\nRetrieve for Enterprise quote structure, volume pricing, minimum contract size, what is negotiable, ramp deals and deal desk steps. For base list prices always also retrieve `pricing_guide_v3.md`; for approval authority retrieve `discount_policy.md`."},{"document_id":"NEXA-016","title":"Licensing Model","document_type":"Policy","main_category":"Pricing & Licensing","secondary_topics":["User types and roles","Contract terms and auto-renewal","Plan upgrades and downgrades","Sandbox usage"],"rag_tags":["licensing","named-user","user-types","builder","operator","viewer-license","approver","service-accounts","api-users","true-up","license-transfer","contract-term"],"version":"3.0","status":"Current","last_updated":"2026-07-01","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["20_pricing_guide_v3.md","11_enterprise_pricing.md","19_pricing_faq.md","13_feature_matrix.md"],"summary":"Explains how NexaFlow is licensed per named user, which user types are free, minimum and maximum users per plan, true-ups, upgrades, downgrades and contract terms.","key_topics":["Licensed per named Full User per month, plus usage allowances.","Approvers and external participants are free and unlimited.","Viewers are free up to 3× the Full User count (Professional and Enterprise).","Enterprise has a 100-user minimum and quarterly true-ups.","Downgrades happen only at renewal."],"use_when":"Someone asks what counts as a user, how licenses are counted, whether viewers or approvers need licenses, or how to add, remove, upgrade or downgrade licenses.","file":"knowledge_base/02_pricing_and_licensing/16_licensing_model.md","filename":"16_licensing_model.md","folder":"02_pricing_and_licensing","retrieval_notes":"Retrieve when the question is about who needs a license, license counts, viewers/approvers, service accounts, true-ups, adding or removing users, or upgrade/downgrade rules. For actual prices retrieve `pricing_guide_v3.md`.","body":"# Licensing Model\n\n## Metadata\n\n- Category: Pricing\n- Document Type: Licensing Policy\n- Version: 3.0\n- Status: Current\n- Last Updated: 2026-07-01\n- Authoritative: Yes\n- Keywords: licensing, named user, user types, builder, operator, viewer license, approver, service accounts, API users, true-up, license transfer, contract term, upgrades, downgrades\n- Use When: Someone asks what counts as a user, how licenses are counted, whether viewers or approvers need licenses, or how to add, remove, upgrade or downgrade licenses.\n\n## Summary\n\nNexaFlow is licensed per named user per month, with usage allowances for workflow runs and AI agent actions. Not every person who touches a workflow needs a paid license: lightweight approvers and viewers are handled differently from builders and operators. This document explains license types, how users are counted, true-ups, upgrades and downgrades. Prices themselves are defined in `pricing_guide_v3.md`.\n\n## Main Content\n\n### Licensing Principles\n\n1. **Named users** — a license is assigned to one identified person and cannot be shared.\n2. **Usage allowances** — each plan includes workflow runs and AI agent actions; usage above allowance is billed as overage.\n3. **Per-tenant** — licenses belong to one NexaFlow tenant (organisation).\n\n### License Types\n\n| License Type | Who | Counts as Paid User? | Plans |\n|---|---|---|---|\n| Full User | Builders, Admins, Operators working exception queues | Yes | All |\n| Viewer | Read-only dashboard access | Free up to 3× the number of Full Users | Professional, Enterprise |\n| Approver | People who only approve/reject tasks via email, Slack or Teams | Free, unlimited | All |\n| External Participant | Suppliers, customers or candidates completing a form in a flow | Free, unlimited | Professional, Enterprise |\n| Service Account / API User | System integrations using the Nexa API | Free (5 on Professional, 25 on Enterprise) | Professional, Enterprise |\n\nExample: a finance department with 20 people building and operating flows, 60 managers who view dashboards and 300 employees who approve expenses in Teams needs **20 Full User licenses** only (60 viewers is within the free 3× allowance of 60).\n\n### Minimum and Maximum Users\n\n| Plan | Minimum | Maximum |\n|---|---|---|\n| Starter | 5 | 25 |\n| Professional | 10 | 250 |\n| Enterprise | 100 | No maximum |\n\nA Professional customer that grows beyond 250 Full Users must move to Enterprise at renewal, or mid-term if they exceed 275 users.\n\n### Adding and Removing Users\n\n- **Adding users:** allowed any time. New licenses are prorated to the contract renewal date.\n- **Reassigning licenses:** a license can be moved from a departing employee to a new one at no cost. SCIM (Enterprise) does this automatically.\n- **Removing users:** the license count cannot drop below the contracted number during the term. Reductions take effect at renewal.\n\n### True-Up\n\nEnterprise contracts include a **quarterly true-up**. If the number of active Full Users exceeds the contracted count, the extra users are invoiced at the contracted per-user price, prorated. Professional customers are billed automatically when users are added.\n\n### Upgrades and Downgrades\n\n| Change | When Allowed | Pricing Effect |\n|---|---|---|\n| Starter → Professional | Any time | Prorated credit for unused Starter term |\n| Professional → Enterprise | Any time | Prorated credit; Enterprise implementation fee applies |\n| Enterprise → Professional | Renewal only | Enterprise-only features are removed |\n| Professional → Starter | Renewal only | Must fit within 25 users and Starter limits |\n\n### Contract Terms\n\n- Starter and Professional: monthly or annual.\n- Enterprise: 1, 2 or 3 years; annual billing in advance.\n- Auto-renewal applies unless either party gives 60 days' written notice.\n\n### Sandbox and Non-Production Use\n\nDevelopment and Staging environments do not consume additional licenses. Workflow runs in non-production environments do not count toward allowances, up to 10% of the production allowance.\n\n### Partner and Agency Use\n\nConsulting partners building flows on behalf of a customer use the customer's licenses or a free Partner Builder seat (maximum 3 per tenant, Enterprise only).\n\n### Common Licensing Questions\n\n- **Do approvers need a license?** No — approve/reject via email, Slack or Teams is free.\n- **Do AI agents need a license?** No. Agents are limited by the plan's active-agent count and agent-action allowance, not user licenses.\n- **Can we share one login among a team?** No. Shared logins breach the license terms and break audit trails.\n\n## Key Facts\n\n- Licensed per named Full User per month, plus usage allowances.\n- Approvers and external participants are free and unlimited.\n- Viewers are free up to 3× the Full User count (Professional and Enterprise).\n- Enterprise has a 100-user minimum and quarterly true-ups.\n- Downgrades happen only at renewal.\n\n## Related Documents\n\n- pricing_guide_v3.md\n- enterprise_pricing.md\n- pricing_faq.md\n- feature_matrix.md\n\n## Retrieval Notes\n\nRetrieve when the question is about who needs a license, license counts, viewers/approvers, service accounts, true-ups, adding or removing users, or upgrade/downgrade rules. For actual prices retrieve `pricing_guide_v3.md`."},{"document_id":"NEXA-019","title":"Pricing FAQ","document_type":"FAQ","main_category":"Pricing & Licensing","secondary_topics":["Free trial and pilot","Licensing (approvers and viewers)","Renewal increases","Legacy v2 pricing (outdated)"],"rag_tags":["pricing-questions","faq","free-trial","price-change","v2-pricing","legacy-pricing","historical-prices","currency","taxes","payment-methods","overage","price-increase"],"version":"2.4","status":"Current","last_updated":"2026-07-03","authoritative":"No","supersedes":"None","contains_outdated_information":"Yes","related_documents":["20_pricing_guide_v3.md","09_discount_policy.md","16_licensing_model.md","11_enterprise_pricing.md"],"summary":"Answers common pricing, billing, trial, currency and plan-choice questions. It also contains a clearly marked historical section with outdated Pricing Guide v2 prices kept for legacy contracts.","key_topics":["14-day free trial on Starter and Professional; paid 60-day pilot for Enterprise.","Billing in USD, EUR, GBP, INR and AUD; taxes excluded.","Annual billing ~17% cheaper; multi-year adds 5% or 10%.","v2 prices (Enterprise $85, Professional $49, Starter $25) are OUTDATED.","`pricing_guide_v3.md` is the authoritative current price list."],"use_when":"Someone asks a common pricing question (trials, currencies, payment methods, price changes) or asks about old/legacy prices from Pricing Guide v2. Not authoritative for current list prices (use 20_pricing_guide_v3.md); its v2 price section is outdated and must not be quoted.","file":"knowledge_base/02_pricing_and_licensing/19_pricing_faq.md","filename":"19_pricing_faq.md","folder":"02_pricing_and_licensing","retrieval_notes":"Retrieve for trials, currencies, payment methods, taxes, renewal increases and legacy/v2 price questions. **Do not use this file as the source of current list prices** — if a question asks \"what does Enterprise cost\", retrieve `pricing_guide_v3.md` and treat the v2 figures here as historical only. This file is a deliberate version-control test for the retrieval agent.","body":"# Pricing FAQ\n\n## Metadata\n\n- Category: Pricing\n- Document Type: FAQ\n- Version: 2.4\n- Status: Current FAQ — contains a HISTORICAL section with outdated v2 prices\n- Last Updated: 2026-07-03\n- Authoritative: No — for list prices always use pricing_guide_v3.md\n- Keywords: pricing questions, FAQ, free trial, price change, v2 pricing, legacy pricing, historical prices, currency, taxes, payment methods, overage, price increase\n- Use When: Someone asks a common pricing question (trials, currencies, payment methods, price changes) or asks about old/legacy prices from Pricing Guide v2.\n\n## Summary\n\nThis FAQ answers common customer and seller questions about NexaFlow pricing, billing and plan changes. It also keeps a clearly marked historical record of Pricing Guide v2 (2025) prices so staff can understand legacy contracts. The historical prices are **outdated**. The current authoritative price list is `pricing_guide_v3.md`, effective 1 July 2026.\n\n## Main Content\n\n### General Questions\n\n**Q: Is there a free trial?**\nYes. Starter and Professional offer a 14-day free trial with up to 5 users and 1,000 workflow runs. Enterprise does not have a self-serve trial; instead, a paid 60-day pilot can be arranged and credited against the first-year subscription.\n\n**Q: Which currencies do you bill in?**\nUSD, EUR, GBP, INR and AUD. Non-USD prices are set by region each July and are not recalculated daily based on exchange rates.\n\n**Q: What payment methods are accepted?**\nCredit card for Starter and Professional monthly plans. Annual plans and all Enterprise contracts can pay by bank transfer or ACH with Net 30 terms.\n\n**Q: Are taxes included?**\nNo. Prices exclude VAT, GST and sales tax, which are added based on the billing address.\n\n**Q: What happens if we exceed our workflow run allowance?**\nYou receive alerts at 80% and 100%. Professional and Enterprise continue running and are billed overage ($6 and $4 per extra 1,000 runs respectively). Starter flows pause at 120% of the allowance.\n\n**Q: Can we switch from monthly to annual billing?**\nYes, at any time. The annual price (about 17% lower) starts from the switch date.\n\n**Q: Is there a discount for paying annually?**\nYes. Annual billing is roughly 17% cheaper than monthly billing. 2-year and 3-year terms receive an additional 5% and 10% respectively. See `discount_policy.md`.\n\n**Q: Do approvers or viewers need to pay?**\nApprovers are free. Viewers are free up to three times the number of Full Users on Professional and Enterprise. See `licensing_model.md`.\n\n**Q: How much does implementation cost?**\nStarter is self-serve and free. Professional Quick Start is $5,000 (optional). Enterprise implementation is $15,000 for the standard 4–6 week program or $35,000 for complex 8–12 week projects.\n\n**Q: Will our price go up at renewal?**\nEnterprise renewal increases are capped at 7% per year (5% on some 3-year contracts). Starter and Professional renew at the list price in effect at renewal.\n\n**Q: Why did prices change in July 2026?**\nPricing Guide v3 added more workflow runs, unlimited AI agents on Enterprise and Agent Studio document extraction on Professional. Prices were raised to reflect the expanded AI capabilities, while included usage roughly doubled.\n\n### Plan-Choice Questions\n\n**Q: We have 80 users but need SCIM. Which plan?**\nSCIM is Enterprise-only, so Enterprise is required, and the 100-user minimum applies.\n\n**Q: We have 40 users and need SSO. Which plan?**\nProfessional includes SSO.\n\n---\n\n### HISTORICAL — Pricing Guide v2 (OUTDATED — DO NOT QUOTE)\n\n> **Warning:** The prices in this section come from **Pricing Guide v2**, effective 15 January 2025 and **superseded on 1 July 2026** by `pricing_guide_v3.md`. They are kept only to help staff understand legacy contracts signed before July 2026. **Never use these figures for new quotes or to answer current pricing questions.**\n\n| Plan (v2, 2025) | Annual Billing (per user / month) | Monthly Billing | Included Runs / Month |\n|---|---|---|---|\n| Starter | $25 | $30 | 2,500 |\n| Professional | $49 | $59 | 25,000 |\n| Enterprise | $85 (list) | Not available | 250,000 |\n\nOther v2 terms that no longer apply:\n- Enterprise implementation was a flat $12,000 regardless of complexity.\n- Annual billing discount was described as \"15%\".\n- Enterprise minimum was 50 users.\n- Professional included 5 AI agents; Enterprise included 25.\n\n**What happens to v2 customers?**\nCustomers who signed under v2 keep their v2 price until their next renewal date. At renewal they move to v3 pricing, with the Enterprise renewal cap limiting the increase in the first renewal year.\n\n---\n\n## Key Facts\n\n- 14-day free trial on Starter and Professional; paid 60-day pilot for Enterprise.\n- Billing in USD, EUR, GBP, INR and AUD; taxes excluded.\n- Annual billing ~17% cheaper; multi-year adds 5% or 10%.\n- v2 prices (Enterprise $85, Professional $49, Starter $25) are OUTDATED.\n- `pricing_guide_v3.md` is the authoritative current price list.\n\n## Related Documents\n\n- pricing_guide_v3.md\n- discount_policy.md\n- licensing_model.md\n- enterprise_pricing.md\n\n## Retrieval Notes\n\nRetrieve for trials, currencies, payment methods, taxes, renewal increases and legacy/v2 price questions. **Do not use this file as the source of current list prices** — if a question asks \"what does Enterprise cost\", retrieve `pricing_guide_v3.md` and treat the v2 figures here as historical only. This file is a deliberate version-control test for the retrieval agent."},{"document_id":"NEXA-020","title":"Pricing Guide v3","document_type":"Price List","main_category":"Pricing & Licensing","secondary_topics":["Usage allowances and overage","Implementation fees","Add-ons","Billing terms"],"rag_tags":["pricing","price-list","starter-plan","professional-plan","enterprise-plan","per-user","annual-billing","monthly-billing","annual-discount","usage-limits","workflow-runs","overage"],"version":"3.0","status":"Current","last_updated":"2026-07-01","authoritative":"Yes","supersedes":"Pricing Guide v2 (not in collection)","contains_outdated_information":"No","related_documents":["11_enterprise_pricing.md","09_discount_policy.md","16_licensing_model.md","19_pricing_faq.md"],"summary":"The current and authoritative NexaFlow price list, effective 1 July 2026, covering plan prices, usage allowances, overage rates, implementation fees, add-ons, worked examples and billing terms. It supersedes Pricing Guide v2.","key_topics":["Starter $29, Professional $59, Enterprise from $95 per user/month on annual billing.","Monthly billing: Starter $35, Professional $71; Enterprise is annual-only.","Annual billing saves ~17%; multi-year adds 5% (2-year) or 10% (3-year).","Enterprise implementation: $15,000 (4–6 weeks) or $35,000 complex (8–12 weeks).","This document supersedes Pricing Guide v2 in all cases."],"use_when":"Someone asks what a plan costs, what is included in the price, annual vs monthly billing, usage limits, overage or implementation fees. Single source of truth for current list prices; supersedes Pricing Guide v2 (not in collection).","file":"knowledge_base/02_pricing_and_licensing/20_pricing_guide_v3.md","filename":"20_pricing_guide_v3.md","folder":"02_pricing_and_licensing","retrieval_notes":"Always retrieve this file for any question about prices, plan costs, annual vs monthly billing, usage allowances, overage or implementation fees. If another document shows a different price, this document wins. Pair with `enterprise_pricing.md` for Enterprise negotiation and with `discount_policy.md` for discount approval rules.","body":"# Pricing Guide v3\n\n## Metadata\n\n- Category: Pricing\n- Document Type: Official Price List\n- Version: 3.0\n- Status: Current — supersedes Pricing Guide v2\n- Last Updated: 2026-07-01\n- Authoritative: Yes — this is the single source of truth for NexaFlow list prices\n- Keywords: pricing, price list, Starter plan, Professional plan, Enterprise plan, per user, annual billing, monthly billing, annual discount, usage limits, workflow runs, overage, implementation fee, add-ons\n- Use When: Someone asks what a plan costs, what is included in the price, annual vs monthly billing, usage limits, overage or implementation fees.\n\n## Summary\n\nPricing Guide v3 is the current and authoritative NexaFlow price list, effective 1 July 2026. It defines three plans — Starter, Professional and Enterprise — priced per user per month, with a discount for annual billing. It also lists usage allowances, overage rates, implementation fees and add-ons. Any price that differs from this document (for example, figures from Pricing Guide v2) is outdated.\n\n## Main Content\n\n### Plan Prices (USD)\n\n| Plan | Annual Billing (per user / month) | Monthly Billing (per user / month) | User Range |\n|---|---|---|---|\n| Starter | $29 | $35 | 5–25 users |\n| Professional | $59 | $71 | 10–250 users |\n| Enterprise | From $95 (custom quote) | Not available | 100+ users |\n\n- **Annual billing saves roughly 17%** compared with monthly billing (equivalent to two months free).\n- Enterprise is sold on annual or multi-year contracts only. Minimum Enterprise contract: 100 users, which is **$114,000 per year** at list price.\n- Multi-year commitments receive additional discounts: **5% for a 2-year term and 10% for a 3-year term**, applied on top of annual pricing. Rules are in `discount_policy.md`.\n\n### Usage Allowances\n\n| Allowance | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Workflow runs / month | 5,000 | 50,000 | 500,000 |\n| Active AI agents | 2 | 15 | Unlimited |\n| AI agent actions / month | 1,000 | 20,000 | 250,000 |\n| Active workflows | 20 | 200 | Unlimited |\n| Storage | 10 GB | 100 GB | 1 TB |\n\nUnused runs do not roll over to the next month.\n\n### Overage Rates\n\n| Item | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Additional 1,000 workflow runs | $10 | $6 | $4 |\n| Additional 1,000 AI agent actions | $20 | $12 | $8 |\n| Additional 100 GB storage | $25 | $20 | $15 |\n\nCustomers receive an alert at 80% and 100% of their allowance. Starter workflows pause at 120% of the allowance until the customer upgrades or buys a run pack; Professional and Enterprise continue running and are billed overage monthly in arrears.\n\n### Implementation and Services Fees\n\n| Package | Price | Applies To | Scope |\n|---|---|---|---|\n| Self-serve onboarding | Free | Starter | Online academy and templates |\n| Quick Start | $5,000 (optional) | Professional | 2-week guided setup, up to 3 integrations |\n| Enterprise Standard Implementation | $15,000 | Enterprise | 4–6 week guided implementation, up to 5 integrations, up to 1 million migrated records |\n| Enterprise Complex Implementation | $35,000 | Enterprise | 8–12 week implementation for more than 5 integrations, large data migrations, single-tenant or extended security review |\n| Additional solution architect time | $250 / hour | Professional, Enterprise | Custom flows or advanced agents |\n\nImplementation fees are one-time, invoiced at contract signature, and are not discountable beyond the limits in `discount_policy.md`. Timeline details are in the Implementation documents (`implementation_timeline.md`).\n\n### Add-Ons\n\n| Add-On | Price |\n|---|---|\n| Premium connector pack (SAP, Oracle Fusion, Workday) — Professional only | $1,000 / month |\n| Single-tenant deployment — Enterprise | +20% of annual subscription |\n| Extended audit log retention (up to 7 years) — Enterprise | $6,000 / year |\n| Additional sandbox environment | $500 / month |\n| Premium training (custom on-site workshop) | $4,000 per day |\n\n### Worked Examples\n\n**Professional, 60 users, annual billing:** 60 × $59 × 12 = **$42,480 per year**. Optional Quick Start: $5,000.\n\n**Enterprise, 250 users, annual billing at list:** 250 × $95 × 12 = **$285,000 per year**, plus $15,000 standard implementation. A 3-year term reduces the subscription by 10% to $256,500 per year.\n\n### Billing Terms\n\n- Payment terms: annual in advance; Net 30.\n- Prices exclude applicable taxes.\n- Users can be added at any time and are prorated to the renewal date.\n- Renewal price increases are capped at 7% per year for Enterprise contracts.\n\n## Key Facts\n\n- Starter $29, Professional $59, Enterprise from $95 per user/month on annual billing.\n- Monthly billing: Starter $35, Professional $71; Enterprise is annual-only.\n- Annual billing saves ~17%; multi-year adds 5% (2-year) or 10% (3-year).\n- Enterprise implementation: $15,000 (4–6 weeks) or $35,000 complex (8–12 weeks).\n- This document supersedes Pricing Guide v2 in all cases.\n\n## Related Documents\n\n- enterprise_pricing.md\n- discount_policy.md\n- licensing_model.md\n- pricing_faq.md\n\n## Retrieval Notes\n\nAlways retrieve this file for any question about prices, plan costs, annual vs monthly billing, usage allowances, overage or implementation fees. If another document shows a different price, this document wins. Pair with `enterprise_pricing.md` for Enterprise negotiation and with `discount_policy.md` for discount approval rules."},{"document_id":"NEXA-007","title":"Data Migration Process","document_type":"Guide","main_category":"Implementation","secondary_topics":["Data quality and reconciliation","Implementation timeline risks","Migration security and PHI handling"],"rag_tags":["data-migration","data-import","legacy-data","data-mapping","data-cleansing","test-load","reconciliation","cutover","csv-import","records","migration-tool","data-quality"],"version":"2.2","status":"Current","last_updated":"2026-06-30","authoritative":"Yes","supersedes":"None","contains_outdated_information":"No","related_documents":["18_onboarding_guide.md","14_implementation_timeline.md","12_enterprise_setup.md","15_integration_guide.md"],"summary":"Describes Phase 5 of onboarding: what data is migrated into NexaFlow, the six-step migration method, package scope, data quality acceptance criteria, roles, security, rollback and timeline risks. Migrations above 1 million records or from multiple sources move a project to the complex 8–12 week track.","key_topics":["Data migration is Phase 5, typically weeks 3–4 of a standard enterprise implementation.","Standard package covers up to 1 million records from 1–2 sources.","Six steps: inventory, mapping, extraction/cleansing, test load, final load, validation.","Random sample accuracy must be at least 99.5%; record counts must match 100%.","Large or multi-source migrations push onboarding to 8–12 weeks."],"use_when":"Someone asks how data is moved into NexaFlow, what data can be migrated, how long migration takes, or how data quality is validated.","file":"knowledge_base/03_implementation/07_data_migration_process.md","filename":"07_data_migration_process.md","folder":"03_implementation","retrieval_notes":"Retrieve for questions about moving data into NexaFlow, legacy data, CSV import, data mapping, data quality checks, cutover or migration timeline risks. For a general enterprise onboarding process question, this file is supporting detail; the primary files are `onboarding_guide.md`, `implementation_timeline.md` and `enterprise_setup.md`.","body":"# Data Migration Process\n\n## Metadata\n\n- Category: Implementation\n- Document Type: Process Guide\n- Version: 2.2\n- Status: Current\n- Last Updated: 2026-06-30\n- Authoritative: Yes\n- Keywords: data migration, data import, legacy data, data mapping, data cleansing, test load, reconciliation, cutover, CSV import, records, migration tool, data quality, rollback\n- Use When: Someone asks how data is moved into NexaFlow, what data can be migrated, how long migration takes, or how data quality is validated.\n\n## Summary\n\nData migration is Phase 5 of the NexaFlow onboarding process and usually runs in weeks 3–4 of a standard 4–6 week enterprise implementation. This document explains what data is typically migrated, the six-step migration method, roles, data quality rules, validation and cutover. Migrations above 1 million records or from multiple legacy sources usually place a project on the complex 8–12 week track.\n\n## Main Content\n\n### What Gets Migrated\n\nNexaFlow orchestrates work across systems, so most business records stay in their systems of record (ERP, CRM, HRIS). Migration usually covers:\n\n| Data Type | Examples |\n|---|---|\n| In-flight work items | Open purchase requests, pending approvals, active cases, open onboarding tasks |\n| Reference data | Supplier lists, cost centres, approval hierarchies, product catalogues, SLA rules |\n| Historical run data | Past 12–24 months of process history for dashboards and AI agent context |\n| Documents | Templates, policies and knowledge sources for AI agents |\n| Workflow definitions | Rules from legacy tools (for example old BPM or RPA scripts), rebuilt as flows |\n\nLegacy workflow logic is **rebuilt**, not automatically converted.\n\n### Migration Scope by Package\n\n| Package | Records Included | Sources | Migration Cycles |\n|---|---|---|---|\n| Enterprise Standard | Up to 1 million | 1–2 sources | 1 test load + 1 final load |\n| Enterprise Complex | Above 1 million | Multiple legacy sources | Up to 3 test loads + final load |\n| Professional Quick Start | Up to 50,000 | 1 source (CSV) | 1 load |\n\n### The Six-Step Migration Method\n\n**Step 1 — Inventory and Ownership (Week 1, during discovery)**\nList every data set, its source system, volume, owner and whether it is needed at go-live. Data without a named owner is excluded until one is assigned.\n\n**Step 2 — Mapping (Weeks 2–3)**\nMap source fields to NexaFlow objects in a mapping workbook: field name, type, transformation rule, default value and validation rule. The customer data owner signs off the mapping.\n\n**Step 3 — Extraction and Cleansing (Week 3)**\nThe customer extracts data (CSV, database export or API). NexaFlow's migration tool profiles the data and reports duplicates, missing mandatory fields, invalid dates and broken references. The customer fixes source data or approves transformation rules.\n\n**Step 4 — Test Load (Week 3)**\nA test load into Staging using full or representative data. Reconciliation compares record counts, sums of key numeric fields and a 5% rand
