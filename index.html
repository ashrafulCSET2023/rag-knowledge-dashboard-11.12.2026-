an changes. It also keeps a clearly marked historical record of Pricing Guide v2 (2025) prices so staff can understand legacy contracts. The historical prices are **outdated**. The current authoritative price list is `pricing_guide_v3.md`, effective 1 July 2026.","outdated":false},{"doc":"NEXA-019","heading":"Key Facts","text":"- 14-day free trial on Starter and Professional; paid 60-day pilot for Enterprise.\n- Billing in USD, EUR, GBP, INR and AUD; taxes excluded.\n- Annual billing ~17% cheaper; multi-year adds 5% or 10%.\n- v2 prices (Enterprise $85, Professional $49, Starter $25) are OUTDATED.\n- `pricing_guide_v3.md` is the authoritative current price list.","outdated":false},{"doc":"NEXA-019","heading":"General Questions › Is there a free trial?","text":"**Is there a free trial?**\nYes. Starter and Professional offer a 14-day free trial with up to 5 users and 1,000 workflow runs. Enterprise does not have a self-serve trial; instead, a paid 60-day pilot can be arranged and credited against the first-year subscription.","outdated":false},{"doc":"NEXA-019","heading":"General Questions › Which currencies do you bill in?","text":"**Which currencies do you bill in?**\nUSD, EUR, GBP, INR and AUD. Non-USD prices are set by region each July and are not recalculated daily based on exchange rates.","outdated":false},{"doc":"NEXA-019","heading":"General Questions › What payment methods are accepted?","text":"**What payment methods are accepted?**\nCredit card for Starter and Professional monthly plans. Annual plans and all Enterprise contracts can pay by bank transfer or ACH with Net 30 terms.","outdated":false},{"doc":"NEXA-019","heading":"General Questions › Are taxes included?","text":"**Are taxes included?**\nNo. Prices exclude VAT, GST and sales tax, which are added based on the billing address.","outdated":false},{"doc":"NEXA-019","heading":"General Questions › What happens if we exceed our workflow run allowance?","text":"**What happens if we exceed our workflow run allowance?**\nYou receive alerts at 80% and 100%. Professional and Enterprise continue running and are billed overage ($6 and $4 per extra 1,000 runs respectively). Starter flows pause at 120% of the allowance.","outdated":false},{"doc":"NEXA-019","heading":"General Questions › Can we switch from monthly to annual billing?","text":"**Can we switch from monthly to annual billing?**\nYes, at any time. The annual price (about 17% lower) starts from the switch date.","outdated":false},{"doc":"NEXA-019","heading":"General Questions › Is there a discount for paying annually?","text":"**Is there a discount for paying annually?**\nYes. Annual billing is roughly 17% cheaper than monthly billing. 2-year and 3-year terms receive an additional 5% and 10% respectively. See `discount_policy.md`.","outdated":false},{"doc":"NEXA-019","heading":"General Questions › Do approvers or viewers need to pay?","text":"**Do approvers or viewers need to pay?**\nApprovers are free. Viewers are free up to three times the number of Full Users on Professional and Enterprise. See `licensing_model.md`.","outdated":false},{"doc":"NEXA-019","heading":"General Questions › How much does implementation cost?","text":"**How much does implementation cost?**\nStarter is self-serve and free. Professional Quick Start is $5,000 (optional). Enterprise implementation is $15,000 for the standard 4–6 week program or $35,000 for complex 8–12 week projects.","outdated":false},{"doc":"NEXA-019","heading":"General Questions › Will our price go up at renewal?","text":"**Will our price go up at renewal?**\nEnterprise renewal increases are capped at 7% per year (5% on some 3-year contracts). Starter and Professional renew at the list price in effect at renewal.","outdated":false},{"doc":"NEXA-019","heading":"General Questions › Why did prices change in July 2026?","text":"**Why did prices change in July 2026?**\nPricing Guide v3 added more workflow runs, unlimited AI agents on Enterprise and Agent Studio document extraction on Professional. Prices were raised to reflect the expanded AI capabilities, while included usage roughly doubled.","outdated":false},{"doc":"NEXA-019","heading":"Plan-Choice Questions","text":"**Q: We have 80 users but need SCIM. Which plan?**\nSCIM is Enterprise-only, so Enterprise is required, and the 100-user minimum applies.\n\n**Q: We have 40 users and need SSO. Which plan?**\nProfessional includes SSO.","outdated":false},{"doc":"NEXA-019","heading":"HISTORICAL — Pricing Guide v2 (OUTDATED — DO NOT QUOTE)","text":"> **Warning:** The prices in this section come from **Pricing Guide v2**, effective 15 January 2025 and **superseded on 1 July 2026** by `pricing_guide_v3.md`. They are kept only to help staff understand legacy contracts signed before July 2026. **Never use these figures for new quotes or to answer current pricing questions.**\n\n| Plan (v2, 2025) | Annual Billing (per user / month) | Monthly Billing | Included Runs / Month |\n|---|---|---|---|\n| Starter | $25 | $30 | 2,500 |\n| Professional | $49 | $59 | 25,000 |\n| Enterprise | $85 (list) | Not available | 250,000 |\n\nOther v2 terms that no longer apply:\n- Enterprise implementation was a flat $12,000 regardless of complexity.\n- Annual billing discount was described as \"15%\".\n- Enterprise minimum was 50 users.\n- Professional included 5 AI agents; Enterprise included 25.\n\n**What happens to v2 customers?**\nCustomers who signed under v2 keep their v2 price until their next renewal date. At renewal they move to v3 pricing, with the Enterprise renewal cap limiting the increase in the first renewal year.","outdated":true},{"doc":"NEXA-020","heading":"Summary","text":"Pricing Guide v3 is the current and authoritative NexaFlow price list, effective 1 July 2026. It defines three plans — Starter, Professional and Enterprise — priced per user per month, with a discount for annual billing. It also lists usage allowances, overage rates, implementation fees and add-ons. Any price that differs from this document (for example, figures from Pricing Guide v2) is outdated.","outdated":false},{"doc":"NEXA-020","heading":"Key Facts","text":"- Starter $29, Professional $59, Enterprise from $95 per user/month on annual billing.\n- Monthly billing: Starter $35, Professional $71; Enterprise is annual-only.\n- Annual billing saves ~17%; multi-year adds 5% (2-year) or 10% (3-year).\n- Enterprise implementation: $15,000 (4–6 weeks) or $35,000 complex (8–12 weeks).\n- This document supersedes Pricing Guide v2 in all cases.","outdated":false},{"doc":"NEXA-020","heading":"Plan Prices (USD)","text":"| Plan | Annual Billing (per user / month) | Monthly Billing (per user / month) | User Range |\n|---|---|---|---|\n| Starter | $29 | $35 | 5–25 users |\n| Professional | $59 | $71 | 10–250 users |\n| Enterprise | From $95 (custom quote) | Not available | 100+ users |\n\n- **Annual billing saves roughly 17%** compared with monthly billing (equivalent to two months free).\n- Enterprise is sold on annual or multi-year contracts only. Minimum Enterprise contract: 100 users, which is **$114,000 per year** at list price.\n- Multi-year commitments receive additional discounts: **5% for a 2-year term and 10% for a 3-year term**, applied on top of annual pricing. Rules are in `discount_policy.md`.","outdated":false},{"doc":"NEXA-020","heading":"Usage Allowances","text":"| Allowance | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Workflow runs / month | 5,000 | 50,000 | 500,000 |\n| Active AI agents | 2 | 15 | Unlimited |\n| AI agent actions / month | 1,000 | 20,000 | 250,000 |\n| Active workflows | 20 | 200 | Unlimited |\n| Storage | 10 GB | 100 GB | 1 TB |\n\nUnused runs do not roll over to the next month.","outdated":false},{"doc":"NEXA-020","heading":"Overage Rates","text":"| Item | Starter | Professional | Enterprise |\n|---|---|---|---|\n| Additional 1,000 workflow runs | $10 | $6 | $4 |\n| Additional 1,000 AI agent actions | $20 | $12 | $8 |\n| Additional 100 GB storage | $25 | $20 | $15 |\n\nCustomers receive an alert at 80% and 100% of their allowance. Starter workflows pause at 120% of the allowance until the customer upgrades or buys a run pack; Professional and Enterprise continue running and are billed overage monthly in arrears.","outdated":false},{"doc":"NEXA-020","heading":"Implementation and Services Fees","text":"| Package | Price | Applies To | Scope |\n|---|---|---|---|\n| Self-serve onboarding | Free | Starter | Online academy and templates |\n| Quick Start | $5,000 (optional) | Professional | 2-week guided setup, up to 3 integrations |\n| Enterprise Standard Implementation | $15,000 | Enterprise | 4–6 week guided implementation, up to 5 integrations, up to 1 million migrated records |\n| Enterprise Complex Implementation | $35,000 | Enterprise | 8–12 week implementation for more than 5 integrations, large data migrations, single-tenant or extended security review |\n| Additional solution architect time | $250 / hour | Professional, Enterprise | Custom flows or advanced agents |\n\nImplementation fees are one-time, invoiced at contract signature, and are not discountable beyond the limits in `discount_policy.md`. Timeline details are in the Implementation documents (`implementation_timeline.md`).","outdated":false},{"doc":"NEXA-020","heading":"Add-Ons","text":"| Add-On | Price |\n|---|---|\n| Premium connector pack (SAP, Oracle Fusion, Workday) — Professional only | $1,000 / month |\n| Single-tenant deployment — Enterprise | +20% of annual subscription |\n| Extended audit log retention (up to 7 years) — Enterprise | $6,000 / year |\n| Additional sandbox environment | $500 / month |\n| Premium training (custom on-site workshop) | $4,000 per day |","outdated":false},{"doc":"NEXA-020","heading":"Worked Examples","text":"**Professional, 60 users, annual billing:** 60 × $59 × 12 = **$42,480 per year**. Optional Quick Start: $5,000.\n\n**Enterprise, 250 users, annual billing at list:** 250 × $95 × 12 = **$285,000 per year**, plus $15,000 standard implementation. A 3-year term reduces the subscription by 10% to $256,500 per year.","outdated":false},{"doc":"NEXA-020","heading":"Billing Terms","text":"- Payment terms: annual in advance; Net 30.\n- Prices exclude applicable taxes.\n- Users can be added at any time and are prorated to the renewal date.\n- Renewal price increases are capped at 7% per year for Enterprise contracts.","outdated":false},{"doc":"NEXA-007","heading":"Summary","text":"Data migration is Phase 5 of the NexaFlow onboarding process and usually runs in weeks 3–4 of a standard 4–6 week enterprise implementation. This document explains what data is typically migrated, the six-step migration method, roles, data quality rules, validation and cutover. Migrations above 1 million records or from multiple legacy sources usually place a project on the complex 8–12 week track.","outdated":false},{"doc":"NEXA-007","heading":"Key Facts","text":"- Data migration is Phase 5, typically weeks 3–4 of a standard enterprise implementation.\n- Standard package covers up to 1 million records from 1–2 sources.\n- Six steps: inventory, mapping, extraction/cleansing, test load, final load, validation.\n- Random sample accuracy must be at least 99.5%; record counts must match 100%.\n- Large or multi-source migrations push onboarding to 8–12 weeks.","outdated":false},{"doc":"NEXA-007","heading":"What Gets Migrated","text":"NexaFlow orchestrates work across systems, so most business records stay in their systems of record (ERP, CRM, HRIS). Migration usually covers:\n\n| Data Type | Examples |\n|---|---|\n| In-flight work items | Open purchase requests, pending approvals, active cases, open onboarding tasks |\n| Reference data | Supplier lists, cost centres, approval hierarchies, product catalogues, SLA rules |\n| Historical run data | Past 12–24 months of process history for dashboards and AI agent context |\n| Documents | Templates, policies and knowledge sources for AI agents |\n| Workflow definitions | Rules from legacy tools (for example old BPM or RPA scripts), rebuilt as flows |\n\nLegacy workflow logic is **rebuilt**, not automatically converted.","outdated":false},{"doc":"NEXA-007","heading":"Migration Scope by Package","text":"| Package | Records Included | Sources | Migration Cycles |\n|---|---|---|---|\n| Enterprise Standard | Up to 1 million | 1–2 sources | 1 test load + 1 final load |\n| Enterprise Complex | Above 1 million | Multiple legacy sources | Up to 3 test loads + final load |\n| Professional Quick Start | Up to 50,000 | 1 source (CSV) | 1 load |","outdated":false},{"doc":"NEXA-007","heading":"The Six-Step Migration Method","text":"**Step 1 — Inventory and Ownership (Week 1, during discovery)**\nList every data set, its source system, volume, owner and whether it is needed at go-live. Data without a named owner is excluded until one is assigned.\n\n**Step 2 — Mapping (Weeks 2–3)**\nMap source fields to NexaFlow objects in a mapping workbook: field name, type, transformation rule, default value and validation rule. The customer data owner signs off the mapping.\n\n**Step 3 — Extraction and Cleansing (Week 3)**\nThe customer extracts data (CSV, database export or API). NexaFlow's migration tool profiles the data and reports duplicates, missing mandatory fields, invalid dates and broken references. The customer fixes source data or approves transformation rules.\n\n**Step 4 — Test Load (Week 3)**\nA test load into Staging using full or representative data. Reconciliation compares record counts, sums of key numeric fields and a 5% random sample checked by business users.\n\n**Step 5 — Final Load (Week 4)**\nAfter test load sign-off, the final load runs, usually during a planned window before go-live. In-flight work items are frozen in the legacy system for a short cutover period (typically 24–48 hours).\n\n**Step 6 — Validation and Sign-Off (Week 4)**\nThe customer confirms reconciliation results. Migration must be signed off before UAT is completed and before the go/no-go meeting.","outdated":false},{"doc":"NEXA-007","heading":"Data Quality Acceptance Criteria","text":"| Check | Threshold |\n|---|---|\n| Record count match | 100% |\n| Mandatory fields populated | 100% |\n| Key numeric totals (e.g., invoice amounts) | Exact match |\n| Random sample accuracy | At least 99.5% |\n| Duplicate records | 0 after cleansing |","outdated":false},{"doc":"NEXA-007","heading":"Roles","text":"| Role | Responsibility |\n|---|---|\n| NexaFlow Integration Engineer | Migration tooling, mapping workbook, test and final loads |\n| Customer Data Owner | Approves mapping, fixes source data, signs off reconciliation |\n| Customer IT | Provides extracts and database access |\n| Business Users | Validate random samples |","outdated":false},{"doc":"NEXA-007","heading":"Security During Migration","text":"- Files are transferred via encrypted SFTP or direct connector, never by email.\n- Staging data is encrypted at rest (AES-256) and access is logged.\n- Temporary migration files are deleted within 14 days of sign-off.\n- For healthcare customers, PHI is migrated only after the BAA is signed.","outdated":false},{"doc":"NEXA-007","heading":"Rollback","text":"If the final load fails reconciliation, the load is rolled back, the legacy system remains the system of record, and the go-live date is re-planned. Rollback procedures are rehearsed during the test load.","outdated":false},{"doc":"NEXA-007","heading":"Timeline Risks","text":"| Risk | Impact |\n|---|---|\n| Poor source data quality | +1 to +3 weeks |\n| Extracts delivered late | Day-for-day delay |\n| More than 1M records or multiple sources | Project classified as complex (8–12 weeks) |\n| Mapping changes after sign-off | Additional test load cycle (+1 week) |","outdated":false},{"doc":"NEXA-012","heading":"Summary","text":"This guide covers the Enterprise-specific technical setup that happens during onboarding, mainly in Phase 3 (Environment Setup) and Phase 4 (Integration Configuration) of the nine-phase process in `onboarding_guide.md`. It explains tenant provisioning, SSO and SCIM, workspace and role design, security review, Relay installation and the go-live checklist. In a standard 4–6 week implementation, environment setup is completed in week 2; single-tenant deployments, strict data residency or extended security reviews move projects toward the 8–12 week track described in `implementation_timeline.md`.","outdated":false},{"doc":"NEXA-012","heading":"Key Facts","text":"- Security review should start at contract signature; standard reviews take 1–2 weeks.\n- Environment setup (tenant, SSO, SCIM, roles) happens in week 2 of a standard implementation.\n- Single-tenant deployment adds about 1 week; Relay setup commonly adds 1–2 weeks.\n- IdP groups map to NexaFlow roles and workspaces via SCIM.\n- Standard enterprise onboarding is 4–6 weeks; complex setups push it to 8–12 weeks.","outdated":false},{"doc":"NEXA-012","heading":"Step 1: Pre-Kickoff Security Review (Starts at Signature)","text":"Enterprise customers almost always run a vendor security review. To avoid delaying the project:\n\n1. NexaFlow shares the SOC 2 Type II report, ISO 27001 certificate and CAIQ questionnaire via the Trust Center on the day of signature.\n2. The customer security team submits additional questions within 5 business days.\n3. Standard reviews complete in 1–2 weeks, running in parallel with discovery and design.\n4. Reviews requiring on-site assessments, custom penetration testing or HIPAA BAA negotiation take 3–6 weeks and classify the project as complex.","outdated":false},{"doc":"NEXA-012","heading":"Step 2: Tenant Provisioning (Week 2)","text":"| Decision | Options | Timeline Impact |\n|---|---|---|\n| Deployment | Multi-tenant (default) or single-tenant | Single-tenant adds ~1 week |\n| Region | US (Virginia), EU (Frankfurt), APAC (Sydney) | None if chosen before kickoff |\n| Environments | Development, Staging, Production | Included |\n| Encryption keys | NexaFlow-managed or customer-managed (AWS KMS) | CMK adds 2–3 days of customer IT work |\n\nThe region cannot be changed after data is loaded without a migration project.","outdated":false},{"doc":"NEXA-012","heading":"Step 3: Single Sign-On (Week 2)","text":"1. Customer identity admin creates a SAML 2.0 or OIDC application in Okta, Microsoft Entra ID, Ping or Google Workspace.\n2. NexaFlow provides the ACS URL and entity ID; the customer returns metadata.\n3. Test with 3–5 pilot users in Development.\n4. Enforce SSO for all users and disable password login (break-glass admin account retained).\n\nTypical effort: 2–5 business days of the customer identity team's time.","outdated":false},{"doc":"NEXA-012","heading":"Step 4: SCIM Provisioning and Role Mapping (Week 2)","text":"- Enable SCIM 2.0 from the identity provider to automatically create, update and deactivate users.\n- Map identity provider groups to NexaFlow roles, for example:\n\n| IdP Group | NexaFlow Role | Workspace |\n|---|---|---|\n| NF-Platform-Admins | Admin | All |\n| NF-Finance-Builders | Builder | Finance |\n| NF-Finance-AP-Team | Operator | Finance |\n| NF-Leadership | Viewer | All |\n\n- Create custom roles if needed (for example \"Payment Approver over $10,000\").\n- Deactivation in the IdP removes NexaFlow access within 40 minutes.","outdated":false},{"doc":"NEXA-012","heading":"Step 5: Workspace and Governance Design (Weeks 1–2)","text":"- One workspace per business unit or major process area.\n- Decide which connectors each workspace may use.\n- Configure promotion rules: flows move Development → Staging → Production with required approval.\n- Nominate Center of Excellence (CoE) admins who approve production changes.","outdated":false},{"doc":"NEXA-012","heading":"Step 6: Network and Relay Setup (Weeks 2–3, if needed)","text":"For on-premise systems:\n1. Customer provisions a Linux or Windows VM (2 vCPU, 8 GB RAM) or Docker host.\n2. Allow outbound TLS 443 to the NexaFlow region endpoint; no inbound ports needed.\n3. Install two Relay instances for high availability.\n4. Register Relays in the Admin Console and test connectivity.\n\nRelay setup requires network and security approvals and commonly adds 1–2 weeks.","outdated":false},{"doc":"NEXA-012","heading":"Step 7: Audit and Compliance Configuration","text":"- Set audit log retention (1 year default, up to 7 years).\n- Configure SIEM streaming to Splunk, Datadog or Microsoft Sentinel.\n- Enable IP allowlisting and session timeout policies.\n- Configure PII redaction and approved AI model list for Agent Studio.","outdated":false},{"doc":"NEXA-012","heading":"Step 8: Enterprise Go-Live Checklist","text":"- [ ] Security review approved and documented\n- [ ] SSO enforced; SCIM provisioning verified\n- [ ] Roles and workspace permissions reviewed by customer security\n- [ ] All in-scope integrations tested in Staging with production credentials\n- [ ] Data migration reconciled and signed off\n- [ ] UAT signed off with zero open critical defects\n- [ ] Failure alerts routed to on-call channels\n- [ ] Audit log streaming confirmed\n- [ ] Rollback plan documented\n- [ ] Go/no-go meeting held 2 business days before cutover\n- [ ] Hypercare contacts and schedule shared","outdated":false},{"doc":"NEXA-012","heading":"Enterprise Setup and the Overall Timeline","text":"| Scenario | Environment Setup Duration | Overall Timeline |\n|---|---|---|\n| Multi-tenant, SSO + SCIM, standard review | Week 2 | 4–6 weeks |\n| Single-tenant or customer-managed keys | Weeks 2–3 | 6–8 weeks |\n| Single-tenant + Relay + extended security review | Weeks 3–5 | 8–12 weeks |","outdated":false},{"doc":"NEXA-014","heading":"Summary","text":"A standard NexaFlow Enterprise implementation takes **4–6 weeks** from kickoff to go-live, followed by 30 days of hypercare. Complex deployments typically take **8–12 weeks**, depending on the number of integrations, the volume of data migration, security review requirements and stakeholder availability. This document gives the week-by-week plan, milestones and the criteria used to classify a project as standard or complex. Phase descriptions are in `onboarding_guide.md`.","outdated":false},{"doc":"NEXA-014","heading":"Key Facts","text":"- Standard enterprise implementation: 4–6 weeks from kickoff to go-live.\n- Complex deployments: 8–12 weeks.\n- Main drivers of complexity: integrations, data migration volume, security review and stakeholder availability.\n- 30-day hypercare follows every enterprise go-live.\n- Security review should start at contract signature to protect the timeline.","outdated":false},{"doc":"NEXA-014","heading":"Standard Enterprise Timeline (4–6 Weeks)","text":"| Week | Phase | Key Activities | Milestone |\n|---|---|---|---|\n| Week 1 | 1. Discovery and Requirements | Kickoff, process workshops, system inventory, success metrics | Requirements signed off (end of week 1) |\n| Weeks 1–2 | 2. Solution Design | Workflow and agent design, roles, integration architecture | Solution Design approved |\n| Week 2 | 3. Environment Setup | Tenant provisioning, SSO, SCIM, workspaces, roles | Environments ready |\n| Weeks 2–3 | 4. Integration Configuration | Connect up to 5 systems, field mapping, build flows in Dev | Integrations working in Dev |\n| Weeks 3–4 | 5. Data Migration | Cleanse, map, test load, full migration (up to 1M records) | Migration validated |\n| Weeks 4–5 | 6. Testing | SIT, UAT in Staging, defect fixing | UAT sign-off |\n| Week 5 | 7. User Training | Admin, builder, operator and approver training | Training complete |\n| Weeks 5–6 | 8. Go-Live | Go/no-go meeting, cutover, production promotion | Live in Production |\n| +30 days | 9. Post-Launch Support | Hypercare, adoption tracking, CSM handover | Hypercare exit review |\n\nSimple projects with few integrations and minimal migration go live at the end of week 4. Most standard projects go live in week 5 or 6.","outdated":false},{"doc":"NEXA-014","heading":"Complex Enterprise Timeline (8–12 Weeks)","text":"| Weeks | Phase |\n|---|---|\n| Weeks 1–2 | Discovery and requirements (multiple business units or regions) |\n| Weeks 2–3 | Solution design, security review in parallel |\n| Weeks 3–4 | Environment setup (single-tenant or data residency adds ~1 week), Relay installation |\n| Weeks 4–6 | Integration configuration (6+ systems, custom APIs, on-premise) |\n| Weeks 5–8 | Data migration (above 1M records, multiple migration cycles) |\n| Weeks 7–10 | Testing, including performance and security testing |\n| Weeks 9–11 | Training by role and region, often in waves |\n| Weeks 10–12 | Go-live (sometimes phased by business unit) |\n| +30 days | Hypercare |","outdated":false},{"doc":"NEXA-014","heading":"Standard vs Complex: Classification Criteria","text":"A project is planned as **complex (8–12 weeks)** if any two of the following apply, or if any one applies at large scale:\n\n| Factor | Standard (4–6 weeks) | Complex (8–12 weeks) |\n|---|---|---|\n| Integrations | Up to 5 pre-built connectors | 6+ integrations, custom APIs, or on-premise via Relay |\n| Data migration | Up to 1 million records, one source | Over 1 million records or multiple legacy sources |\n| Security review | Standard questionnaire + SOC 2 (1–2 weeks) | Custom security assessment, penetration test coordination, HIPAA BAA, regulator requirements |\n| Deployment | Multi-tenant, standard region | Single-tenant, customer-managed keys, strict data residency |\n| Scope | 1–2 business units | Multiple business units, regions or languages |\n| Stakeholder availability | Dedicated project lead and timely UAT | Limited availability, many approvers, change freezes |\n\nComplex projects use the $35,000 Complex Implementation package; standard projects use the $15,000 Standard package (see `pricing_guide_v3.md`).","outdated":false},{"doc":"NEXA-014","heading":"Critical Path and Dependencies","text":"1. **Security review** must be approved before production credentials are issued; start it at contract signature, not at kickoff.\n2. **SSO configuration** depends on the customer's identity team and often takes 2–5 business days of their time.\n3. **Sandbox access** for each integrated system must be available by the start of week 2.\n4. **Data extracts** must be delivered by the start of week 3.\n5. **UAT testers** must be booked for weeks 4–5.\n\nA delay in any of these moves the go-live date by at least the same amount.","outdated":false},{"doc":"NEXA-014","heading":"Most Common Reasons Timelines Slip","text":"| Cause | Typical Impact |\n|---|---|\n| Security review not started early | +2 to +4 weeks |\n| Integration sandbox unavailable | +1 to +2 weeks |\n| Poor data quality found during test load | +1 to +3 weeks |\n| Stakeholders unavailable for workshops or UAT | +1 to +2 weeks |\n| Scope added after design sign-off | +1 week per major workflow |","outdated":false},{"doc":"NEXA-014","heading":"How to Communicate Timelines to Customers","text":"- Quote \"4–6 weeks for a standard enterprise implementation\" only after checking the classification criteria.\n- For regulated industries (financial services, healthcare) or on-premise systems, set expectations at 8–12 weeks.\n- Always state that 30 days of hypercare follow go-live.\n- Never promise a go-live date before discovery is complete.","outdated":false},{"doc":"NEXA-018","heading":"Summary","text":"This guide describes how new NexaFlow customers are onboarded, from contract signature to post-launch support. Enterprise customers follow a nine-phase guided implementation that typically takes 4–6 weeks, while complex deployments take 8–12 weeks. The week-by-week schedule is defined in `implementation_timeline.md`, and Enterprise-specific technical setup (SSO, SCIM, workspaces, data residency) is covered in `enterprise_setup.md`.","outdated":false},{"doc":"NEXA-018","heading":"Key Facts","text":"- Enterprise onboarding has nine phases: discovery, solution design, environment setup, integration configuration, data migration, testing, training, go-live, post-launch support.\n- Standard enterprise timeline: 4–6 weeks; complex deployments: 8–12 weeks.\n- Kickoff occurs within 5 business days of signature.\n- 30-day hypercare follows go-live.\n- Customers must supply a sponsor, project lead, sandbox access and UAT testers.","outdated":false},{"doc":"NEXA-018","heading":"Onboarding Paths by Plan","text":"| Plan | Onboarding Path | Typical Duration |\n|---|---|---|\n| Starter | Self-serve: online academy, templates, in-app checklist | 1–3 days |\n| Professional | Self-serve or optional Quick Start package ($5,000) | 2 weeks with Quick Start |\n| Enterprise | Guided implementation (required) | 4–6 weeks standard; 8–12 weeks complex |\n\nThe rest of this guide focuses on the Enterprise guided implementation.","outdated":false},{"doc":"NEXA-018","heading":"The Enterprise Onboarding Process: Nine Phases","text":"**Phase 1 — Discovery and Requirements**\nA kickoff meeting within 5 business days of contract signature introduces both teams. The NexaFlow solution architect runs discovery workshops to document the processes in scope, systems to integrate, data to migrate, security requirements, success metrics and the target go-live date. Output: signed-off Requirements Document.\n\n**Phase 2 — Solution Design**\nThe solution architect designs the workflows, AI agents, workspace structure, roles and integration architecture. The customer reviews and approves the Solution Design Document. Changes after sign-off go through a change request.\n\n**Phase 3 — Environment Setup**\nNexaFlow provisions the tenant in the chosen region with Development, Staging and Production environments. The customer's IT team configures SSO, and for Enterprise, SCIM provisioning and role mapping. Details in `enterprise_setup.md`.\n\n**Phase 4 — Integration Configuration**\nThe integration engineer connects the in-scope systems (up to 5 in the standard package) using service accounts, maps fields and builds the flows in Development. On-premise systems require installing NexaFlow Relay.\n\n**Phase 5 — Data Migration**\nHistorical or reference data (for example open purchase requests, supplier lists or active cases) is cleansed, mapped, test-loaded and then migrated. The standard package covers up to 1 million records. See `data_migration_process.md`.\n\n**Phase 6 — Testing**\nSystem integration testing (SIT) is run by NexaFlow; user acceptance testing (UAT) is run by the customer's business users in Staging using real scenarios. Go-live requires zero open critical defects and UAT sign-off.\n\n**Phase 7 — User Training**\nRole-based training for admins, builders, operators and approvers, delivered live and through the NexaFlow Academy. See `training_and_adoption.md`.\n\n**Phase 8 — Go-Live**\nFlows are promoted to Production following a go-live checklist and cutover plan, usually mid-week with a rollback plan ready. A go/no-go meeting is held 2 business days before cutover.\n\n**Phase 9 — Post-Launch Support (Hypercare)**\n30 days of hypercare after go-live: daily check-ins in week 1, twice-weekly afterwards, priority defect resolution and a handover to the named Customer Success Manager. The hypercare period is **in addition to** the 4–6 week implementation window.","outdated":false},{"doc":"NEXA-018","heading":"Roles and Responsibilities","text":"| NexaFlow | Customer |\n|---|---|\n| Engagement Manager — plan, status, risks | Executive Sponsor — decisions, priority, escalation |\n| Solution Architect — discovery and design | Project Lead — day-to-day coordination (about 50% time) |\n| Integration Engineer — connectors, migration | IT/Identity Admin — SSO, SCIM, network, Relay |\n| Trainer — role-based training | Process Owners — requirements and UAT |\n| Customer Success Manager — adoption after launch | Security Team — security review and approvals |","outdated":false},{"doc":"NEXA-018","heading":"What the Customer Must Provide","text":"- A named executive sponsor and project lead before kickoff.\n- Access to sandbox instances of each system to be integrated.\n- Service accounts with required permissions.\n- Sample and full data extracts for migration.\n- Security questionnaire responses and approvals.\n- UAT testers available during testing weeks.","outdated":false},{"doc":"NEXA-018","heading":"Governance","text":"- Weekly status meeting and written status report (RAG status: red/amber/green).\n- Steering committee every two weeks for Enterprise projects.\n- Risks that threaten the go-live date are escalated within 2 business days.","outdated":false},{"doc":"NEXA-018","heading":"What Slows Onboarding Down","text":"The most common causes of delay are late security review approval, unavailable sandbox systems, unclear data ownership, and business stakeholders not available for workshops or UAT. When these factors apply from the start, the project is planned on the complex 8–12 week track.","outdated":false},{"doc":"NEXA-025","heading":"Summary","text":"User training is Phase 7 of NexaFlow onboarding and typically happens in week 5 of a standard 4–6 week enterprise implementation. This document describes role-based training tracks, NexaFlow Academy certifications, the champions program, change management practices and adoption metrics tracked during the 30-day hypercare period and beyond.","outdated":false},{"doc":"NEXA-025","heading":"Key Facts","text":"- Training is Phase 7, usually week 5 of a standard enterprise implementation.\n- Enterprise gets role-based tracks for admins, builders, agent builders, operators and approvers.\n- Approvers need only a 10-minute video; operators a 90-minute session.\n- Adoption target: 70% weekly active users by day 30, 85% by day 90.\n- Hypercare lasts 30 days after go-live, then CSM handover and QBRs.","outdated":false},{"doc":"NEXA-025","heading":"Training Included by Plan","text":"| Plan | Included Training |\n|---|---|\n| Starter | Self-paced NexaFlow Academy courses |\n| Professional | Academy + 2 live virtual sessions (admin and builder) |\n| Enterprise | Full role-based training program, train-the-trainer, champions program |\n\nOn-site custom workshops are available for $4,000 per day (see `pricing_guide_v3.md`).","outdated":false},{"doc":"NEXA-025","heading":"Role-Based Training Tracks (Enterprise)","text":"| Track | Audience | Format | Duration | Outcome |\n|---|---|---|---|---|\n| Platform Admin | IT and CoE admins | Live virtual + labs | 2 × 3-hour sessions | Manage users, roles, SSO, connectors, audit logs |\n| Flow Builder | Business analysts, automation team | Live + hands-on project | 3 × 3-hour sessions | Build, test and publish flows |\n| Agent Builder | Advanced builders | Live + labs | 2 × 3-hour sessions | Configure AI agents, knowledge sources, thresholds |\n| Operator | Teams handling exceptions and queues | Live virtual | 1 × 90 minutes | Work queues, approvals, dashboards |\n| Approver / Viewer | Managers and approvers | 10-minute video + quick guide | Self-paced | Approve in Slack/Teams/email, read dashboards |\n\nTraining uses the customer's own workflows from Staging, not generic demos, so users practise on processes they will actually run.","outdated":false},{"doc":"NEXA-025","heading":"Training Schedule Within Onboarding","text":"- **Week 2:** Platform Admin training (so IT can configure SSO and roles).\n- **Weeks 2–3:** Flow Builder training for the customer's automation team (they build alongside NexaFlow).\n- **Week 5:** Operator and Approver training, close to go-live so knowledge is fresh.\n- **Go-live week:** floor support and open \"office hours\" sessions.\n\nFor complex 8–12 week projects, operator training is delivered in waves by business unit or region.","outdated":false},{"doc":"NEXA-025","heading":"NexaFlow Academy Certifications","text":"| Certification | Requirement |\n|---|---|\n| NexaFlow Certified Admin | Course + 40-question exam |\n| NexaFlow Certified Builder | Course + build project reviewed by NexaFlow |\n| NexaFlow Certified Agent Designer | Builder certification + agent project |\n\nEnterprise customers receive 10 free certification vouchers per year.","outdated":false},{"doc":"NEXA-025","heading":"Champions Program","text":"Each department nominates one or two champions who:\n- attend extra training and a monthly champions call,\n- act as first-line support for colleagues,\n- collect improvement ideas for new workflows,\n- share wins in internal channels.\n\nCustomers with active champions reach target adoption about 30% faster than those without.","outdated":false},{"doc":"NEXA-025","heading":"Change Management Practices","text":"1. **Explain the why** — the executive sponsor announces the change and the expected benefits before training.\n2. **Start small** — launch with 2–3 high-value workflows rather than everything at once.\n3. **Remove the old path** — retire the legacy spreadsheet or email process shortly after go-live so users do not work in two places.\n4. **Celebrate early wins** — share hours saved and faster cycle times from Command Center dashboards.\n5. **Listen** — run a feedback survey at day 14 and day 30.","outdated":false},{"doc":"NEXA-025","heading":"Adoption Metrics","text":"| Metric | Target by Day 30 | Target by Day 90 |\n|---|---|---|\n| Licensed users active weekly | 70% | 85% |\n| Workflows in production vs planned | 100% of phase 1 | Phase 2 started |\n| Exceptions resolved within SLA | 90% | 95% |\n| Approvals completed in Slack/Teams/email | 60% | 80% |\n| AI agent override rate | Below 15% | Below 10% |","outdated":false},{"doc":"NEXA-025","heading":"Post-Launch Support and Customer Success","text":"- **Hypercare (first 30 days after go-live):** daily check-ins in week 1, then twice weekly; priority defect handling; weekly adoption report.\n- **Hypercare exit review:** adoption metrics reviewed and handover to the named Customer Success Manager.\n- **Quarterly business reviews:** ROI, adoption, roadmap and next workflows to automate.\n- **Health score:** combines usage, support tickets and executive engagement to flag at-risk accounts.","outdated":false},{"doc":"NEXA-006","heading":"Summary","text":"This FAQ gives short, customer-safe answers to the questions prospects ask most often during sales conversations. Answers are intentionally brief and point to the authoritative documents for detail. Because this is a summary document, the linked source should be used when a precise figure (price, timeline, limit) matters.","outdated":false},{"doc":"NEXA-006","heading":"Key Facts","text":"- Short, customer-safe answers; authoritative detail lives in linked documents.\n- NexaFlow is cloud-only; no on-premise installation.\n- Standard enterprise implementation: 4–6 weeks; complex: 8–12 weeks.\n- Customer data is never used to train AI models.\n- 14-day free trial on Starter and Professional.","outdated":false},{"doc":"NEXA-006","heading":"About the Product › What does NexaFlow do?","text":"**What does NexaFlow do?**\nNexaFlow is a workflow automation and AI operations platform. It connects your business systems, automates multi-step processes and uses governed AI agents for tasks like classification, document extraction and summarisation. (Source: `product_overview.md`)","outdated":false},{"doc":"NEXA-006","heading":"About the Product › Who is NexaFlow for?","text":"**Who is NexaFlow for?**\nMid-sized and enterprise organisations, typically 500–10,000 employees, in manufacturing, financial services, healthcare, retail and professional services.","outdated":false},{"doc":"NEXA-006","heading":"About the Product › Do we need developers to use it?","text":"**Do we need developers to use it?**\nNo. Business analysts build flows in the visual Flow Builder. Developers can extend the platform through the REST and GraphQL APIs.","outdated":false},{"doc":"NEXA-006","heading":"About the Product › Which systems do you integrate with?","text":"**Which systems do you integrate with?**\nMore than 200, including Salesforce, SAP S/4HANA, Oracle NetSuite, Workday, ServiceNow, Microsoft 365, Slack and Snowflake. On-premise systems connect through NexaFlow Relay on Enterprise. (Source: `integration_guide.md`)","outdated":false},{"doc":"NEXA-006","heading":"About the Product › Is there an API?","text":"**Is there an API?**\nYes — REST and GraphQL APIs, webhooks, and Python and JavaScript SDKs.","outdated":false},{"doc":"NEXA-006","heading":"About the Product › Can NexaFlow be installed on-premise?","text":"**Can NexaFlow be installed on-premise?**\nNo. NexaFlow is cloud-only, with single-tenant and data residency options for Enterprise.","outdated":false},{"doc":"NEXA-006","heading":"AI › How do the AI agents work?","text":"**How do the AI agents work?**\nAgents are configured in Agent Studio with instructions, permitted tools and knowledge sources. They work inside workflows and can require human approval.","outdated":false},{"doc":"NEXA-006","heading":"AI › Is our data used to train AI models?","text":"**Is our data used to train AI models?**\nNo. Customer data is never used for model training, and LLM providers operate with zero data retention.","outdated":false},{"doc":"NEXA-006","heading":"AI › Can we control which AI models are used?","text":"**Can we control which AI models are used?**\nEnterprise customers can restrict agents to an approved model list or bring their own LLM key.","outdated":false},{"doc":"NEXA-006","heading":"Security and Compliance › Is NexaFlow secure?","text":"**Is NexaFlow secure?**\nYes. NexaFlow is SOC 2 Type II and ISO 27001 certified, GDPR compliant, and offers HIPAA BAAs on Enterprise. (Source: `security_overview.md`)","outdated":false},{"doc":"NEXA-006","heading":"Security and Compliance › Do you support SSO and role-based access?","text":"**Do you support SSO and role-based access?**\nSSO (SAML/OIDC) is available on Professional and Enterprise. Role-based access control is available on all plans, with custom roles on Enterprise.","outdated":false},{"doc":"NEXA-006","heading":"Security and Compliance › Do you provide audit logs?","text":"**Do you provide audit logs?**\nYes, on Professional (90 days) and Enterprise (1 year, extendable to 7 years, with SIEM streaming).","outdated":false},{"doc":"NEXA-006","heading":"Security and Compliance › Where is our data stored?","text":"**Where is our data stored?**\nAWS in the US, EU or APAC depending on plan and choice.","outdated":false},{"doc":"NEXA-006","heading":"Security and Compliance › Who owns our data?","text":"**Who owns our data?**\nYou do. Data can be exported at any time and is deleted within 30 days of contract end.","outdated":false},{"doc":"NEXA-006","heading":"Implementation and Support › How long does implementation take?","text":"**How long does implementation take?**\nStarter customers are up and running in days. A standard enterprise implementation typically takes 4–6 weeks; complex projects take 8–12 weeks. (Source: `implementation_timeline.md`)","outdated":false},{"doc":"NEXA-006","heading":"Implementation and Support › What does the onboarding process look like?","text":"**What does the onboarding process look like?**\nDiscovery, solution design, environment setup, integration configuration, data migration, testing, training, go-live and 30 days of post-launch support. (Source: `onboarding_guide.md`)","outdated":false},{"doc":"NEXA-006","heading":"Implementation and Support › What support do you offer?","text":"**What support do you offer?**\nEmail support on Starter, email and chat on Professional, and 24/7 phone, chat and email with a named Customer Success Manager on Enterprise.","outdated":false},{"doc":"NEXA-006","heading":"Implementation and Support › What is your uptime commitment?","text":"**What is your uptime commitment?**\n99.5% on Professional and 99.9% on Enterprise.","outdated":false},{"doc":"NEXA-006","heading":"Implementation and Support › Do you provide training?","text":"**Do you provide training?**\nYes. All customers get NexaFlow Academy; Enterprise customers receive a role-based training program. (Source: `training_and_adoption.md`)","outdated":false},{"doc":"NEXA-006","heading":"Pricing and Contracts › How is NexaFlow priced?","text":"**How is NexaFlow priced?**\nPer user per month, with three plans: Starter, Professional and Enterprise. Annual billing is cheaper than monthly billing. For current prices see `pricing_guide_v3.md` or ask your account executive.","outdated":false},{"doc":"NEXA-006","heading":"Pricing and Contracts › Is there a free trial?","text":"**Is there a free trial?**\nYes, 14 days on Starter and Professional. Enterprise customers can run a paid 60-day pilot credited against the first year.","outdated":false},{"doc":"NEXA-006","heading":"Pricing and Contracts › Do approvers need a paid license?","text":"**Do approvers need a paid license?**\nNo. People who only approve requests via email, Slack or Teams do not need a paid license. (Source: `licensing_model.md`)","outdated":false},{"doc":"NEXA-006","heading":"Pricing and Contracts › What contract lengths are available?","text":"**What contract lengths are available?**\nMonthly or annual for Starter and Professional; 1, 2 or 3 years for Enterprise.","outdated":false},{"doc":"NEXA-006","heading":"Results","text":"**What results do customers see?**\nExamples include a 40% reduction in manual work at a manufacturer, 35% faster processing at a financial services firm, 20 hours saved per week at a consulting firm and 30% fewer errors at a retailer. Typical payback is 6–9 months.\n\n**Can we speak to a reference customer?**\nYes. References in your industry can be arranged at the proposal stage.","outdated":false},{"doc":"NEXA-008","heading":"Summary","text":"This script defines the standard 45-minute NexaFlow solution demo used at Stage 3 of the sales process. It follows a tell-show-tell structure built around the prospect's own process discovered earlier. It includes preparation steps, a timed agenda, talking points for each section, handling questions during the demo and recommended next steps.","outdated":false},{"doc":"NEXA-008","heading":"Key Facts","text":"- Standard demo: 45 minutes, tell-show-tell, built on the prospect's own process.\n- Start with the Command Center outcome, then show the end-to-end workflow with an AI agent.\n- Show security: SSO, RBAC, audit logs, environment promotion.\n- State implementation as 4–6 weeks standard, 8–12 weeks complex.\n- Always end with a dated next step and a recap within 24 hours.","outdated":false},{"doc":"NEXA-008","heading":"Demo Principles","text":"1. **Never demo without discovery.** Use the process, systems and numbers from the discovery call.\n2. **Show their process, not every feature.** One end-to-end workflow beats a feature tour.\n3. **Tell-show-tell.** Say what they will see, show it, then connect it to their pain.\n4. **Lead with the outcome.** Start with the dashboard showing results, then show how it is built.\n5. **Stop and check.** Pause after each section: \"How does this compare to how you do it today?\"","outdated":false},{"doc":"NEXA-008","heading":"Preparation Checklist (48 Hours Before)","text":"- [ ] Discovery notes reviewed; pain metrics written on one slide\n- [ ] Demo tenant configured with the prospect's name, logo and relevant connectors (Salesforce, SAP, ServiceNow, etc.)\n- [ ] One end-to-end workflow built that mirrors their process\n- [ ] Sample documents loaded for the AI extraction agent (invoice, application form or referral)\n- [ ] Command Center dashboard populated with realistic data\n- [ ] Attendee list confirmed: who is the champion, economic buyer, IT, security?\n- [ ] Relevant case study selected (manufacturing → ManufacturingCo, finance → FinServe, healthcare → HealthPlus, retail → RetailMax, services → Acme)","outdated":false},{"doc":"NEXA-008","heading":"Standard 45-Minute Agenda","text":"| Time | Section | Owner |\n|---|---|---|\n| 0–5 min | Introductions and discovery recap | Account Executive |\n| 5–10 min | The outcome: Command Center dashboard | Solutions Engineer |\n| 10–25 min | End-to-end workflow with AI agent | Solutions Engineer |\n| 25–32 min | Integrations and API | Solutions Engineer |\n| 32–38 min | Security, governance and audit logs | Solutions Engineer |\n| 38–42 min | Implementation approach and customer proof | Account Executive |\n| 42–45 min | Questions and next steps | Account Executive |","outdated":false},{"doc":"NEXA-008","heading":"Section 1: Discovery Recap (0–5 min)","text":"**Say:** \"Last time you told us [process] takes [X days], your team spends [Y hours per week] on manual steps, and [pain, e.g., audit findings]. Today we'll show how that process runs in NexaFlow. Did we get that right? Anything changed?\"\n\nGetting agreement on the pain makes the rest of the demo relevant.","outdated":false},{"doc":"NEXA-008","heading":"Section 2: The Outcome — Command Center (5–10 min)","text":"**Show:** dashboard with cycle time, volume, SLA status, exceptions queue and hours saved.\n**Say:** \"This is what your operations leader would see on day 30: every request, where it's stuck, and how much time automation saved.\"","outdated":false},{"doc":"NEXA-008","heading":"Section 3: End-to-End Workflow (10–25 min)","text":"**Show, in order:**\n1. **Trigger** — a new request arrives (email with attachment, Salesforce update or form).\n2. **AI agent** — Agent Studio extracts fields from the document; show confidence scores and a low-confidence field routed to a human.\n3. **Business rules** — branching by value, region or risk.\n4. **Approval** — approver approves directly in Microsoft Teams or Slack (highlight: approvers need no paid license).\n5. **System update** — record created in the ERP/CRM automatically.\n6. **Exception** — show an error routed to the operator queue with context.\n7. **Flow Builder** — open the canvas to show how a business analyst built and versions it.\n\n**Tell:** \"That process took [X days] with manual re-keying. Here it took minutes, with a human involved only where judgement is needed.\"","outdated":false},{"doc":"NEXA-008","heading":"Section 4: Integrations and API (25–32 min)","text":"**Show:** connector library filtered to their systems; a REST call triggering the flow; webhook configuration.\n**Say:** \"You mentioned [systems]. All have pre-built connectors. For your on-premise [system], NexaFlow Relay connects without opening inbound firewall ports.\"","outdated":false},{"doc":"NEXA-008","heading":"Section 5: Security and Governance (32–38 min)","text":"**Show:** Admin Console — SSO settings, role-based access with a custom role, workspace separation, audit log entries for a flow publish and an AI agent decision, environment promotion Dev → Staging → Production.\n**Say:** \"Your security team will ask who changed what and why the AI decided something. Here is that evidence, immutable and exportable to your SIEM.\"","outdated":false},{"doc":"NEXA-008","heading":"Section 6: Implementation and Proof (38–42 min)","text":"**Say:** \"A standard enterprise implementation takes 4–6 weeks, from discovery to go-live, followed by 30 days of hypercare. More complex projects with many integrations or detailed security reviews take 8–12 weeks.\"\nShare the matching case study headline (for example \"ManufacturingCo reduced manual work by 40% and went live in 6 weeks\").","outdated":false},{"doc":"NEXA-008","heading":"Handling Questions During the Demo","text":"- Pricing question early → \"Happy to cover that; let's make sure it fits first, and I'll walk through options at the end.\" Do not quote prices from memory — use `pricing_guide_v3.md`.\n- Feature you do not have → say so honestly and note it; never fake it.\n- Deep technical question → capture it and schedule a technical session.\n- Objections → use `objection_handling.md`.","outdated":false},{"doc":"NEXA-008","heading":"Recommended Next Steps","text":"| Demo Outcome | Next Step |\n|---|---|\n| Strong fit, champion engaged | ROI workshop within 1 week + send security package |\n| IT/security concerns | Technical deep-dive with solutions architect and security team |\n| Economic buyer absent | Executive summary demo (20 minutes) for economic buyer |\n| Unclear priority | Revisit discovery; quantify cost of inaction |\n| Wants to test | Scoped paid 60-day pilot credited to subscription |\n\nAlways confirm a dated next step before the call ends and send a recap email within 24 hours.","outdated":false},{"doc":"NEXA-017","heading":"Summary","text":"This guide gives recommended responses to the most common objections NexaFlow sellers hear. Each objection includes what is usually behind it, a response framework, proof points and what not to say. The general method is: acknowledge, clarify, respond with evidence, and confirm. Discounts mentioned in any response must follow `discount_policy.md`.","outdated":false},{"doc":"NEXA-017","heading":"Key Facts","text":"- Use ACRC: Acknowledge, Clarify, Respond, Confirm.\n- For \"too expensive\": return to cost of the problem, show 6–9 month payback, right-size scope, and trade any discount for commitment.\n- Multi-year discounts: 5% (2-year), 10% (3-year); larger discounts follow the approval matrix.\n- Security response relies on SOC 2 Type II, ISO 27001, HIPAA BAA, RBAC and audit logs.\n- Standard implementation 4–6 weeks counters \"takes too long\".","outdated":false},{"doc":"NEXA-017","heading":"The ACRC Method","text":"1. **Acknowledge** — show you heard the concern without arguing.\n2. **Clarify** — ask a question to find the real issue.\n3. **Respond** — address the real issue with evidence.\n4. **Confirm** — check the concern is resolved and agree the next step.","outdated":false},{"doc":"NEXA-017","heading":"Objection 1: \"It's too expensive.\"","text":"**What is usually behind it:** no agreed ROI, comparing to a cheaper point tool, budget already allocated elsewhere, or a negotiation tactic.\n\n**Clarifying questions:**\n- \"Too expensive compared to what — another vendor, your budget, or the value you expect?\"\n- \"If price were not a factor, is NexaFlow the right solution?\"\n\n**Response framework:**\n1. **Return to the cost of the problem.** \"You told us your team spends about 60 hours a week on manual steps. At a $45 loaded hourly cost that is over $140,000 a year — before counting errors and delays.\"\n2. **Show payback.** Typical NexaFlow payback is 6–9 months. Build the ROI with their numbers.\n3. **Use a proof point.** \"ManufacturingCo cut manual work by 40%; Acme saves 20 hours a week.\"\n4. **Right-size, don't discount first.** Offer a phased scope (fewer users or workflows in year 1, ramp pricing), or the Professional plan if Enterprise-only features are not needed.\n5. **Trade, don't give.** If a discount is required, exchange it for a multi-year term (5% for 2 years, 10% for 3 years), a case study, or signature by a date — within `discount_policy.md` limits.\n\n**What not to say:** \"I can get you 30% off today.\" Leading with discount devalues the product and needs VP approval anyway.","outdated":false},{"doc":"NEXA-017","heading":"Objection 2: \"We have security concerns.\"","text":"**Clarifying question:** \"Which area worries your security team most — data storage, access control, AI use of data, or compliance?\"\n\n**Response:**\n- SOC 2 Type II and ISO 27001 certified; GDPR compliant; HIPAA BAA available on Enterprise.\n- AES-256 encryption at rest, TLS 1.2+ in transit, optional customer-managed keys.\n- SSO, SCIM, custom RBAC and immutable audit logs with SIEM streaming.\n- Offer the Trust Center package (SOC 2 report, CAIQ) under NDA and a call with NexaFlow's security team.\n- Proof: FinServe Capital (regulated lender) and HealthPlus Medical Group (HIPAA) both passed detailed security reviews.\n\n**Next step:** start the security review now — it protects the implementation timeline. See `security_overview.md`.","outdated":false},{"doc":"NEXA-017","heading":"Objection 3: \"We don't trust AI to make decisions.\"","text":"**Response:**\n- AI agents in NexaFlow work inside defined workflows with only the tools they are granted.\n- Confidence thresholds route uncertain cases to humans; approvals can be required for any action.\n- Every agent input, output and decision is logged and auditable.\n- Customer data is never used to train models.\n- Start with \"AI assists, human approves\" and increase automation as accuracy is proven.","outdated":false},{"doc":"NEXA-017","heading":"Objection 4: \"We can build this ourselves.\"","text":"**Clarifying question:** \"Who would maintain the integrations and AI components two years from now?\"\n\n**Response:** Internal builds carry hidden costs: integration maintenance when APIs change, security reviews, audit logging, monitoring and key-person risk. NexaFlow provides 200+ maintained connectors, governance and 99.9% uptime. Offer to compare the three-year total cost of ownership.","outdated":false},{"doc":"NEXA-017","heading":"Objection 5: \"We already use [lightweight automation tool / RPA].\"","text":"**Response:** Lightweight tools work for simple app-to-app tasks but lack enterprise RBAC, audit logs, environments and scale. RPA bots break when screens change. NexaFlow can coexist: keep simple automations, move critical cross-system processes to a governed platform.","outdated":false},{"doc":"NEXA-017","heading":"Objection 6: \"Implementation will take too long / disrupt our team.\"","text":"**Response:**\n- Standard enterprise implementation is 4–6 weeks; complex deployments are 8–12 weeks.\n- RetailMax went live in 4 weeks, before holiday peak.\n- The customer's project lead needs about 50% of their time; most users need only short training (approvers watch a 10-minute video).\n- 30 days of hypercare follows go-live.","outdated":false},{"doc":"NEXA-017","heading":"Objection 7: \"Now is not the right time.\"","text":"**Clarifying question:** \"What would need to be true for this to become a priority?\"\n\n**Response:** Quantify the cost of waiting (monthly cost of manual work). Offer a paid 60-day pilot credited to the subscription, or align the start date with their budget cycle while completing the security review now.","outdated":false},{"doc":"NEXA-017","heading":"Objection 8: \"Your competitor quoted us less.\"","text":"**Response:** Compare scope, not just price: included workflow runs, AI agents, SSO/SCIM, audit log retention, SLA and implementation. Ask to see what is included. A competitive displacement discount of up to 15% for year 1 exists but requires VP Sales approval.","outdated":false},{"doc":"NEXA-022","heading":"Summary","text":"This is NexaFlow's standard proposal template for Professional and Enterprise opportunities. It contains the required sections, guidance for each, and fill-in placeholders in square brackets. All prices must be taken from `pricing_guide_v3.md` and any discounts must be approved under `discount_policy.md` before a proposal is sent.","outdated":false},{"doc":"NEXA-022","heading":"Key Facts","text":"- Proposals are valid for 30 days.\n- Prices must come from `pricing_guide_v3.md`; discounts need prior approval.\n- Proposals must include ROI, implementation plan, investment summary and next steps.\n- Implementation plan follows the nine phases: 4–6 weeks standard, 8–12 weeks complex.\n- Kickoff happens within 5 business days of signature.","outdated":false},{"doc":"NEXA-022","heading":"Before You Start: Proposal Checklist","text":"- [ ] Opportunity is at Stage 5 with MEDDPICC minimums met (`sales_playbook.md`)\n- [ ] ROI numbers agreed with the champion\n- [ ] Implementation track (Standard 4–6 weeks or Complex 8–12 weeks) confirmed with the implementation lead\n- [ ] Prices taken from `pricing_guide_v3.md` (never from older price sheets or the v2 table in `pricing_faq.md`)\n- [ ] Discount approval recorded in the CRM\n- [ ] Relevant case study selected","outdated":false},{"doc":"NEXA-022","heading":"PROPOSAL TEMPLATE","text":"**NexaFlow Proposal for [Customer Name]**\nPrepared for: [Economic Buyer Name, Title]\nPrepared by: [Account Executive Name]\nDate: [Date] — Valid for 30 days\n\n#### 1. Executive Summary\n\n*Guidance: one page maximum. Written for the economic buyer. Lead with their outcome, not our features.*\n\n[Customer Name] wants to [business goal, e.g., \"reduce supplier onboarding time and manual procurement work across four plants\"]. Today, [describe current process and pain in one or two sentences, using the customer's numbers].\n\nNexaFlow will automate [number] priority workflows across [systems], using governed AI agents with full audit trails. Based on the figures agreed with your team, we expect [primary metric, e.g., \"a 35% reduction in processing time\"] and payback within [X] months.\n\n#### 2. Understanding of Your Current Situation\n\n*Guidance: prove we listened. Use discovery notes.*\n\n- Process(es) in scope: [list]\n- Volume: [transactions per month]\n- Systems involved: [list]\n- Key challenges: [3–5 bullet points with numbers]\n- Why now: [trigger event]\n\n#### 3. Proposed Solution\n\n*Guidance: map each challenge to a NexaFlow capability. Avoid a full feature list.*\n\n| Challenge | NexaFlow Solution | Module |\n|---|---|---|\n| [e.g., Manual re-keying from PDFs] | [AI document extraction agent] | Agent Studio |\n| [e.g., Approvals lost in email] | [Approval routing in Teams] | Flow Builder |\n| [e.g., No visibility] | [Real-time SLA dashboard] | Command Center |\n\nIntegrations: [list connectors; note premium connectors or Relay if needed]\nSecurity and compliance requirements met: [SSO, SCIM, audit logs, data residency, BAA]\n\n#### 4. Expected Business Outcomes and ROI\n\n| Value Driver | Assumption | Annual Value |\n|---|---|---|\n| Hours saved | [hours/week] × 52 × $[loaded hourly cost] | $[amount] |\n| Error reduction | [errors avoided] × $[cost per error] | $[amount] |\n| Faster cycle time | [impact] | $[amount] |\n| **Total annual value** | | **$[amount]** |\n\nPayback period: [months]. Three-year ROI: [percentage].\n\nReference customer: [Case study name and headline metric, e.g., \"ManufacturingCo Industries — 40% reduction in manual work\"].\n\n#### 5. Implementation Plan\n\n*Guidance: use the implementation track confirmed with the implementation lead. Do not promise dates before discovery.*\n\n| Phase | Timing |\n|---|---|\n| Discovery and requirements | Week [1] |\n| Solution design | Weeks [1–2] |\n| Environment setup | Week [2] |\n| Integration configuration | Weeks [2–3] |\n| Data migration | Weeks [3–4] |\n| Testing | Weeks [4–5] |\n| User training | Week [5] |\n| Go-live | Weeks [5–6] |\n| Post-launch hypercare | 30 days after go-live |\n\nEstimated go-live: [4–6 weeks / 8–12 weeks] after kickoff, subject to security review and stakeholder availability.\n\n#### 6. Investment Summary\n\n| Item | Quantity | Unit Price | Annual Total |\n|---|---|---|---|\n| NexaFlow [Plan] subscription | [users] | $[per user/month] | $[amount] |\n| Add-ons [e.g., extended audit retention] | [qty] | $[price] | $[amount] |\n| Multi-year discount [2-year 5% / 3-year 10%] | | | –$[amount] |\n| **Annual subscription** | | | **$[amount]** |\n| Implementation [Standard / Complex] (one-time) | 1 | $[15,000 / 35,000] | $[amount] |\n\nContract term: [1/2/3] years. Billing: annual in advance, Net 30.\n\n#### 7. Why NexaFlow\n\n- Standard enterprise go-live in 4–6 weeks\n- Governed AI agents with human approval and full audit logs\n- SOC 2 Type II, ISO 27001, GDPR, HIPAA BAA available\n- 200+ integrations including [customer's key systems]\n- Named Customer Success Manager and 30-day hypercare\n\n#### 8. Next Steps\n\n1. [Date] — Review proposal with [Economic Buyer]\n2. [Date] — Complete security review\n3. [Date] — Legal and procurement review of order form\n4. [Date] — Signature\n5. [Date] — Implementation kickoff (within 5 business days of signature)","outdated":false},{"doc":"NEXA-022","heading":"Writing Tips","text":"- Use the customer's language and numbers throughout.\n- Keep the proposal under 10 pages; put detail in appendices.\n- Never include internal price floors or approval notes.\n- Send as PDF and walk through it live rather than emailing cold.","outdated":false},{"doc":"NEXA-023","heading":"Summary","text":"This playbook defines how NexaFlow sells: the ideal customer profile, buyer personas, core messaging, discovery questions, qualification criteria and sales stages from first meeting to signature. It links to specialised documents for objections (`objection_handling.md`), demos (`demo_script.md`), proposals (`proposal_template.md`) and pricing (`pricing_guide_v3.md`).","outdated":false},{"doc":"NEXA-023","heading":"Key Facts","text":"- ICP: 500–10,000 employees with 3+ disconnected core systems.\n- Qualification uses MEDDPICC; champion and economic buyer must be named by Stage 2.\n- Three value pillars: speed to value, governed AI, enterprise-ready.\n- Typical payback: 6–9 months; Enterprise sales cycle 60–120 days.\n- Start security review in Stage 4 to protect implementation timelines.","outdated":false},{"doc":"NEXA-023","heading":"Ideal Customer Profile (ICP)","text":"| Attribute | Ideal Fit |\n|---|---|\n| Company size | 500–10,000 employees |\n| Industries | Manufacturing, financial services, healthcare, retail, professional services |\n| Systems | 3+ core business systems (ERP, CRM, HRIS, ITSM) that do not talk to each other |\n| Pain signal | Manual handoffs, spreadsheets, email approvals, SLA misses, audit findings |\n| Operations maturity | Named process owners; some existing automation (scripts, RPA) that is hard to maintain |\n| Budget | $40,000–$500,000 annual software budget for operations tooling |\n| Buying trigger | Growth without headcount, ERP migration, new compliance requirements, M&A integration |\n\n**Poor fit:** companies under 50 employees wanting only simple app-to-app automation, or buyers seeking a fully on-premise product (NexaFlow is cloud-only).","outdated":false},{"doc":"NEXA-023","heading":"Buyer Personas","text":"| Persona | Cares About | Key Message |\n|---|---|---|\n| COO / VP Operations (economic buyer) | Cost, capacity, SLAs | \"Add capacity without adding headcount.\" |\n| CIO / Head of IT | Security, governance, integration sprawl | \"One governed platform instead of scattered scripts.\" |\n| CFO / Finance leader | ROI, payback, controls | \"Payback typically in 6–9 months with full audit trails.\" |\n| Process owner (champion) | Daily pain, team workload | \"Your team stops copy-pasting and chasing approvals.\" |\n| Security / Compliance | Risk, data privacy, AI governance | \"SOC 2 Type II, ISO 27001, HIPAA BAA, logged AI decisions.\" |","outdated":false},{"doc":"NEXA-023","heading":"Core Messaging","text":"**Positioning statement:** NexaFlow is the AI operations platform that lets mid-sized and enterprise companies automate cross-system business processes with governed AI agents — live in weeks, not quarters.\n\n**Three value pillars:**\n1. **Speed to value** — standard enterprise implementation in 4–6 weeks.\n2. **AI you can govern** — every agent decision logged, with human approval gates.\n3. **Enterprise-ready** — security certifications, RBAC, audit logs, 200+ integrations, 99.9% SLA.\n\n**Proof points:** 40% reduction in manual work (ManufacturingCo), 35% faster processing (FinServe), 20 hours saved per week (Acme), 30% fewer errors (RetailMax).","outdated":false},{"doc":"NEXA-023","heading":"Discovery Questions","text":"**Current state**\n- Walk me through the process from start to finish. Where does it start and who touches it?\n- Which systems are involved, and where is data re-keyed?\n- How many requests or transactions go through this process each month?\n\n**Pain and impact**\n- How long does it take today, and how long should it take?\n- How many hours per week does your team spend on manual steps?\n- What happens when something goes wrong — errors, SLA misses, audit findings?\n\n**Priorities and urgency**\n- Why solve this now? What happens if nothing changes in 12 months?\n- Is there a deadline — peak season, audit, system migration?\n\n**Decision process**\n- Who else will be involved in evaluating and approving this?\n- What does your security review process look like, and how long does it usually take?\n- How have you bought similar software before?\n\n**Technical fit**\n- Do you need SSO, SCIM, audit log retention or data residency?\n- Are any systems on-premise?","outdated":false},{"doc":"NEXA-023","heading":"Qualification Criteria (MEDDPICC)","text":"| Letter | Question to Answer | Minimum to Advance Past Stage 2 |\n|---|---|---|\n| Metrics | What measurable outcome will they achieve? | At least one quantified pain (hours, days, error rate) |\n| Economic Buyer | Who signs? | Identified by name |\n| Decision Criteria | How will they choose? | Documented |\n| Decision Process | Steps to purchase | Mapped, including security review |\n| Paper Process | Legal and procurement steps | Understood before Stage 4 |\n| Identify Pain | Why now? | Clear business impact |\n| Champion | Who sells internally for us? | Named champion with access to EB |\n| Competition | Who else? | Known alternatives, including \"do nothing\" |","outdated":false},{"doc":"NEXA-023","heading":"Sales Stages","text":"| Stage | Name | Exit Criteria |\n|---|---|---|\n| 1 | Discovery | Pain and process documented |\n| 2 | Qualification | MEDDPICC minimums met |\n| 3 | Solution Demo | Tailored demo delivered (`demo_script.md`); champion confirms fit |\n| 4 | Business Case & Security | ROI agreed; security review started |\n| 5 | Proposal | Proposal sent (`proposal_template.md`) with pricing from `pricing_guide_v3.md` |\n| 6 | Negotiation | Terms agreed within `discount_policy.md` |\n| 7 | Closed Won | Signed; handoff to implementation within 2 business days |\n\nTypical Enterprise sales cycle: 60–120 days. Professional: 21–45 days.","outdated":false},{"doc":"NEXA-023","heading":"ROI Positioning","text":"Build ROI with the customer, using their numbers:\n- Hours saved × loaded hourly cost (default assumption $45/hour if unknown).\n- Error reduction × cost per error (rework, write-offs, penalties).\n- Faster cycle time × revenue or customer impact.\n\nTypical NexaFlow customers reach payback in **6–9 months**.","outdated":false},{"doc":"NEXA-023","heading":"Competitive Landscape","text":"| Alternative | How to Position |\n|---|---|\n| Lightweight app-to-app tools | Fine for simple tasks; lack governance, RBAC, audit logs and enterprise scale |\n| Legacy RPA suites | Brittle screen-scraping and high maintenance; NexaFlow uses APIs and AI agents |\n| In-house scripts | Hidden maintenance cost and key-person risk |\n| Do nothing | Quantify cost of manual work per year |","outdated":false},{"doc":"NEXA-023","heading":"Next-Step Recommendations After Each Meeting","text":"- After discovery → book tailored demo with process owner and IT.\n- After demo → run ROI workshop and send security package.\n- After ROI → introduce implementation lead to discuss timeline.\n- Always end with a dated next step in the calendar.","outdated":false},{"doc":"NEXA-001","heading":"Summary","text":"Acme Consulting Group, a 1,200-person professional services firm, used NexaFlow to automate client onboarding, project setup and billing handoffs across Salesforce, NetSuite and Microsoft Teams. The implementation took 5 weeks on the standard Enterprise track. Acme now onboards new clients 25% faster and its project operations team saves 20 hours per week.","outdated":false},{"doc":"NEXA-001","heading":"Key Facts","text":"- Professional services firm, 1,200 employees, Enterprise plan.\n- 25% faster client onboarding (8 days to 6 days).\n- 20 hours saved per week for the project operations team.\n- Implementation took 5 weeks on the standard track.\n- Payback in about 7 months.","outdated":false},{"doc":"NEXA-001","heading":"Customer Profile","text":"| Attribute | Detail |\n|---|---|\n| Industry | Professional services (management and technology consulting) |\n| Headquarters | Chicago, USA, with offices in London and Singapore |\n| Employees | 1,200 |\n| Plan | Enterprise, 150 Full Users |\n| Systems | Salesforce, Oracle NetSuite, Microsoft Teams, SharePoint, DocuSign |\n| Go-live | November 2025 |","outdated":false},{"doc":"NEXA-001","heading":"The Problem","text":"Every time Acme won a new engagement, a chain of manual tasks began. Sales operations re-keyed deal details from Salesforce into NetSuite, the project management office created SharePoint folders and Teams channels by hand, and resource managers chased partners by email to confirm staffing. Conflict-of-interest checks sat in shared inboxes.\n\nThe results:\n- New client onboarding took an average of **8 business days** from signed statement of work to project kickoff.\n- The 6-person project operations team spent roughly **20 hours per week** on copy-paste work and chasing approvals.\n- Around 1 in 12 projects started with incorrect billing rates, causing invoice disputes.\n- Partners had no visibility into where onboarding was stuck.","outdated":false},{"doc":"NEXA-001","heading":"The Implementation","text":"Acme followed NexaFlow's standard nine-phase enterprise onboarding process and went live in **5 weeks**.\n\n| Week | Activity |\n|---|---|\n| 1 | Discovery workshops with sales ops, PMO, finance and risk |\n| 1–2 | Solution design for three priority workflows |\n| 2 | Environment setup with Microsoft Entra ID SSO and SCIM |\n| 2–3 | Salesforce, NetSuite, Teams, SharePoint and DocuSign connectors configured |\n| 3–4 | Migration of 1,400 active client records and rate cards |\n| 4 | UAT with 12 business users |\n| 5 | Role-based training and go-live |\n\nThe project stayed on the standard track because all five systems had pre-built connectors and the data migration was small.","outdated":false},{"doc":"NEXA-001","heading":"The Solution","text":"**Key workflows automated:**\n\n1. **Client onboarding** — when a Salesforce opportunity is marked Closed Won, NexaFlow creates the customer and project in NetSuite, generates the SharePoint folder structure and Teams channel, and sends the welcome pack.\n2. **Conflict check** — an AI agent in Agent Studio summarises the client, related entities and prior engagements, and routes the result to the risk team for approval in Teams.\n3. **Resource staffing requests** — staffing requests are sent to resource managers with skills and availability; approvals happen in Teams.\n4. **Rate card validation** — billing rates are checked against the signed SOW before the project is opened for time entry.\n5. **Kickoff readiness dashboard** — partners see each new client's onboarding status in Command Center.","outdated":false},{"doc":"NEXA-001","heading":"Measurable Results","text":"| Metric | Before | After | Change |\n|---|---|---|---|\n| Client onboarding time | 8 business days | 6 business days | **25% faster onboarding** |\n| Manual work in project operations | ~20 hours/week | Near zero | **20 hours saved per week** |\n| Projects starting with billing rate errors | 1 in 12 | 1 in 50 | **~80% fewer rate errors** |\n| Conflict-check turnaround | 2 days | 4 hours | 75% faster |\n\nPayback on the subscription and implementation fee was achieved in about **7 months**.","outdated":false},{"doc":"NEXA-001","heading":"Customer Quote","text":"\"We used to measure onboarding in emails. Now partners open a dashboard and see exactly where every new client stands.\" — Director of Project Operations, Acme Consulting Group","outdated":false},{"doc":"NEXA-001","heading":"Lessons Learned","text":"- Starting with three workflows kept the project on the 4–6 week track.\n- Letting the AI agent prepare conflict-check summaries, while keeping human approval, built trust with the risk team.\n- Retiring the old onboarding spreadsheet in week 2 after go-live drove adoption.","outdated":false},{"doc":"NEXA-002","heading":"Summary","text":"FinServe Capital, a regional lender with 3,500 employees, used NexaFlow AI agents and workflows to automate commercial loan application intake, KYC checks and credit memo preparation. Because of a detailed security review and an on-premise core banking integration, the project followed the complex implementation track and went live in 10 weeks. FinServe now processes loan applications 35% faster with 30% fewer data entry errors.","outdated":false},{"doc":"NEXA-002","heading":"Key Facts","text":"- Financial services lender, 3,500 employees, Enterprise single-tenant.\n- 35% faster loan processing (12 days to 7.8 days).\n- 30% fewer data entry errors.\n- Complex implementation: 10 weeks, driven by security review, Relay and 7 integrations.\n- Zero KYC audit findings after go-live.","outdated":false},{"doc":"NEXA-002","heading":"Customer Profile","text":"| Attribute | Detail |\n|---|---|\n| Industry | Financial services (commercial and SME lending) |\n| Region | United States, 90 branches |\n| Employees | 3,500 |\n| Plan | Enterprise, 400 Full Users, single-tenant, US region |\n| Systems | On-premise core banking system, Salesforce Financial Services Cloud, DocuSign, Box, ServiceNow, Splunk |\n| Go-live | January 2026 |","outdated":false},{"doc":"NEXA-002","heading":"The Problem","text":"Commercial loan applications arrived as PDFs, scanned documents and emails. Loan processors manually keyed borrower details, financial statements and ownership information into the loan origination system and core banking platform.\n\n- Average time from complete application to credit decision: **12 business days**.\n- Data entry errors in borrower financials triggered rework on roughly **1 in 7 applications**.\n- KYC and beneficial ownership checks were tracked in spreadsheets, creating audit findings.\n- Competitors offering faster decisions were winning SME customers.","outdated":false},{"doc":"NEXA-002","heading":"The Implementation","text":"FinServe followed NexaFlow's nine-phase onboarding process on the **complex track (10 weeks)**. Complexity drivers were an extended security review, single-tenant deployment, on-premise core banking integration via NexaFlow Relay and seven total integrations.\n\n| Weeks | Activity |\n|---|---|\n| 1–2 | Discovery across lending, credit risk, compliance and IT; security review started at signature |\n| 2–3 | Solution design; model risk team reviewed AI agent approach |\n| 3–4 | Single-tenant environment, SSO + SCIM, customer-managed encryption keys |\n| 4–6 | Seven integrations including Relay connection to on-premise core banking |\n| 5–7 | Migration of 2.3 million historical application records for agent context |\n| 7–9 | SIT, UAT, performance testing and penetration test coordination |\n| 9–10 | Training in two waves and phased go-live (SME lending first) |\n| +30 days | Hypercare |\n\nThe security review took five weeks, running in parallel with design and setup.","outdated":false},{"doc":"NEXA-002","heading":"The Solution","text":"**Key workflows automated:**\n\n1. **Loan application intake** — an AI document extraction agent reads financial statements, tax returns and IDs, extracts fields and flags low-confidence values for human review.\n2. **KYC and beneficial ownership checks** — workflows call screening services, compile results and route exceptions to compliance.\n3. **Credit memo preparation** — an agent drafts a credit memo summary from extracted data for the credit analyst to edit and approve.\n4. **Conditions tracking** — outstanding documents are requested from borrowers automatically via DocuSign and email.\n5. **Audit evidence** — every agent decision, approval and data change streams to Splunk for compliance reporting.","outdated":false},{"doc":"NEXA-002","heading":"Measurable Results","text":"| Metric | Before | After | Change |\n|---|---|---|---|\n| Application-to-decision time | 12 business days | 7.8 business days | **35% faster
